        setInsecurities(updated);
        await storageSet("user:insecurities", updated);
        setInsecDraft("");
      }
      async function removeInsecurity(idx) {
        const updated = insecurities.filter((_, i) => i !== idx);
        setInsecurities(updated);
        await storageSet("user:insecurities", updated);
      }

      // ─── AUTH GATE ─────────────────────────────────────────────────
      if (authLoading) return <div style={{ minHeight: '100dvh', background: '#ECE8E6' }} />;
      if (!authUser) return <LoginView />;


      // ─── TOOL: 5 SENSES ────────────────────────────────────────────
      if (view === "tool-senses") {
        const steps = [
          { n: 5, verb: "See", detail: "five things you can see" },
          { n: 4, verb: "Feel", detail: "four things you can physically feel" },
          { n: 3, verb: "Hear", detail: "three things you can hear" },
          { n: 2, verb: "Smell", detail: "two things you can smell" },
          { n: 1, verb: "Taste", detail: "one thing you can taste" },
        ];
        return (
          <Shell key={view}>
            <button style={s.backBtn} onClick={goBackView}>← back</button>
            <h2 style={s.pageTitle}>5 Senses</h2>
            <p style={{ ...s.subNote, marginBottom: 28 }}>List five things you can see, four you can feel, three you can hear, two you can smell, and one you can taste.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {steps.map((step, i) => (
                <div key={i} style={s.groundStep}>
                  <div style={s.groundNum}>{step.n}</div>
                  <div>
                    <div style={s.groundSense}>{step.verb}</div>
                    <div style={s.groundPrompt}>Name {step.detail}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 64, textAlign: "center" }}>
              <button style={{ background: "none", border: "none", color: rust, fontFamily: "'DM Mono', monospace", fontSize: 12, letterSpacing: "0.04em", cursor: "pointer" }} onClick={goBackView}>See all exercises</button>
            </div>
          </Shell>
        );
      }

      // ─── TOOL: MINDFULNESS ─────────────────────────────────────────
      if (view === "tool-mindfulness") {
        return <MindfulnessView onBack={goBackView} onSeeAll={goBackView} />;
      }

      // ─── TOOL: HERE & NOW ──────────────────────────────────────────
      if (view === "tool-here-now") {
        return <WrittenExerciseView exerciseId="here-now" dateKey={todayKey} onBack={goBackView} onFinish={goBackView} />;
      }

      // ─── TOOL: COGNITIVE REFRAMING ─────────────────────────────────
      if (view === "tool-reframing") {
        return <WrittenExerciseView exerciseId="reframing" dateKey={todayKey} onBack={goBackView} onFinish={goBackView} />;
      }

      // ─── TOOL: THOUGHT CHECK ───────────────────────────────────────
      if (view === "tool-thought-check") {
        return <ThoughtCheckView dateKey={todayKey} onBack={goBackView} onSeeAll={goBackView} />;
      }

      // ─── TOOL: ZOOM OUT ─────────────────────────────────────────────
      if (view === "tool-zoom-out") {
        return <WrittenExerciseView exerciseId="zoom-out" dateKey={todayKey} onBack={goBackView} onFinish={goBackView} />;
      }

      // ─── TOOL: ONE SMALL THING ──────────────────────────────────────
      if (view === "tool-one-small-thing") {
        return <WrittenExerciseView exerciseId="one-small-thing" dateKey={todayKey} onBack={goBackView} onFinish={goBackView} />;
      }

      // ─── TOOL: NAME THE PATTERN ─────────────────────────────────────
      if (view === "tool-name-pattern") {
        return <WrittenExerciseView exerciseId="name-pattern" dateKey={todayKey} onBack={goBackView} onFinish={goBackView} />;
      }

      // ─── AFFIRMATION HISTORY VIEW ──────────────────────────────────
      if (view === "affirmation-history") {
        return <AffirmationHistoryView likedIdxs={new Set(ratings.liked || [])} onBack={goBackView}
          onPractice={(a) => { setPracticeAff(a); navigate("affirmation-practice"); }} />;
      }

      if (view === "physical-health") {
        // moodScoreDays is normally computed inside the "profile" branch
        // below (local to that block) — recomputed here from the same
        // historyDays source since this is a separate block/branch.
        const phDaysWithMood = historyDays.filter(d => d.mood && d.mood.length > 0 && !d.future);
        const phMoodScoreDays = phDaysWithMood.map(d => ({ key: d.key, score: d.mood.reduce((acc, m) => acc + moodWeight(m.label, d.key), 0) / d.mood.length }));
        return <PhysicalHealthDetailView ouraSync={ouraSync} onPullOura={pullOura} moodScoreDays={phMoodScoreDays}
          onDisconnectOura={() => setOuraSync({ connected: false, days: [], syncError: null })} onBack={goBackView} />;
      }

      // ─── AFFIRMATION PRACTICE VIEW ───────────────────────────────────
      if (view === "affirmation-practice") {
        return <AffirmationPracticeView affirmation={practiceAff} onBack={goBackView} />;
      }


      // ─── EXERCISES VIEW ───────────────────────────────────────────
      if (view === "exercises") {
        return (
          <Shell key={view}>
            <button style={s.backBtn} onClick={goBackView}>← back</button>
            <h2 style={s.pageTitle}>Exercises</h2>
            <p style={{ ...s.subNote, marginBottom: 24, color: ink }}>Use these when you're triggered, anxious, or need to come back to yourself.</p>
            <div style={s.homeToolsGrid}>
              {[
                { id: "senses", emoji: "👁", title: "5 Senses", sub: "Sensory grounding" },
                { id: "mindfulness", emoji: "🌬", title: "Mindfulness", sub: "Breathing exercise" },
                { id: "here-now", emoji: "🧭", title: "Here & Now", sub: "What can you control?" },
                { id: "reframing", emoji: "💡", title: "Reframing", sub: "Find another angle" },
                { id: "thought-check", emoji: "💭", title: "Thought Check", sub: "Test the evidence" },
                { id: "zoom-out", emoji: "🔭", title: "Zoom Out", sub: "Gain some distance" },
                { id: "one-small-thing", emoji: "🌱", title: "One Small Thing", sub: "A tiny next step" },
                { id: "name-pattern", emoji: "🧩", title: "Name the Pattern", sub: "Spot the thinking trap" },
              ].map(t => (
                <button key={t.id} style={s.homeToolCard} onClick={() => openTool(t.id)}>
                  <ExerciseIcon id={t.id} size={26} color={moss} />
                  <div style={s.homeToolTitle}>{t.title}</div>
                  <div style={s.homeToolSub}>{t.sub}</div>
                </button>
              ))}
            </div>
          </Shell>
        );
      }

      // ─── ALL ENTRIES VIEW ─────────────────────────────────────────
      if (view === "streak-list") {
        const entryDays = historyDays.filter(d => d.hasData);

        return (
          <Shell key={view}>
            <button style={s.backBtn} onClick={goBackView}>← back</button>
            <h2 style={s.pageTitle}>All Entries</h2>
            {entryDays.length === 0 && <p style={s.dimMono}>No entries yet.</p>}
            <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
              {entryDays.map((day, i) => (
                <div key={day.key} style={{ paddingBottom: 20, marginBottom: 20, borderBottom: i < entryDays.length - 1 ? `1px solid rgba(44,59,42,0.08)` : "none" }}>
                  <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: moss, marginBottom: 8 }}>{day.fullDate}</div>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 24 }}>{day.mood ? day.mood.map(m => m.emoji).join(" ") : "—"}</span>
                    <button
                      onClick={() => openDay(day)}
                      style={{ background: "none", border: `1px solid rgba(44,59,42,0.3)`, borderRadius: 999, padding: "6px 18px", fontFamily: "'DM Mono', monospace", fontSize: 11, color: ink, letterSpacing: "0.04em", cursor: "pointer" }}>
                      View
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </Shell>
        );
      }

      // ─── JOURNAL ENTRIES VIEW ─────────────────────────────────────
      if (view === "journal-entries") {
        const journals = historyDays.filter(d => d.journal).map(d => ({ ...d.journal, dateKey: d.key, fullDate: d.fullDate }));
        const YourJournalView = () => {
          const { useState: useS } = React;
          const [tab, setTab] = useS("entries");
          const [query, setQuery] = useS("");
          const [showAddPrompt, setShowAddPrompt] = useS(false);

          if (showAddPrompt) return (
            <AddPromptView
              noTiming={true}
              onBack={() => setShowAddPrompt(false)}
              onAdd={async (p) => {
                const next = [p, ...customPrompts];
                setCustomPrompts(next);
                await storageSet('settings:custom_prompts', next);
                setShowAddPrompt(false);
              }}
            />
          );

          const allPrompts = [...customPrompts, ...DAILY_PROMPTS].slice(0, 10);
          const filteredJournals = journals.filter(j => {
            if (!query.trim()) return true;
            const hay = `${j.text || ''} ${j.prompt || ''} ${j.fullDate || ''} ${j.dateKey || ''}`.toLowerCase();
            return query.toLowerCase().split(/\s+/).filter(w => w.length > 1).some(kw => hay.includes(kw));
          });

          const tabStyle = (active) => ({
            background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11,
            color: active ? ink : moss, letterSpacing: "0.06em", textTransform: "uppercase",
            padding: "0 0 10px", cursor: "pointer",
            borderBottom: active ? `2px solid ${ink}` : "2px solid transparent",
          });

          return (
            <Shell key="your-journal">
              <button style={s.backBtn} onClick={goBackView}>← back</button>
              <h2 style={s.pageTitle}>Your Journal</h2>
              <div style={{ display: "flex", gap: 24, marginBottom: 28, borderBottom: `1px solid rgba(44,59,42,0.1)` }}>
                <button style={tabStyle(tab === "entries")} onClick={() => setTab("entries")}>Entries</button>
                <button style={tabStyle(tab === "prompts")} onClick={() => setTab("prompts")}>Prompts</button>
              </div>

              {tab === "entries" && (
                <>
                  <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="Search by date or keyword…"
                    style={{ width: "100%", background: bone, border: "none", borderRadius: 999, padding: "10px 18px", fontFamily: "'DM Mono', monospace", fontSize: 12, color: ink, letterSpacing: "0.03em", outline: "none", marginBottom: 20 }} />
                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    {journals.length === 0 && <p style={s.dimMono}>No journal entries yet.</p>}
                    {journals.length > 0 && filteredJournals.length === 0 && <p style={s.dimMono}>No entries match your search.</p>}
                    {filteredJournals.map((j, i) => (
                      <div key={j.dateKey || i} style={{ ...s.historyCard, background: bone }}>
                        <div style={s.historyMeta}>
                          <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.06em", textTransform: "uppercase" }}>{j.fullDate}</span>
                        </div>
                        {j.prompt && <><p style={s.historyPromptInk}>"{j.prompt}"</p><div style={{ borderTop: "1px solid rgba(44,59,42,0.12)", margin: "10px 0" }} /></>}
                        <p style={{ ...s.historyText, color: ink }}>{j.text}</p>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {tab === "prompts" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {allPrompts.map((p, i) => {
                    const isCustom = customPrompts.includes(p);
                    return (
                      <div key={i} style={{ background: bone, borderRadius: 14, padding: "16px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                        <span style={{ fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontSize: 15, color: ink, lineHeight: 1.55, flex: 1 }}>{p}</span>
                        {isCustom && (
                          <button onClick={async () => {
                            const next = customPrompts.filter(c => c !== p);
                            setCustomPrompts(next);
                            await storageSet('settings:custom_prompts', next);
                          }} style={{ background: "none", border: "none", color: rust, fontSize: 18, lineHeight: 1, padding: "0 4px", flexShrink: 0, cursor: "pointer" }}>×</button>
                        )}
                      </div>
                    );
                  })}
                  <button onClick={() => setShowAddPrompt(true)}
                    style={{ background: "transparent", border: `1.5px dashed rgba(107,120,102,0.4)`, borderRadius: 14, padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", marginTop: 4 }}>
                    <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: "0.06em" }}>+ Write your own prompt</span>
                  </button>
                </div>
              )}
            </Shell>
          );
        };
        return <YourJournalView />;
      }

      // ─── MOOD BREAKDOWN VIEW ──────────────────────────────────────
      if (view === "mood-breakdown") {
        const allEntries = [];
        (allMoodDays || historyDays).forEach(d => (d.mood || []).forEach(m => allEntries.push(m.label)));
        const total = allEntries.length || 1;
        const counts = {};
        allEntries.forEach(l => { counts[l] = (counts[l] || 0) + 1; });
        const MOOD_WEIGHTS = new Proxy({}, { get: (_, label) => moodWeight(label, '9999-12-31') });
        const sorted = [...ALL_MOODS]
          .map(m => ({ ...m, count: counts[m.label] || 0, pct: Math.round(((counts[m.label] || 0) / total) * 100) }))
          .filter(m => m.count > 0 || !RETIRED_MOODS.some(r => r.label === m.label))
          .sort((a, b) => b.count - a.count);
        const maxCount = sorted[0]?.count || 1;
        return (
          <Shell key={view}>
            <button style={s.backBtn} onClick={goBackView}>← back</button>
            <h2 style={s.pageTitle}>Your moods</h2>
            <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, marginBottom: 20 }}>{allEntries.length} total selections</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sorted.map(m => {
                const w = MOOD_WEIGHTS[m.label] ?? 0;
                const barColor = w >= 1 ? ink : w === 0 ? sage : rust;
                return (
                  <div key={m.label} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ fontSize: 26, width: 34, textAlign: "center", flexShrink: 0 }}>{m.emoji}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: ink }}>{m.label}</span>
                        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss }}>{m.count > 0 ? `${m.pct}%` : "—"}</span>
                      </div>
                      <div style={{ background: "#D5CEC7", borderRadius: 4, height: 6, overflow: "hidden" }}>
                        <div style={{ height: "100%", width: `${(m.count / maxCount) * 100}%`, background: barColor, borderRadius: 4, transition: "width 0.4s ease" }} />
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </Shell>
        );
      }

      // ─── DAY DETAIL VIEW ───────────────────────────────────────────
      if (view === "day-detail" && selectedDay) {
        const day = selectedDay;
        return (
          <Shell key={view}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
              <button style={s.backBtn} onClick={goBackView}>← back</button>
              {day.mood && (
                <button style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: "0.04em", cursor: "pointer", padding: 0, textDecoration: "underline", textUnderlineOffset: 3 }}
                  onClick={() => { setEntryDay(selectedDay); setResumeStep(1); navigate("daily-entry"); }}>
                  edit entry
                </button>
              )}
            </div>
            <div style={{ textAlign: "center", marginTop: 20, marginBottom: 28 }}>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 10 }}>{day.fullDate}</div>
              {day.mood && (
                <>
                  <h2 style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 28, fontStyle: "italic", fontWeight: 400, color: ink, margin: "0 0 20px" }}>
                    {dayVibePhrase(day.mood.reduce((acc, m) => acc + moodWeight(m.label, day.key), 0) / day.mood.length, day.key)}
                  </h2>
                  <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap" }}>
                    {day.mood.map(m => (
                      <div key={m.label} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
                        <span style={{ fontSize: 38 }}>{m.emoji}</span>
                        <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.06em", textTransform: "uppercase" }}>{m.label}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
              {!day.mood && (
                <h2 style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 28, fontStyle: "italic", fontWeight: 400, color: ink, margin: 0 }}>{day.fullDate}</h2>
              )}
            </div>
            {day.affirmation && (
              <div style={{ ...s.affirmationCard, marginBottom: 14, textAlign: "center", background: ink }}>
                <SectionLabel light>Mantra</SectionLabel>
                <p style={s.affirmationText}>{day.affirmation}</p>
              </div>
            )}
            {day.journal?.note && (
              <div style={{ ...s.moodCard, marginBottom: 14 }}>
                <SectionLabel inline>What's behind your feelings</SectionLabel>
                <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, color: ink, lineHeight: 1.7, marginTop: 10 }}>{day.journal.note}</p>
              </div>
            )}
            {day.journal && (
              <div style={s.daySection}>
                <SectionLabel>Journal</SectionLabel>
                {day.journal.prompt && <><p style={s.historyPromptInk}>"{day.journal.prompt}"</p>
                <div style={{ borderTop: "1px solid rgba(44,59,42,0.1)", margin: "10px 0" }} /></>}
                <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, lineHeight: 1.7, color: ink }}>{day.journal.text}</p>
              </div>
            )}
            {day.insight && (
              <div style={s.daySection}>
                <SectionLabel>Insight</SectionLabel>
                <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, lineHeight: 1.7, color: ink, marginTop: 8 }}>{day.insight}</p>
              </div>
            )}
            {day.exercises && day.exercises.length > 0 && (() => {
              const TOOL_NAMES_DD = { senses: "5 Senses", mindfulness: "Mindfulness", "here-now": "Here & Now", reframing: "Reframing", "thought-check": "Thought Check", "zoom-out": "Zoom Out", "one-small-thing": "One Small Thing", "name-pattern": "Name the Pattern" };
              return (
                <div style={{ background: bone, borderRadius: 16, padding: "20px 22px", marginBottom: 14 }}>
                  <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 10 }}>Your Practice</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {day.exercises.map(id => (
                      <div key={id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <ExerciseIcon id={id} size={20} color={ink} />
                        <span style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 17, color: ink }}>{TOOL_NAMES_DD[id] || id}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
            {day.happyHour && (
              <div style={{ background: bone, borderRadius: 16, padding: "20px 22px", marginBottom: 14 }}>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 10 }}>Your Happy Hour</div>
                <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, color: ink, lineHeight: 1.7, margin: 0 }}>{day.happyHour}</p>
              </div>
            )}
            {day.commitment && <CommitmentCard commitment={day.commitment} style={{ marginBottom: 14 }} />}
            {!day.mood && !day.affirmation && !day.journal && !day.commitment && (
              <p style={{ ...s.dimMono, marginTop: 24 }}>Nothing recorded for this day.</p>
            )}
            {/* Edit entry button at bottom */}
            <div style={{ textAlign: "center", marginTop: 28, marginBottom: 8 }}>
              <button
                style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 12, color: moss, letterSpacing: "0.05em", cursor: "pointer", textDecoration: "underline", textUnderlineOffset: 3 }}
                onClick={() => { setEntryDay(selectedDay); setResumeStep(1); navigate("daily-entry"); }}>
                Edit entry
              </button>
            </div>
          </Shell>
        );
      }

      // ─── DAILY ENTRY VIEW ─────────────────────────────────────────
      if (view === "daily-entry" && entryDay) {
        return (
          <DailyEntryView
            day={entryDay}
            prompt={dailyPrompt}
            moodOrder={moodOrder}
            initialStep={resumeStep}
            initialMoods={entryDay.mood || []}
            initialNote={entryDay.journal?.note || ""}
            initialJournal={entryDay.journal?.text || ""}
            initialHappyHour={entryDay.happyHour || ""}
            ouraSync={ouraSync}
            onBack={goBackView}
            onOpenTool={openTool}
            affirmation={affirmation}
            ratings={ratings}
            onRateAff={rateAffirmation}
            onDislikeAff={dislikeAffirmation}
            onRefreshAff={generateAffirmation}
            onChooseAff={chooseAffirmation}
            mantraSet={mantraSet}
            mantraPracticedFor={mantraPracticedFor}
            onSaveMantraSet={saveMantraSet}
            onSuggestMantra={suggestMantra}
            onPickMantra={pickMantra}
            customPrompts={customPrompts}
            onSaveCustomPrompts={async (next) => {
              setCustomPrompts(next);
              await storageSet('settings:custom_prompts', next);
            }}
            onSaved={async (moods, journalText, noteText, happyHourText, selectedPrompt, hasPhysical) => {
              await storageSet(`mood:${entryDay.key}`, moods);
              if (journalText.trim() || noteText.trim()) {
                const dateDisplay = new Date(entryDay.key + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
                await storageSet(`journal:${entryDay.key}`, { text: journalText, note: noteText.trim(), prompt: selectedPrompt || dailyPrompt, savedAt: new Date().toISOString(), dateKey: entryDay.key, dateDisplay });
              }
              if (happyHourText && happyHourText.trim()) {
                await storageSet(`settings:happy_hour_${entryDay.key}`, happyHourText.trim());
              }
              if (entryDay.key === todayKey) {
                setTodayMoods(moods);
                setMoodSaved(moods.length > 0);
                await loadHistoryCalendar(); // keeps today's insight; only fills one in if none exists yet
              } else {
                await loadHistoryCalendar();
              }
              computeStreak();
              // Navigate to daily exercise suggestion — dotOffset shifts the
              // exercise view's dot indicator by +1 when this check-in
              // included the Physical step, so the overall flow's dot count
              // stays continuous.
              setExerciseMoods(moods);
              setExerciseDateKey(entryDay.key);
              setExerciseDotOffset(hasPhysical ? 1 : 0);
              navigate("daily-exercise");
            }}
          />
        );
      }

      // ─── DAILY EXERCISE VIEW ──────────────────────────────────────
      if (view === "daily-exercise") {
        return (
          <DailyExerciseView
            moods={exerciseMoods}
            dateKey={exerciseDateKey}
            dotOffset={exerciseDotOffset}
            onBack={() => { setResumeStep(exerciseDotOffset ? 5 : 4); goBackView(); }}
            onDone={async (exerciseId) => {
              if (exerciseId) {
                const exKey = `settings:exercises_${exerciseDateKey}`;
                const existing = (await storageGet(exKey)) || [];
                if (!existing.includes(exerciseId)) await storageSet(exKey, [...existing, exerciseId]);
              }
              jumpHome();
            }}
          />
        );
      }

      // ─── PROFILE VIEW ──────────────────────────────────────────────
      if (view === "profile") {
        // Derive user's display name from auth metadata or email
        const rawName = authUser?.user_metadata?.full_name
          || authUser?.user_metadata?.name
          || (authUser?.email ? authUser.email.split('@')[0] : 'You');
        const displayName = rawName.split(' ')[0];
        // First check-in date — mood entries only (same source as computeStreak)
        // All-time mood days when loaded; falls back to the 90-day window
        const moodDaysAllTime = allMoodDays || historyDays;
        const allEntryDates = moodDaysAllTime.filter(d => d.mood && d.mood.length > 0 && !d.future).map(d => d.key).sort();
        const firstDate = allEntryDates.length > 0
          ? new Date(allEntryDates[0] + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
          : null;
        // Top moods across all history
        const moodTally = {};
        moodDaysAllTime.forEach(d => {
          if (d.mood) d.mood.forEach(m => { moodTally[m.label] = (moodTally[m.label] || { count: 0, emoji: m.emoji }); moodTally[m.label].count++; });
        });
        const topMoods = Object.entries(moodTally).sort((a,b) => b[1].count - a[1].count).slice(0, 3);
        // Good / hard days ring chart
        const daysWithMoodArr = moodDaysAllTime.filter(d => d.mood && d.mood.length > 0 && !d.future);
        const dayScoresArr = daysWithMoodArr.map(d => d.mood.reduce((acc, m) => acc + moodWeight(m.label, d.key), 0) / d.mood.length);
        const goodDays = dayScoresArr.filter(s => s > 0).length;
        const hardDays = dayScoresArr.filter(s => s < 0).length;
        const neutralDays = dayScoresArr.filter(s => s === 0).length;
        const goodPct = daysWithMoodArr.length > 0 ? Math.round((goodDays / daysWithMoodArr.length) * 100) : 0;
        // Per-day emotional score series (date-keyed), for comparing against physical/Oura data
        const moodScoreDays = daysWithMoodArr.map((d, i) => ({ key: d.key, score: dayScoresArr[i] }));
        // Exercise counts
        const exCounts = {};
        historyDays.forEach(d => { if (d.exercises) d.exercises.forEach(id => { exCounts[id] = (exCounts[id] || 0) + 1; }); });
        // Happy hour summaries — keyed by date for recency filtering
        const happyHourDays = historyDays.filter(d => d.happyHour).map(d => ({ key: d.key, text: d.happyHour }));
        const happyHours = happyHourDays.map(d => d.text);
        // Journal entries keyed by date for recency filtering
        const journalDays = historyDays.filter(d => d.journal?.text).map(d => ({ key: d.key, text: d.journal.text }));
        // "What's behind these feelings?" notes + mantra reflections — feed the combined profile synopsis
        const noteDays = historyDays.filter(d => d.journal?.note).map(d => ({ key: d.key, text: d.journal.note }));
        const mantraReflectionDays = historyDays.filter(d => d.mantraReflection).map(d => ({ key: d.key, text: d.mantraReflection, mantra: d.affirmation || '' }));
        // Bigram theme extraction with 14-day recency filter
        const THEME_STOP = new Set(['a','an','the','and','or','to','of','for','in','is','it','i','my','that','this','at','on','with','was','be','as','me','so','do','up','out','by','how','what','when','but','if','its','not','you','your','can','will','just','from','are','they','he','she','we','have','had','has','some','also','about','after','all','been','being','did','does','even','ever','get','got','her','him','his','into','like','make','more','most','much','need','new','our','really','same','than','their','them','then','there','these','think','those','time','use','very','want','way','were','which','who','would','could','should','still','going','things','thing','feel','felt','today','yesterday','took','went','made','came','back','around','something','anything','nothing','everything','know','day','days','good','great','well','hard','little','bit','right','come','now','other','over','said','take','where','because','every','maybe','trying','done','lot','actually','always','never','sometimes','usually','thought','though','already','love','pretty','quite','kind','nice','sure','used','here','such','both','many','each','long','while','since','before','after','again','next','last','once','upon','own','too','through','life','myself','really','people','actually','going','think','feel','felt','just','like','very','quite','really','much']);
        function extractThemes(days, n = 7, cutoffDays = 14) {
          // days: [{key, text}]
          const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - cutoffDays);
          const cutoffStr = cutoff.toISOString().split('T')[0];
          const freq = {}, lastSeen = {};
          days.forEach(({ key, text }) => {
            const words = String(text).toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w => w.length > 3 && !THEME_STOP.has(w));
            // Score bigrams (adjacent meaningful word pairs)
            for (let i = 0; i < words.length - 1; i++) {
              const bigram = `${words[i]} ${words[i+1]}`;
              freq[bigram] = (freq[bigram] || 0) + 2; // bigrams weighted higher
              if (!lastSeen[bigram] || key > lastSeen[bigram]) lastSeen[bigram] = key;
            }
            // Also score single words (lower weight)
            words.forEach(w => {
              freq[w] = (freq[w] || 0) + 1;
              if (!lastSeen[w] || key > lastSeen[w]) lastSeen[w] = key;
            });
          });
          // Filter to themes seen within cutoff window, then sort by frequency
          const recent = Object.entries(freq).filter(([t]) => (lastSeen[t] || '') >= cutoffStr);
          if (recent.length >= 2) {
            return recent.sort((a,b) => b[1]-a[1]).slice(0, n).map(([t]) => t);
          }
          // Fallback: no recency filter if not enough recent themes
          return Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, n).map(([t]) => t);
        }
        const journalThemes = extractThemes(journalDays);
        const happyHourThemes = extractThemes(happyHourDays);
        const insightThemes = extractThemes(historyDays.filter(d=>d.insight).map(d=>({key:d.key,text:d.insight})));
        // Compute longest streak locally (homeLongestStreak is defined further down, after this early return)
        let profileLongest = 0, profileRun = 0;
        for (let i = 0; i < allEntryDates.length; i++) {
          if (i === 0) { profileRun = 1; }
          else { const diff = (new Date(allEntryDates[i]) - new Date(allEntryDates[i-1])) / 86400000; profileRun = diff === 1 ? profileRun + 1 : 1; }
          profileLongest = Math.max(profileLongest, profileRun);
        }
        const journalTexts = journalDays.map(d => d.text).slice(-10); // used by profile_summary
        const insightTexts = historyDays.filter(d => d.insight).map(d => d.insight).slice(-10);
        const affirmationTexts = historyDays.filter(d => d.affirmation && !d.future).map(d => d.affirmation).slice(-30);
        const TOOL_NAMES_P = { senses: "Five Senses", mindfulness: "Mindfulness", "here-now": "Here & Now", reframing: "Reframing", "thought-check": "Thought Check", "zoom-out": "Zoom Out", "one-small-thing": "One Small Thing", "name-pattern": "Name the Pattern" };
        return (
          <ProfileView
            name={displayName}
            firstDate={firstDate}
            topMoods={topMoods}
            streak={streak}
            longestStreak={profileLongest}
            journalCount={journalDays.length}
            journalThemes={journalThemes}
            happyHours={happyHours}
            exerciseCounts={exCounts}
            toolNames={TOOL_NAMES_P}
            happyHourThemes={happyHourThemes}
            journalTexts={journalTexts}
            insightTexts={insightTexts}
            userTraits={traits.map(t => t.full)}
            userInsecurities={insecurities}
            affirmationTexts={affirmationTexts}
            ouraSync={ouraSync}
            onPullOura={pullOura}
            onBack={backFromProfile}
            transitionPhase={homeProfileTransitionPhase}
            onSignOut={() => supabaseClient.auth.signOut()}
            onNavSettings={() => navigate("traits")}
            onNavJournals={() => navigate("journal-entries")}
            onNavAffirmations={() => navigate("affirmation-history")}
            onNavPhysicalHealth={() => navigate("physical-health")}
            likedCount={(ratings.liked || []).length}
            goodDays={goodDays}
            hardDays={hardDays}
            neutralDays={neutralDays}
            goodPct={goodPct}
            totalEntries={totalMoodEntries}
            journalDays={journalDays}
            happyHourDays={happyHourDays}
            moodScoreDays={moodScoreDays}
            onNavMoods={() => navigate("mood-breakdown")}
            onNavStreaks={() => navigate("streak-list")}
            onOpenExercise={openTool}
            aboutYou={aboutYou}
            noteDays={noteDays}
            mantraReflectionDays={mantraReflectionDays}
            goodPctForSummary={goodPct}
          />
        );
      }

      // ─── TRAITS VIEW ───────────────────────────────────────────────
      if (view === "traits") {
        return <PersonalizationQuiz initialTraits={traits.map(t => t.full)} initialInsecurities={insecurities} onCancel={goBackView} onComplete={handleSettingsQuizComplete} />;
      }

      // ─── HOME VIEW ─────────────────────────────────────────────────
      const homeAllCounts = {};
      historyDays.forEach(d => (d.mood || []).forEach(m => { homeAllCounts[m.label] = (homeAllCounts[m.label] || 0) + 1; }));
      const homeTotalMoodCount = Object.values(homeAllCounts).reduce((a, b) => a + b, 0);
      const homeTopMoods = Object.entries(homeAllCounts).sort((a,b) => b[1]-a[1]).slice(0,3)
        .map(([label, count]) => ({ ...ALL_MOODS.find(m => m.label === label), pct: homeTotalMoodCount ? Math.round(count / homeTotalMoodCount * 100) : 0 })).filter(m => m.emoji);
      const homeDaysWithMood = historyDays.filter(d => d.mood && d.mood.length > 0);
      const homeDayScores = homeDaysWithMood.map(d => {
        const sum = d.mood.reduce((acc, m) => acc + moodWeight(m.label, d.key), 0);
        return sum / d.mood.length;
      });
      const homeHappyPct = homeDayScores.length > 0 ? Math.round((homeDayScores.filter(s => s > 0).length / homeDayScores.length) * 100) : 0;
      const homeJournalCount = historyDays.filter(d => d.journal).length;
      const homeAllDates = [...historyDays].filter(d => d.hasData).map(d => d.key).sort();
      let homeLongestStreak = 0, homeCurRun = 0;
      for (let i = 0; i < homeAllDates.length; i++) {
        if (i === 0) { homeCurRun = 1; }
        else { const diff = (new Date(homeAllDates[i]) - new Date(homeAllDates[i-1])) / 86400000; homeCurRun = diff === 1 ? homeCurRun + 1 : 1; }
        homeLongestStreak = Math.max(homeLongestStreak, homeCurRun);
      }
      const homeIsCurrent = streak > 0 && streak >= homeLongestStreak;
      const homeTotalToolUses = Object.values(toolCounts).reduce((a,b) => a+b, 0);
      const homeTopTool = Object.entries(toolCounts).sort((a,b) => b[1]-a[1])[0];
      const TOOL_NAMES = { senses: "5 Senses", mindfulness: "Mindfulness", "here-now": "Here & Now", reframing: "Reframing", "thought-check": "Thought Check", "zoom-out": "Zoom Out", "one-small-thing": "One Small Thing", "name-pattern": "Name the Pattern" };
      // Compute displayDay before JSX so headline + moods can share it
      const displayDay = historyDays.length > 0
        ? (activeChartDay || { key: todayKey, mood: moodSaved ? todayMoods : null, fullDate: getDateDisplay(), future: false })
        : { key: todayKey, mood: moodSaved ? todayMoods : null, fullDate: getDateDisplay(), future: false };
      const displayDayIsToday = displayDay.key === todayKey;
      const displayDayMoods = !displayDay.future && displayDay.mood && displayDay.mood.length > 0 ? displayDay.mood : null;
      const noEntryToday = displayDayIsToday && !displayDayMoods;
      // Always pull today's affirmation/happyHour from today's history entry (persists during chart scrolling)
      const todayHistoryDay = historyDays.find(d => d.key === todayKey);

      // Headline text (insights logic will replace this later)
      const homeHeadline = displayDay.future
        ? "The future is yours"
        : displayDayMoods
          ? dayVibePhrase(displayDayMoods.reduce((acc, m) => acc + moodWeight(m.label, displayDay.key), 0) / displayDayMoods.length, displayDay.key)
          : getGreeting().replace(/\.$/, '');

      const anim = (delay) => ({ animation: `slideUp 0.45s ease ${(delay * 0.45).toFixed(2)}s both` });
      // Blanket exit dissolve when heading to Profile (see homeProfileTransition
      // above) — wraps the WHOLE home screen (header included) in one block so
      // it fades+drops together, matching the confirmed sandbox. Only ever
      // 'exiting' while view is still "home" when this is triggered by
      // goToProfile, so no ambiguity with any other nav action.
      const homeExitAnim = homeProfileTransitionPhase === 'exiting' ? `dissolveOut 320ms cubic-bezier(.4,0,1,1) both` : "none";
      return (
        <Shell key={view}>
          <div style={{ animation: homeExitAnim }}>
          {/* Header: 30px tall, 20px padding already from container. Extra
              16px marginTop keeps the logo + profile button clear of Safari's
              top-edge blur; marginBottom trimmed by the same 16px so the
              content below doesn't move. */}
          <div style={{ height: 30, display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16, marginBottom: 44, ...anim(0.8) }}>
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="28" viewBox="0 0 506.157 254.5">
              <path d="M122.532,0V38.926h-38.926v38.926H44.68v38.926H5.756V0H122.532Z" fill={ink}/>
              <path d="M249.324,77.852v38.926h-116.777V0h38.926V38.926h38.926v38.926h38.926Z" fill={ink}/>
              <path d="M376.281,77.852v38.926h-116.777V0h38.926V38.926h38.926v38.926h38.926Z" fill={ink}/>
              <path d="M503.237,116.777h-116.777V0h38.926V38.926h77.851V116.777Z" fill={ink}/>
              <path d="M118.809,172.067v80.143H60.679C27.166,252.21,0,225.044,0,191.531s27.166-60.68,60.679-60.68v41.216h58.13Z" fill={ink}/>
              <path d="M128.125,193.821c0-33.512,27.167-60.679,60.679-60.679s60.679,27.167,60.679,60.679-27.166,60.679-60.679,60.679-60.679-27.167-60.679-60.679Z" fill={ink}/>
              <path d="M256.25,193.821c0-33.512,27.167-60.679,60.679-60.679s60.679,27.167,60.679,60.679-27.166,60.679-60.679,60.679-60.679-27.167-60.679-60.679Z" fill={ink}/>
              <path d="M506.157,193.821c0,32.247-26.141,58.389-58.388,58.389h-58.388v-116.777h58.388c32.247,0,58.388,26.142,58.388,58.389Z" fill={ink}/>
            </svg>
            {/* Profile icon — navigates to profile view */}
            <button onClick={goToProfile} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center" }}>
              <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke={ink} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M4 18C6 13 18 13 20 18"/>
              </svg>
            </button>
          </div>

          {/* Loading overlay — fades away once historyDays are ready */}
          {!historyLoaded && (
            <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 90, paddingBottom: 90 }}>
              <div style={{ display: 'flex', gap: 8 }}>
                {[0, 1, 2].map(i => (
                  <div key={i} style={{ width: 7, height: 7, borderRadius: '50%', background: moss, animation: `pulse 1.2s ease-in-out ${i * 0.2}s infinite` }} />
                ))}
              </div>
            </div>
          )}

          {historyLoaded && (
          <div style={{ animation: 'fadeIn 0.35s ease both' }}>
          {/* Centered date — syncs with active chart day */}
          {(() => {
            const dow = new Date(displayDay.key + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' });
            const dateStr = displayDayIsToday ? getDateDisplay() : (displayDay.fullDate || displayDay.key);
            return (
              <div style={{ textAlign: 'center', fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: '0.08em', color: moss, textTransform: 'uppercase', marginBottom: 8, ...anim(0.75) }}>
                {dow} · {dateStr}
              </div>
            );
          })()}

          {/* Dynamic headline */}
          <div style={{ marginBottom: 10, textAlign: 'center', ...anim(0.7) }}>
            <h1 style={{ ...s.headline, fontSize: 34, textAlign: 'center', margin: 0 }}>{homeHeadline}</h1>
          </div>

          {/* Emoji / subtitle area — fixed height so chart never jumps */}
          <div style={{ minHeight: 64, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 10, ...anim(0.65) }}>
            {displayDayMoods
              ? <div style={{ display: "flex", justifyContent: 'center', gap: 8 }}>
                  {displayDayMoods.map(m => (
                    <div key={m.label} style={{ width: 64, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                      <span style={{ fontSize: 32 }}>{m.emoji}</span>
                      <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.02em", textAlign: "center" }}>{m.label}</span>
                    </div>
                  ))}
                </div>
              : null}
          </div>

          {/* Chart with overlaid CTA pill — paddingTop matches button bottom so vertical line kisses button */}
          <div style={{ position: 'relative', marginLeft: -24, marginRight: -24, marginBottom: 28, paddingTop: 46, ...anim(0.5) }}>
            {historyDays.length > 0
              ? <MoodSparkline
                  days={historyDays}
                  weights={HOME_WEIGHTS}
                  onDayClick={day => { setSelectedDay(day); navigate("day-detail"); }}
                  onEmptyDayClick={null}
                  tip={null}
                  svgHeight={200}
                  hideHeader={true}
                  onActiveDay={(d) => {
                    setActiveChartDay(d);
                    setChartScrolling(true);
                    clearTimeout(chartScrollTimer.current);
                    chartScrollTimer.current = setTimeout(() => setChartScrolling(false), 200);
                  }}
                />
              : <p style={{ ...s.statEmpty, paddingLeft: 24 }}>Log moods to see your trend</p>}
            {/* Future day overlay — sits at chart top level, pointerEvents none so scroll passes through */}
            {historyDays.length > 0 && displayDay.future && (
              <div style={{ position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', zIndex: 10, pointerEvents: 'none' }}>
                <button disabled style={{ background: 'none', border: `1.5px solid ${sage}`, borderRadius: 999, padding: '9px 26px', fontFamily: "'DM Mono', monospace", fontSize: 12, color: sage, letterSpacing: '0.05em', cursor: 'default', whiteSpace: 'nowrap', pointerEvents: 'none' }}>
                  See you then
                </button>
              </div>
            )}
            {/* CTA pill button overlaid on chart */}
            {historyDays.length > 0 && !displayDay.future && (
              <div style={{ position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', zIndex: 2 }}>
                {noEntryToday
                  ? <button
                      onClick={() => { pullOura(); setEntryDay({ key: todayKey, dayName: getDayOfWeek(), fullDate: getDateDisplay() }); setResumeStep(1); navigate("daily-entry"); }}
                      style={{ background: ink, borderRadius: 999, padding: '10px 28px', fontFamily: "'DM Mono', monospace", fontSize: 12, color: cream, letterSpacing: '0.05em', cursor: 'pointer', border: 'none', whiteSpace: 'nowrap', boxShadow: '0 2px 16px rgba(0,0,0,0.18)' }}>
                      Make today count
                    </button>
                  : <button
                      onClick={() => { const td = historyDays.find(d => d.key === displayDay.key); if (td) { setSelectedDay(td); navigate("day-detail"); } }}
                      style={{ background: ink, borderRadius: 999, padding: '10px 28px', fontFamily: "'DM Mono', monospace", fontSize: 12, color: cream, letterSpacing: '0.05em', cursor: 'pointer', border: 'none', whiteSpace: 'nowrap', boxShadow: '0 2px 16px rgba(0,0,0,0.18)' }}>
                      View
                    </button>}
              </div>
            )}
          </div>

          {/* Trends — flat, no tile, aligned to the content edge (Figma 11:123) */}
          {(insight || insightLoading || insightDismissing) && (
            <div style={{ marginBottom: 32, ...anim(0.42) }}>
              {insightLoading && !insight
                ? <>
                    <p style={{ fontFamily: "'Lora', serif", fontSize: 18, fontStyle: 'italic', color: 'rgba(44,59,42,0.25)', lineHeight: '24px', margin: '0 0 16px' }}>The past few days</p>
                    <p style={{ fontFamily: "'Lora', serif", fontSize: 16, color: 'rgba(44,59,42,0.25)', margin: 0, lineHeight: '26px' }}>Reading your last few days…</p>
                  </>
                : <>
                    <p style={{ fontFamily: "'Lora', serif", fontSize: 18, fontStyle: 'italic', color: ink, lineHeight: '24px', margin: '0 0 16px' }}>
                      {INSIGHT_HEADLINES[insightType] || 'The past few days'}
                    </p>
                    <p style={{ fontFamily: "'Lora', serif", fontSize: 16, color: ink, lineHeight: '26px', margin: 0 }}>{withEmphasis(insight)}</p>
                    {insightJournalQueued ? (
                      <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: '0.04em', textTransform: 'uppercase', margin: '24px 0 0' }}>We'll explore this tomorrow</p>
                    ) : (<>
                    {insightJournalPrompt && (
                      <>
                        <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, textTransform: 'uppercase', margin: '28px 0 12px' }}>Something to think about</div>
                        <p style={{ fontFamily: "'Lora', serif", fontSize: 18, fontStyle: 'italic', color: ink, lineHeight: 1.5, margin: 0 }}>{withEmphasis(insightJournalPrompt)}</p>
                      </>
                    )}
                    {(() => {
                      const btn = { flex: 1, background: 'none', border: `1px solid ${moss}`, borderRadius: 999, padding: '12px 0', fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: '0.05em', cursor: 'pointer' };
                      return (
                        <div style={{ display: 'flex', gap: 12, marginTop: 24 }}>
                          <button onClick={dismissInsight} disabled={insightDismissing} style={{ ...btn, cursor: insightDismissing ? 'default' : 'pointer', opacity: insightDismissing ? 0.4 : 1 }}>
                            {insightDismissing ? 'Refreshing…' : 'Refresh'}
                          </button>
                          {<button style={btn} onClick={async () => {
                                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
                                const tKey = tomorrow.toISOString().split('T')[0];
                                const promptToSave = insightJournalPrompt || (insight ? `Reflecting on this: "${insight.slice(0, 120)}" — what does this mean for you personally?` : null);
                                if (promptToSave) await storageSet(`settings:prompt_override_${tKey}`, { prompt: promptToSave });
                                await storageSet('settings:insight_journal_queued', { forDate: tKey });
                                setInsightJournalQueued(true);
                              }}>Explore tomorrow</button>}
                        </div>
                      );
                    })()}
                    </>)}
                  </>}
            </div>
          )}

          {/* Today's check-in — mantra, happy hour, commitment, physical data */}
          {(() => {
            const todayHealth = ouraSync?.connected ? composeHealth(ouraSync.days, todayKey) : null;
            const metrics = physicalMetricsFor(todayHealth);
            const showHappy = moodSaved && todayHistoryDay?.happyHour;
            const commitment = todayHistoryDay?.commitment;
            if (!affirmation && !metrics && !showHappy && !commitment) return null;
            return (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 32, ...anim(0.46) }}>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, textTransform: 'uppercase' }}>Today's check-in</div>
                {affirmation && (
            <div style={{ background: ink, borderRadius: 16, padding: '20px 22px 22px', textAlign: 'center' }}>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: sage, textTransform: 'uppercase', marginBottom: 16 }}>Mantra</div>
              <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 20, fontStyle: 'italic', color: 'rgba(255,255,255,0.92)', lineHeight: 1.6, margin: '0 0 24px' }}>
                {affirmation.text}
              </p>
              <div style={{ display: 'flex', justifyContent: 'center', gap: 12 }}>

    function MindfulnessView({ onBack, onSeeAll, completionLabel }) {
      const { useState: useS, useEffect: useE, useRef } = React;
      const [phase, setPhase] = useS(null);
      const [count, setCount] = useS(0);
      const [cycle, setCycle] = useS(0);
      const timerRef = useRef(null);

      const PHASES = [
        { name: "inhale", label: "Breathe in", duration: 5 },
        { name: "hold", label: "Hold", duration: 5 },
        { name: "exhale", label: "Breathe out", duration: 5 },
      ];
      const TOTAL_CYCLES = 5;

      function startBreathing() { setCycle(0); runPhase(0, 0); }

      function runPhase(phaseIdx, cycleNum) {
        const p = PHASES[phaseIdx];
        setPhase(p.name);
        setCount(p.duration);
        let remaining = p.duration;
        timerRef.current = setInterval(() => {
          remaining--;
          setCount(remaining);
          if (remaining <= 0) {
            clearInterval(timerRef.current);
            const nextPhase = (phaseIdx + 1) % PHASES.length;
            const nextCycle = nextPhase === 0 ? cycleNum + 1 : cycleNum;
            if (nextCycle >= TOTAL_CYCLES) { setPhase("done"); setCycle(TOTAL_CYCLES); }
            else { setCycle(nextCycle); runPhase(nextPhase, nextCycle); }
          }
        }, 1000);
      }

      function stop() { clearInterval(timerRef.current); setPhase(null); setCount(0); setCycle(0); }
      useE(() => () => clearInterval(timerRef.current), []);

      const circleScale = phase === "inhale" ? 1.35 : phase === "hold" ? 1.35 : 0.85;
      const circleColor = phase === "inhale" ? "#C4783A" : phase === "hold" ? "#6B7866" : "#2C3B2A";

      return (
        <Shell key="mindfulness">
          <button style={s.backBtn} onClick={() => { stop(); onBack(); }}>← back</button>
          <h2 style={s.pageTitle}>Mindfulness</h2>
          <p style={{ ...s.subNote, marginBottom: 40 }}>Deep breath. 5 seconds in. Hold for 5 seconds. 5 seconds out. Five times.</p>

            <div style={{
              width: 160, height: 160, borderRadius: "50%",
              background: phase ? circleColor : "#EEEAE0",
              transform: `scale(${phase && phase !== "done" ? circleScale : 1})`,
              transition: phase === "inhale" ? "transform 3s ease-in, background 0.4s" : phase === "exhale" ? "transform 3s ease-out, background 0.4s" : "background 0.4s",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            }}>
              {phase && phase !== "done" && <>
                <div style={{ fontFamily: "'Lora', serif", fontSize: 13, color: "rgba(255,255,255,0.7)", letterSpacing: "0.05em" }}>
                  {PHASES.find(p => p.name === phase)?.label}
                </div>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 36, color: "#fff", fontWeight: 300, lineHeight: 1 }}>{count}</div>
              </>}
              {(!phase || phase === "done") && (
                <div style={{ fontFamily: "'Lora', serif", fontSize: 13, color: "#8C8278", fontStyle: "italic" }}>
                  {phase === "done" ? "done ✓" : "ready"}
                </div>
              )}
            </div>
            {phase && phase !== "done" && (
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: "#8C8278", letterSpacing: "0.1em" }}>
                BREATH {cycle + 1} OF {TOTAL_CYCLES}
              </div>
            )}
            {phase === "done" && <p style={{ fontFamily: "'Lora', serif", fontStyle: "italic", color: "#1C1917", fontSize: 16, textAlign: "center", lineHeight: 1.6 }}>Five breaths complete. You're here.</p>}
            {!phase && <button style={s.primaryBtn} onClick={startBreathing}>Begin</button>}
            {phase && phase !== "done" && <button style={{ ...s.footerLink, color: "#8C8278" }} onClick={stop}>stop</button>}
            {phase === "done" && <button style={s.primaryBtn} onClick={startBreathing}>Again</button>}

      );

    // Steps through the 4 Thought Check questions one at a time with a real

    // ── Mood score slider (mirrors mobile/src/components/ScoreSlider.js) ──
    const MOOD_SCORE_POINTS = [-2, -1, 0, 1, 2];
    const MOOD_SCORE_LABELS = ['Rough', 'Low', 'Neutral', 'Good', 'Great'];
    const MOOD_SCORE_COLORS = ['#A6462B', '#E0954C', '#8A9E85', '#5C6E4E', '#2C3B2A'];

    function ScoreSlider({ value, onChange }) {
      const { useRef: useR } = React;
      const trackRef = useR(null);
      const draggingRef = useR(false);
      const activeIndex = MOOD_SCORE_POINTS.indexOf(value) === -1 ? 2 : MOOD_SCORE_POINTS.indexOf(value);

      function setFromClientX(clientX) {
        const track = trackRef.current;
        if (!track) return;
        const rect = track.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const idx = Math.max(0, Math.min(MOOD_SCORE_POINTS.length - 1, Math.round(ratio * (MOOD_SCORE_POINTS.length - 1))));
        if (MOOD_SCORE_POINTS[idx] !== value) onChange(MOOD_SCORE_POINTS[idx]);
      }

      const segWidthPct = 100 / MOOD_SCORE_POINTS.length;
      const thumbLeftPct = segWidthPct * (activeIndex + 0.5);
      const activeColor = MOOD_SCORE_COLORS[activeIndex];

      return (
        <div>
          <div
            ref={trackRef}
            style={{ position: "relative", height: 34, display: "flex", alignItems: "center", touchAction: "none", cursor: "pointer" }}
            onPointerDown={e => { draggingRef.current = true; e.target.setPointerCapture(e.pointerId); setFromClientX(e.clientX); }}
            onPointerMove={e => { if (draggingRef.current) setFromClientX(e.clientX); }}
            onPointerUp={() => { draggingRef.current = false; }}
            onPointerCancel={() => { draggingRef.current = false; }}
          >
            <div style={{ position: "absolute", left: 0, right: 0, top: 14, height: 6, borderRadius: 3, background: `linear-gradient(90deg, ${MOOD_SCORE_COLORS.join(", ")})` }} />
            <div style={{ position: "absolute", top: 5, left: `calc(${thumbLeftPct}% - 12px)`, width: 24, height: 24, borderRadius: "50%", background: activeColor, boxShadow: "0 1px 3px rgba(0,0,0,0.25)", transition: "left 0.12s ease, background 0.12s ease" }} />
          </div>
          <div style={{ display: "flex", marginTop: 8 }}>
            {MOOD_SCORE_LABELS.map((label, i) => (
              <span key={label} style={{ flex: 1, textAlign: "center", fontFamily: "'DM Mono', monospace", fontSize: 9, letterSpacing: "0.3px", textTransform: "uppercase", color: i === activeIndex ? ink : moss, fontWeight: i === activeIndex ? 500 : 400 }}>
                {label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ─── AddMoodView ──────────────────────────────────────────────────
    function AddMoodView({ onBack, onAdd }) {
      const { useState: useS, useEffect: useE, useRef } = React;
      const [name, setName] = useS("");

      const nameRef = useRef(null);

      useE(() => { if (nameRef.current) nameRef.current.focus(); }, []);
      function handleEmojiChange(e) {
