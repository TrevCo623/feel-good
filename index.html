    // ─── PhysicalEmotionalChart ─────────────────────────────────────────
    // Small decorative area chart overlaying daily physical readiness
    // (Oura, 0-100) against daily emotional/mood score (-2..2), both
    // normalized to a shared 0-1 axis. Static/non-interactive — meant to
    // live inside the Profile "Physical Data" card, not the homepage's
    // scrollable MoodSparkline, but reuses its Catmull-Rom smoothing idea.
    function PhysicalEmotionalChart({ days, width = 320, height = 170 }) {
      if (!days || days.length < 1) return null;
      const PAD_X = 0, PAD_Y = 10;
      const n = days.length;

      // "Today" anchors the center of the chart, like the homepage sparkline.
      // Fall back to the most recent day if today isn't in the data yet.
      const todayKey = getTodayKey();
      let todayIdx = days.findIndex(d => d.date === todayKey);
      if (todayIdx === -1) todayIdx = n - 1;

      const centerX = width / 2;
      const stepX = todayIdx > 0 ? (centerX - PAD_X) / todayIdx : 32;

      const pastDays = days.slice(0, todayIdx + 1);
      const pastX = pastDays.map((d, i) => PAD_X + i * stepX);

      const yFor = v => PAD_Y + (1 - Math.max(0, Math.min(1, v))) * (height - PAD_Y * 2);
      const physPts = pastDays.map((d, i) => ({ x: pastX[i], y: yFor(d.physical / 100) }));
      const emoPts = pastDays.map((d, i) => ({ x: pastX[i], y: yFor((d.emotional + 2) / 4) }));

      function smoothPath(pts) {
        if (pts.length < 2) return pts.length ? `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}` : '';
        const CR = 0.2;
        const segs = pts.slice(1).map((p2, idx) => {
          const i = idx + 1;
          const p1 = pts[i - 1];
          const p0 = i >= 2 ? pts[i - 2] : p1;
          const p3 = i < pts.length - 1 ? pts[i + 1] : p2;
          const cp1x = p1.x + (p2.x - p0.x) * CR, cp1y = p1.y + (p2.y - p0.y) * CR;
          const cp2x = p2.x - (p3.x - p1.x) * CR, cp2y = p2.y - (p3.y - p1.y) * CR;
          return `C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
        });
        return `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} ${segs.join(' ')}`;
      }
      function areaPath(pts) {
        if (pts.length < 2) return '';
        const last = pts[pts.length - 1], first = pts[0];
        return `${smoothPath(pts)} L ${last.x.toFixed(1)},${height} L ${first.x.toFixed(1)},${height} Z`;
      }

      // Decorative future wave — a gentle continuation (not real data), anchored
      // at today's (center) x, starting from wherever the higher of the two
      // series sits today (rather than the chart's vertical midline), and
      // spanning all the way to the right edge on its own spacing
      // (independent of how tightly the real history is packed).
      const FUTURE_WAVE_NORM = [0.5, 0.63, 0.5, 0.63, 0.5, 0.63, 0.5];
      const futureStepX = (width - PAD_X - centerX) / FUTURE_WAVE_NORM.length;
      const futureBaseY = Math.min(physPts[physPts.length - 1].y, emoPts[emoPts.length - 1].y);
      const clampY = y => Math.max(PAD_Y, Math.min(height - PAD_Y, y));
      const futurePts = [{ x: centerX, y: futureBaseY }, ...FUTURE_WAVE_NORM.map((v, k) => ({ x: centerX + (k + 1) * futureStepX, y: clampY(futureBaseY + (yFor(v) - height / 2)) }))];
      const futureArea = futurePts.length > 1
        ? `${smoothPath(futurePts)} L ${futurePts[futurePts.length - 1].x.toFixed(1)},${height} L ${futurePts[0].x.toFixed(1)},${height} Z`
        : '';

      const PHYS_COLOR = tangerine;
      const EMO_COLOR = ink;
      const FUTURE_COLOR = bone;

      // Pick date labels with a minimum gap (in chart-space units) so "Today"
      // never collides with the date immediately before it.
      const MIN_LABEL_GAP = 30;
      const labelEvery = pastDays.length > 6 ? Math.ceil(pastDays.length / 6) : 1;
      const todayLabelIdx = pastDays.length - 1;
      let labelIdxs = pastDays.map((_, i) => i).filter(i => i % labelEvery === 0);
      if (labelIdxs[labelIdxs.length - 1] !== todayLabelIdx) labelIdxs.push(todayLabelIdx);
      labelIdxs = labelIdxs.filter(i => i === todayLabelIdx || (pastX[todayLabelIdx] - pastX[i]) >= MIN_LABEL_GAP);

      return (
        <div style={{ width: "100%" }}>
          <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ display: "block" }}>
            <defs>
              <linearGradient id="pe-grad-phys" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={PHYS_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={PHYS_COLOR} stopOpacity="0.5" />
              </linearGradient>
              <linearGradient id="pe-grad-emo" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={EMO_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={EMO_COLOR} stopOpacity="0.45" />
              </linearGradient>
              <linearGradient id="pe-grad-future" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={FUTURE_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={FUTURE_COLOR} stopOpacity="0.3" />
              </linearGradient>
            </defs>
            {futureArea && <path d={futureArea} fill="url(#pe-grad-future)" />}
            {areaPath(physPts) && <path d={areaPath(physPts)} fill="url(#pe-grad-phys)" />}
            {areaPath(emoPts) && <path d={areaPath(emoPts)} fill="url(#pe-grad-emo)" />}
            <line x1={centerX} y1={0} x2={centerX} y2={height} stroke={cream} strokeWidth="1" opacity="0.5" />
          </svg>
          {/* Date labels live outside the SVG's (non-uniformly scaled) coordinate
              system so the text itself never gets stretched or squished. */}
          <div style={{ position: "relative", height: 14, marginTop: 6 }}>
            {labelIdxs.map((i, idx) => (
              <span key={pastDays[i].date} style={{
                position: "absolute", left: `${(pastX[i] / width) * 100}%`, top: 0,
                // The leftmost label sits at x=0 — center-anchoring it would push
                // half its width off the edge of the tile, so left-anchor it
                // instead (every other label stays center-anchored on its point).
                transform: idx === 0 ? "translateX(0)" : "translateX(-50%)",
                whiteSpace: "nowrap",
                fontFamily: "'DM Mono', monospace", fontSize: 8, color: shale,
              }}>
                {i === todayLabelIdx ? "Today" : new Date(pastDays[i].date + 'T00:00:00').getDate()}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ─── PhysicalEmotionalChartLarge ─────────────────────────────────────
    // The detail page's horizontally-scrollable version of
    // PhysicalEmotionalChart above — same visual language (area-fill
    // physical/emotional curves + a decorative "future" continuation, no
    // stroked outlines), but plots every paired day at a fixed per-day
    // width instead of squeezing everything into a fixed box, and
    // auto-scrolls so "today" sits centered in the viewport on mount —
    // the same UX as the home page's MoodSparkline scroll-to-center.
    function PhysicalEmotionalChartLarge({ days, height = 220, dayWidth = 56 }) {
      const { useRef, useEffect: useE, useState: useS } = React;
      const scrollRef = useRef(null);
      const [hPad, setHPad] = useS(160);
      if (!days || days.length < 1) return null;

      const PAD_Y = 16;
      const todayKey = getTodayKey();
      let todayIdx = days.findIndex(d => d.date === todayKey);
      if (todayIdx === -1) todayIdx = days.length - 1;
      const pastDays = days.slice(0, todayIdx + 1);
      const n = pastDays.length;

      const xFor = i => hPad + i * dayWidth;
      const todayX = xFor(n - 1);
      const FUTURE_DAYS = 5;
      const totalW = todayX + FUTURE_DAYS * dayWidth + hPad;

      const yFor = v => PAD_Y + (1 - Math.max(0, Math.min(1, v))) * (height - PAD_Y * 2);
      const physPts = pastDays.map((d, i) => ({ x: xFor(i), y: yFor(d.physical / 100) }));
      const emoPts = pastDays.map((d, i) => ({ x: xFor(i), y: yFor((d.emotional + 2) / 4) }));

      function smoothPath(pts) {
        if (pts.length < 2) return pts.length ? `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}` : '';
        const CR = 0.2;
        const segs = pts.slice(1).map((p2, idx) => {
          const i = idx + 1;
          const p1 = pts[i - 1];
          const p0 = i >= 2 ? pts[i - 2] : p1;
          const p3 = i < pts.length - 1 ? pts[i + 1] : p2;
          const cp1x = p1.x + (p2.x - p0.x) * CR, cp1y = p1.y + (p2.y - p0.y) * CR;
          const cp2x = p2.x - (p3.x - p1.x) * CR, cp2y = p2.y - (p3.y - p1.y) * CR;
          return `C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
        });
        return `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} ${segs.join(' ')}`;
      }
      function areaPath(pts) {
        if (pts.length < 2) return '';
        const last = pts[pts.length - 1], first = pts[0];
        return `${smoothPath(pts)} L ${last.x.toFixed(1)},${height} L ${first.x.toFixed(1)},${height} Z`;
      }

      // Decorative future wave — same shape language as the tile's version,
      // continuing from wherever the higher of the two series sits today.
      const FUTURE_WAVE_NORM = [0.5, 0.63, 0.5, 0.63, 0.5];
      const futureBaseY = Math.min(physPts[physPts.length - 1].y, emoPts[emoPts.length - 1].y);
      const clampY = y => Math.max(PAD_Y, Math.min(height - PAD_Y, y));
      const futurePts = [{ x: todayX, y: futureBaseY }, ...FUTURE_WAVE_NORM.map((v, k) => ({ x: todayX + (k + 1) * dayWidth, y: clampY(futureBaseY + (yFor(v) - height / 2)) }))];
      const futureArea = futurePts.length > 1
        ? `${smoothPath(futurePts)} L ${futurePts[futurePts.length - 1].x.toFixed(1)},${height} L ${futurePts[0].x.toFixed(1)},${height} Z`
        : '';

      const PHYS_COLOR = tangerine;
      const EMO_COLOR = ink;
      const FUTURE_COLOR = shale;

      // Auto-scroll so "today" sits centered in the viewport on mount —
      // mirrors MoodSparkline's scroll-to-center effect on the home page.
      useE(() => {
        if (!scrollRef.current) return;
        const el = scrollRef.current;
        const pad = Math.max(80, Math.round(el.clientWidth / 2 - dayWidth / 2));
        setHPad(pad);
        setTimeout(() => { el.scrollLeft = pad + (n - 1) * dayWidth + dayWidth / 2 - el.clientWidth / 2; }, 60);
      }, [n]);

      // Date labels every few days, always including "Today".
      const labelEvery = Math.max(1, Math.ceil(n / 20));
      let labelIdxs = pastDays.map((_, i) => i).filter(i => i % labelEvery === 0);
      if (labelIdxs[labelIdxs.length - 1] !== n - 1) labelIdxs.push(n - 1);

      return (
        <div
          ref={scrollRef}
          className="no-sb"
          style={{ overflowX: "scroll", WebkitOverflowScrolling: "touch", scrollbarWidth: "none", msOverflowStyle: "none" }}
        >
          <svg width={totalW} height={height} style={{ display: "block" }}>
            <defs>
              <linearGradient id="pel-grad-phys" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={PHYS_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={PHYS_COLOR} stopOpacity="0.5" />
              </linearGradient>
              <linearGradient id="pel-grad-emo" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={EMO_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={EMO_COLOR} stopOpacity="0.45" />
              </linearGradient>
              <linearGradient id="pel-grad-future" x1="0" y1={height} x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor={FUTURE_COLOR} stopOpacity="0" />
                <stop offset="100%" stopColor={FUTURE_COLOR} stopOpacity="0.3" />
              </linearGradient>
            </defs>
            {futureArea && <path d={futureArea} fill="url(#pel-grad-future)" />}
            {areaPath(physPts) && <path d={areaPath(physPts)} fill="url(#pel-grad-phys)" />}
            {areaPath(emoPts) && <path d={areaPath(emoPts)} fill="url(#pel-grad-emo)" />}
            <line x1={todayX} y1={0} x2={todayX} y2={height} stroke={cream} strokeWidth="1" opacity="0.5" />
            {labelIdxs.map(i => (
              <text key={pastDays[i].date} x={xFor(i)} y={height - 4} textAnchor="middle" fontFamily="'DM Mono', monospace" fontSize="9" fill={shale}>
                {i === n - 1 ? "Today" : new Date(pastDays[i].date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
              </text>
            ))}
          </svg>
        </div>
      );
    }

    // ─── PhysicalHealthDetailView ────────────────────────────────────────
    // Reached from Profile's Physical Data tile ("View more"). Same data as
    // the tile (physical/emotional pairing + Oura connection state) derived
    // independently here from the same shared ouraSync/moodScoreDays App
    // already has, rather than threading it through ProfileView — keeps
    // this view self-contained and leaves ProfileView's internals alone.
    function PhysicalHealthDetailView({ ouraSync, onPullOura, moodScoreDays = [], onBack, onDisconnectOura }) {
      const { useState: useS, useEffect: useE, useMemo: useM } = React;
      const [ouraConnecting, setOuraConnecting] = useS(false);
      const [disconnecting, setDisconnecting] = useS(false);
      const [longAnalysis, setLongAnalysis] = useS(null);

      useE(() => { if (!ouraSync) onPullOura && onPullOura(); }, [ouraSync]);

      const ouraConnected = ouraSync ? ouraSync.connected : null; // null = still checking
      const ouraDays = ouraSync?.days || [];

      // Same pairing logic as ProfileView's pairedScoreDays — duplicated
      // rather than lifted, so this view doesn't depend on ProfileView ever
      // being mounted.
      const pairedScoreDays = useM(() => {
        const moodByKey = {};
        moodScoreDays.forEach(d => { moodByKey[d.key] = d.score; });
        return ouraDays
          .filter(d => d.readiness_score != null && moodByKey[d.date] !== undefined)
          .map(d => ({ date: d.date, physical: Math.round(d.readiness_score), emotional: Math.round(moodByKey[d.date] * 100) / 100 }))
          .sort((a, b) => a.date < b.date ? -1 : 1);
      }, [ouraDays, moodScoreDays]);

      // Longer analysis — separate cache key / prompt from the tile's
      // one-sentence summary, only fetched once this page is actually
      // opened.
      useE(() => {
        if (!ouraConnected || pairedScoreDays.length < 3) return;
        const cacheKey = 'settings:physical_emotional_trend_long_v1';
        const fingerprint = `${pairedScoreDays.length}_${pairedScoreDays[pairedScoreDays.length - 1]?.date || ''}`;
        storageGet(cacheKey).then(async cached => {
          if (cached?.text && cached.fingerprint === fingerprint) { setLongAnalysis(cached.text); return; }
          const text = await callClaude('physical_emotional_trend_long', { pairedDays: pairedScoreDays });
          if (text) { setLongAnalysis(text); await storageSet(cacheKey, { text, fingerprint, generatedAt: new Date().toISOString() }); }
        });
      }, [ouraConnected, pairedScoreDays.length]);

      async function connectOura() {
        setOuraConnecting(true);
        try {
          const res = await fetch(FUNCTIONS_BASE + '/oura-auth-start', {
            headers: { Authorization: SB_HEADERS['Authorization'] },
          });
          const data = await res.json();
          if (res.ok && data.url) {
            window.location.href = data.url;
          } else {
            setOuraConnecting(false);
          }
        } catch {
          setOuraConnecting(false);
        }
      }

      async function disconnectOura() {
        setDisconnecting(true);
        try {
          const res = await fetch(FUNCTIONS_BASE + '/oura-disconnect', {
            method: 'POST',
            headers: { Authorization: SB_HEADERS['Authorization'] },
          });
          if (res.ok) onDisconnectOura && onDisconnectOura();
        } catch {
          // best-effort — leave the connection as-is, user can retry
        } finally {
          setDisconnecting(false);
        }
      }

      const connectionRow = (label, status, action) => (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderBottom: `1px solid ${bone}` }}>
          <div>
            <div style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 16, color: ink, marginBottom: 2 }}>{label}</div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.04em" }}>{status}</div>
          </div>
          {action}
        </div>
      );

      const pillBtn = (text, onClick, { disabled = false, danger = false } = {}) => (
        <button
          onClick={onClick}
          disabled={disabled}
          style={{
            background: "none",
            border: `1px solid ${danger ? tangerine : moss}`,
            borderRadius: 999, padding: "8px 18px",
            fontFamily: "'DM Mono', monospace", fontSize: 10, letterSpacing: "0.04em",
            color: danger ? tangerine : moss,
            cursor: disabled ? "default" : "pointer",
            opacity: disabled ? 0.45 : 1,
            flexShrink: 0,
          }}
        >
          {text}
        </button>
      );

      return (
        <Shell key="physical-health">
          <button style={s.backBtn} onClick={onBack}>← back</button>
          <h2 style={s.pageTitle}>Physical & Emotional Health</h2>

          {ouraConnected === true ? (
            pairedScoreDays.length >= 2 ? (
              <>
                <div style={{ marginLeft: -24, marginRight: -24, marginBottom: 12 }}>
                  <PhysicalEmotionalChartLarge days={pairedScoreDays} height={220} />
                </div>
                <div style={{ display: "flex", justifyContent: "center", gap: 20, marginBottom: 28 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: tangerine, display: "inline-block" }} />
                    <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss }}>Oura Ring</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: ink, display: "inline-block" }} />
                    <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss }}>Logged moods</span>
                  </div>
                </div>
              </>
            ) : (
              <p style={{ ...s.dimMono, marginBottom: 28 }}>Not enough overlapping days yet to chart.</p>
            )
          ) : (
            <p style={{ ...s.dimMono, marginBottom: 28 }}>Connect a physical health source below to see this chart.</p>
          )}

          <div style={s.sectionLabel}>Analysis</div>
          <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, color: ink, lineHeight: 1.7, margin: "0 0 32px" }}>
            {ouraConnected !== true
              ? "Once you connect a physical health source and have a few days of overlapping data, you'll see a deeper look at how your physical and emotional health move together here."
              : longAnalysis || "Keep checking in — once we have a bit more overlapping data, we'll show you how your physical and emotional health track together."}
          </p>

          <div style={{ ...s.sectionLabel, marginTop: 8 }}>Manage Connections</div>
          <div style={{ marginBottom: 8 }}>
            {connectionRow(
              "Oura Ring",
              ouraConnected === true ? "Connected" : ouraConnected === false ? "Not connected" : "Checking…",
              ouraConnected === true
                ? pillBtn(disconnecting ? "Disconnecting…" : "Disconnect", disconnectOura, { disabled: disconnecting, danger: true })
                : pillBtn(ouraConnecting ? "Connecting…" : "Connect", connectOura, { disabled: ouraConnecting || ouraConnected === null })
            )}
            {connectionRow("Apple Health", "Coming soon", pillBtn("Coming soon", null, { disabled: true }))}
            {connectionRow("Google Fit", "Coming soon", pillBtn("Coming soon", null, { disabled: true }))}
          </div>
        </Shell>
      );
    }

    function ProfileView({ name, firstDate, topMoods, streak, longestStreak, totalEntries = 0, journalCount, journalThemes, happyHours, happyHourThemes, exerciseCounts, toolNames, journalTexts, insightTexts, userTraits, userInsecurities, goodDays = 0, hardDays = 0, neutralDays = 0, goodPct = 0, journalDays = [], happyHourDays = [], moodScoreDays = [], likedCount = 0, affirmationTexts = [], noteDays = [], mantraReflectionDays = [], goodPctForSummary = 0, aboutYou = {}, onNavStreaks, onOpenExercise, onBack, onSignOut, onNavSettings, onNavJournals, onNavInsights, onNavMoods, onNavAffirmations, onNavPhysicalHealth, transitionPhase = 'idle', ouraSync, onPullOura }) {
      const { useState: useS, useEffect: useE, useMemo: useM } = React;
      // One combined AI synopsis (replaces the separate journal / happy hour /
      // mantra / "who you are" summaries): { text, themes[] }
      const [synopsis, setSynopsis] = useS(null);
      const [synopsisLoading, setSynopsisLoading] = useS(false);
      const [ouraConnected, setOuraConnected] = useS(null); // null = checking, true/false once known
      const [ouraConnecting, setOuraConnecting] = useS(false);
      const [ouraDays, setOuraDays] = useS([]); // synced health_metrics_daily rows, for the physical/emotional trend chart
      const [physicalTrend, setPhysicalTrend] = useS(null);

      // Good/Hard bar reveal — locked V1 sandbox behavior: an eased 0→1
      // progress drives the sage fill, white thumb, and big percentage
      // together up to the final good%, then once that settles the
      // remainder of the bar fades in as solid Rust. Re-runs if goodPct
      // changes (e.g. once the underlying day-count data actually lands).
      const [circleProgress, setCircleProgress] = useS(0);
      const [rustProgress, setRustProgress] = useS(0);
      const barRafRef = React.useRef(null);
      useE(() => {
        setCircleProgress(0);
        setRustProgress(0);
        const CIRCLE_MS = 1500, RUST_MS = 550;
        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
        const start1 = performance.now();
        function tickCircle(now) {
          const t = Math.min(1, (now - start1) / CIRCLE_MS);
          setCircleProgress(easeOutCubic(t));
          if (t < 1) {
            barRafRef.current = requestAnimationFrame(tickCircle);
          } else {
            const start2 = performance.now();
            function tickRust(now2) {
              const t2 = Math.min(1, (now2 - start2) / RUST_MS);
              setRustProgress(t2);
              if (t2 < 1) barRafRef.current = requestAnimationFrame(tickRust);
            }
            barRafRef.current = requestAnimationFrame(tickRust);
          }
        }
        barRafRef.current = requestAnimationFrame(tickCircle);
        return () => cancelAnimationFrame(barRafRef.current);
      }, [goodPct]);

      // Oura connection status + health_metrics_daily, read from the shared
      // pull App owns (see pullOura/ouraSync — kicked off in the background
      // from "Make today count" so it's usually already resolved or in
      // flight by the time this view is reached). If nothing's been pulled
      // yet this session (e.g. Profile opened directly), ask App to start
      // one — no-ops if a pull is already in flight.
      useE(() => {
        if (!ouraSync) { onPullOura && onPullOura(); return; }
        setOuraConnected(ouraSync.connected);
        setOuraDays(ouraSync.days || []);
      }, [ouraSync]);

      // Pair up physical (Oura readiness, 0-100) and emotional (mood, -2..2) scores by date
      const pairedScoreDays = useM(() => {
        const moodByKey = {};
        moodScoreDays.forEach(d => { moodByKey[d.key] = d.score; });
        return ouraDays
          .filter(d => d.readiness_score != null && moodByKey[d.date] !== undefined)
          .map(d => ({ date: d.date, physical: Math.round(d.readiness_score), emotional: Math.round(moodByKey[d.date] * 100) / 100 }))
          .sort((a, b) => a.date < b.date ? -1 : 1);
      }, [ouraDays, moodScoreDays]);

      // AI trend observation comparing physical vs emotional scores — cached by a fingerprint of the paired series
      useE(() => {
        if (!ouraConnected || pairedScoreDays.length < 3) return;
        const cacheKey = 'settings:physical_emotional_trend_v1';
        const fingerprint = `${pairedScoreDays.length}_${pairedScoreDays[pairedScoreDays.length - 1]?.date || ''}`;
        storageGet(cacheKey).then(async cached => {
          if (cached?.text && cached.fingerprint === fingerprint) { setPhysicalTrend(cached.text); return; }
          const text = await callClaude('physical_emotional_trend', { pairedDays: pairedScoreDays });
          if (text) { setPhysicalTrend(text); await storageSet(cacheKey, { text, fingerprint, generatedAt: new Date().toISOString() }); }
        });
      }, [ouraConnected, pairedScoreDays.length]);

      async function connectOura() {
        setOuraConnecting(true);
        try {
          const res = await fetch(FUNCTIONS_BASE + '/oura-auth-start', {
            headers: { Authorization: SB_HEADERS['Authorization'] },
          });
          const data = await res.json();
          if (res.ok && data.url) {
            window.location.href = data.url;
          } else {
            setOuraConnecting(false);
          }
        } catch {
          setOuraConnecting(false);
        }
      }

      useE(() => {
        // ── Combined AI profile synopsis ───────────────────────────────
        // Pulls journals, "what's behind it" notes, happy hours, mantras (+
        // reflections), moods, recent insights and traits into one summary
        // with themes. Cached by a data fingerprint; a stale cached copy is
        // shown immediately while a fresh one generates.
        const cacheKey = 'settings:profile_synopsis_v1';
        const latest = (arr) => arr[0]?.key || '';
        const fingerprint = [journalDays.length, noteDays.length, happyHourDays.length, mantraReflectionDays.length, topMoods.length,
          latest(journalDays), latest(noteDays), latest(happyHourDays), latest(mantraReflectionDays),
          JSON.stringify([userTraits, userInsecurities, aboutYou]).length, JSON.stringify(aboutYou).slice(0, 200)].join('_');
        const hasData = journalDays.length || noteDays.length || happyHourDays.length || topMoods.length;
        storageGet(cacheKey).then(async cached => {
          if (cached?.text) setSynopsis({ text: cached.text, themes: cached.themes || [] });
          if (cached?.text && cached.fingerprint === fingerprint) return;
          if (!hasData) return;
          if (!cached?.text) setSynopsisLoading(true);
          const fmt = (d) => new Date(d.key + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const raw = await callClaude('profile_synopsis', {
            topMoods: topMoods.map(([label]) => label),
            goodPct: goodPctForSummary,
            journals: journalDays.slice(0, 12).map(d => `${fmt(d)}: ${String(d.text).slice(0, 300)}`),
            notes: noteDays.slice(0, 12).map(d => `${fmt(d)}: ${String(d.text).slice(0, 200)}`),
            happyHours: happyHourDays.slice(0, 12).map(d => `${fmt(d)}: ${String(d.text).slice(0, 150)}`),
            mantras: (affirmationTexts || []).slice(-8),
            mantraReflections: mantraReflectionDays.slice(0, 8).map(d => `"${String(d.mantra).slice(0, 100)}" → ${String(d.text).slice(0, 200)}`),
            insights: (insightTexts || []).slice(0, 5),
            traits: userTraits || [],
            insecurities: userInsecurities || [],
            about: aboutYou,
          });
          if (raw) {
            try {
              const parsed = JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '').trim());
              if (parsed?.summary) {
                const themes = Array.isArray(parsed.themes) ? parsed.themes.slice(0, 6) : [];
                setSynopsis({ text: parsed.summary, themes });
                await storageSet(cacheKey, { text: parsed.summary, themes, fingerprint, generatedAt: new Date().toISOString() });
              }
            } catch { /* invalid JSON — keep whatever is showing */ }
          }
          setSynopsisLoading(false);
        });
      }, []);

      const chipStyle = { background: "none", border: `1px solid ${sage}`, borderRadius: 999, padding: "4px 12px", fontFamily: "'DM Mono', monospace", fontSize: 10, color: bone, letterSpacing: "0.04em", cursor: "default" };
      const cardStyle = { background: moss, borderRadius: 16, padding: 20, marginBottom: 23 };
      const eyebrow = (text, right) => (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
          <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: shale, textTransform: "uppercase" }}>{text}</div>
          {right && <button onClick={right.fn} style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 9, color: bone, letterSpacing: "0.06em", cursor: "pointer" }}>{right.label}</button>}
        </div>
      );
      const knownExKeys = ["senses", "mindfulness", "here-now", "reframing", "thought-check", "zoom-out", "one-small-thing", "name-pattern"];
      const exKeys = [...new Set([...knownExKeys, ...Object.keys(exerciseCounts || {})])].filter(Boolean);

      // Shared sage→rust split used by both the good/hard bar and the decorative
      // glow behind it, so the two always agree on where the transition sits.
      // Transition is a plain (linear, not radial) ~3%-of-width CSS blend
      // centered on the good/hard boundary.
      const goodFracPct = Math.max(0, Math.min(100, goodPct));
      const barTransitionPct = 3;
      const barGradCss = `linear-gradient(90deg, ${sage} 0%, ${sage} ${Math.max(0, goodFracPct - barTransitionPct / 2)}%, ${rust} ${Math.min(100, goodFracPct + barTransitionPct / 2)}%, ${rust} 100%)`;

      // Animating derivatives of the fixed split above — barFillPct/displayPct

      }
      function onPointerMove(e) {
        if (phase !== 'dragging') return;
        setDx(e.clientX - startXRef.current);
      }
      function endDrag() {
        if (phase !== 'dragging') return;
        if (dx > SWIPE_THRESHOLD) triggerExit(1);
        else if (dx < -SWIPE_THRESHOLD) triggerExit(-1);
        else { setDx(0); setPhase('idle'); }
      }

      const rotate = dx / 26;
      const frontTransition = phase === 'dragging' ? "none" : BOX_TRANSITION;

      const exiting = phase === 'exiting';
      const forward = exiting && exitDirRef.current === -1;  // swiping to the NEXT card — back cards promote up
      const backward = exiting && exitDirRef.current === 1;  // swiping to the PREVIOUS card — mirror image: back cards demote, a new card slides in from the left

      const a      = at(index);       // current front
      const b1     = at(index + 1);   // first peeking card
      const b2     = at(index + 2);   // second peeking card
      const nextIn = at(index + 3);   // dissolves in behind on a forward swipe
      const prev   = at(index - 1);   // slides in from the left on a backward swipe

      // Each role's target depth + content dim, given which (if any) direction
      // is mid-exit. This is a full, symmetric mirror in both directions:
      //   forward  (next):  front exits · b1→front · b2→back1 · nextIn→back2
      //   backward (prev):  prev→front · front→back1 · b1→back2 · b2 fades out
      const nextInBoxOpacity = forward ? 1 : 0; // only ever appears on a forward swipe

      const b2Depth = forward ? DEPTH.back1 : DEPTH.back2; // no further slot to demote to on a backward swipe — it just fades in place
      const b2Dim   = forward ? CONTENT_DIM.back1 : CONTENT_DIM.back2;
      const b2BoxOpacity = backward ? 0 : 1;

      const b1Depth = forward ? DEPTH.front : (backward ? DEPTH.back2 : DEPTH.back1);
      const b1Dim   = forward ? CONTENT_DIM.front : (backward ? CONTENT_DIM.back2 : CONTENT_DIM.back1);

      const prevBoxOpacity = backward ? 1 : 0; // slides in from off-screen left, only on a backward swipe

      const frontDepth = backward ? DEPTH.back1 : DEPTH.front;
      const frontDim   = backward ? CONTENT_DIM.back1 : CONTENT_DIM.front;
      const frontBoxOpacity = forward ? 0 : 1; // slides fully off-screen and fades on a forward swipe — nothing takes its old slot

      return (
        <Shell key="affirmation-history">
          <button style={{ ...s.backBtn, ...anim(0.9) }} onClick={onBack}>← back</button>
          <div style={{ ...s.sectionLabel, textAlign: "center", color: moss, marginBottom: 12, ...anim(0.8) }}>Your favorite mantras</div>
          {!affs && <p style={{ ...s.dimMono, textAlign: "center", ...anim(0.7) }}>Loading...</p>}
          {affs && affs.length === 0 && <p style={{ ...s.dimMono, textAlign: "center", marginTop: 8, ...anim(0.7) }}>Heart a mantra to save it here.</p>}

          {affs && affs.length > 0 && (
            <div style={{ ...anim(0.7), paddingBottom: 100 }}>
              <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 14, color: ink, textAlign: "center", lineHeight: 1.5, marginBottom: 28 }}>
                Swipe to scroll through your mantras.
              </p>

              <div data-no-swipe-back style={{ position: "relative", height: FRONT_H, marginBottom: 28 }}>
                {/* dissolves in at back2 on a forward swipe */}
                <CardFace
                  key={`inc-${nextIn.idx}`}
                  affirmation={nextIn}
                  zIndex={0}
                  transform={xf(DEPTH.back2)}
                  background={DEPTH.back2.bg}
                  boxOpacity={nextInBoxOpacity}
                  contentDim={CONTENT_DIM.back2}
                  transition={BOX_TRANSITION}
                />

                <CardFace
                  key={`b2-${b2.idx}`}
                  affirmation={b2}
                  zIndex={1}
                  transform={xf(b2Depth)}
                  background={b2Depth.bg}
                  boxOpacity={b2BoxOpacity}
                  contentDim={b2Dim}
                  transition={BOX_TRANSITION}
                />

                <CardFace
                  key={`b1-${b1.idx}`}
                  affirmation={b1}
                  zIndex={2}
                  transform={xf(b1Depth)}
                  background={b1Depth.bg}
                  boxOpacity={1}
                  contentDim={b1Dim}
                  transition={BOX_TRANSITION}
                />

                {/* slides in from off-screen left on a backward swipe */}
                <CardFace
                  key={`prev-${prev.idx}`}
                  affirmation={prev}
                  zIndex={4}
                  transform={xf(DEPTH.front, `translateX(${backward ? 0 : -EXIT_DISTANCE}px) `)}
                  background={DEPTH.front.bg}
                  boxOpacity={prevBoxOpacity}
                  contentDim={CONTENT_DIM.front}
                  transition={BOX_TRANSITION}
                />

                <CardFace
                  key={a.idx}
                  affirmation={a}
                  zIndex={3}
                  transform={xf(frontDepth, `translateX(${backward ? 0 : dx}px) rotate(${backward ? 0 : rotate}deg) `)}
                  background={frontDepth.bg}
                  boxOpacity={frontBoxOpacity}
                  contentDim={frontDim}
                  transition={frontTransition}
                  interactive
                  onPointerDown={onPointerDown}
                  onPointerMove={onPointerMove}
                  onPointerUp={endDrag}
                  onPointerCancel={endDrag}
                  onPractice={onPractice}
                />
              </div>
            </div>
          )}

          {/* Prev / next controls — tap alternative to the drag gesture.
              Fixed ~96px above the bottom of the viewport so they stay put
              regardless of scroll position. The wrapper ignores pointer
              events so it doesn't block swipes on the card above/below it;
              the buttons themselves opt back in. */}
          {affs && affs.length > 1 && (
            <div style={{ position: "fixed", left: 0, right: 0, bottom: 96, display: "flex", justifyContent: "center", alignItems: "center", gap: 24, pointerEvents: "none", zIndex: 20 }}>
              <button onClick={() => goTo(1)} style={{ pointerEvents: "auto", background: cream, border: `1px solid ${moss}`, borderRadius: 999, width: 48, height: 48, color: moss, fontSize: 16, fontFamily: "'DM Mono', monospace", cursor: "pointer" }}>‹</button>
              <button onClick={() => goTo(-1)} style={{ pointerEvents: "auto", background: cream, border: `1px solid ${moss}`, borderRadius: 999, width: 48, height: 48, color: moss, fontSize: 16, fontFamily: "'DM Mono', monospace", cursor: "pointer" }}>›</button>
            </div>
          )}
        </Shell>
      );
    }

    // Renders one stacked card at whatever depth/opacity/content-dim its role
    // calls for. Every role — peeking, incoming, outgoing, and the real
    // interactive front card — renders through this SAME component with the
    // FULL card content (label, text, seen-count, practice button), so
    // nothing is missing mid-transition and nothing "just appears" on
    // remount. Depth (position + size) is pure `transform`, so it's
    // GPU-composited and actually animates; content dims via its own nested
    // opacity, which multiplies visually with the box's own opacity for
    // free — and since the content lives inside the same transformed box, it
    // scales with the card automatically too.
    function CardFace({
      affirmation, zIndex, transform, background, boxOpacity, contentDim, transition,
      interactive, onPointerDown, onPointerMove, onPointerUp, onPointerCancel, onPractice,
    }) {
      return (
        <div
          onPointerDown={interactive ? onPointerDown : undefined}
          onPointerMove={interactive ? onPointerMove : undefined}
          onPointerUp={interactive ? onPointerUp : undefined}
          onPointerCancel={interactive ? onPointerCancel : undefined}
          style={{
            position: "absolute", top: 0, left: 0, right: 0, height: FRONT_H,
            transformOrigin: "50% 0%",
            transform, background, opacity: boxOpacity, zIndex,
            borderRadius: 16,
            padding: "34px 26px 28px",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "space-between",
            textAlign: "center",
            transition,
            touchAction: "pan-y",
            cursor: interactive ? "grab" : "default",
            userSelect: "none",
            overflow: "hidden",
          }}
        >
          <div style={{ ...s.sectionLabel, color: sage, marginBottom: 0, opacity: contentDim, transition: CONTENT_TRANSITION }}>Mantra</div>
          <p style={{
            fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontSize: 26, lineHeight: 1.4, color: "#fff", margin: "18px 0",
            opacity: contentDim, transition: CONTENT_TRANSITION,
          }}>{affirmation.text}</p>
          <div style={{ opacity: contentDim, transition: CONTENT_TRANSITION }}>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: sage, marginBottom: 16 }}>
              Seen {affirmation.seenCount} time{affirmation.seenCount === 1 ? "" : "s"}
            </div>
            <button
              onClick={() => interactive && onPractice && onPractice(affirmation)}
              style={{
                background: "none", border: `1px solid ${sage}`, borderRadius: 14, padding: "8px 22px",
                fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: "0.05em", color: sage,
                cursor: interactive ? "pointer" : "default", pointerEvents: interactive ? "auto" : "none",
              }}>
              PRACTICE
            </button>
          </div>
        </div>
      );
    }

    // ─── Practice an affirmation: write it out five times ────────────────
    // Standalone counterpart to DailyEntryView's final check-in step, but
    // usable for any saved affirmation (not just today's), reached from the
    // "PRACTICE" button in AffirmationHistoryView.
    function AffirmationPracticeView({ affirmation, onBack }) {
      const { useState: useS } = React;
      const [writeInputs, setWriteInputs] = useS(["", "", "", "", ""]);

      const normalizeAff = (str) => (str || "").trim().toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ");
      const affTarget = normalizeAff(affirmation?.text);
      const allWritten = writeInputs.every(w => w.trim() && normalizeAff(w) === affTarget);

      return (
        <Shell key="affirmation-practice">
          <button style={s.backBtn} onClick={onBack}>← back</button>
          <h2 style={s.pageTitle}>Practice</h2>
          <div style={{ ...s.affirmationCard, marginBottom: 28, textAlign: "center", background: ink }}>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: "rgba(255,255,255,0.35)", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 16 }}>Mantra</div>
            <p style={s.affirmationText}>{affirmation?.text}</p>
          </div>
          <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 14 }}>Write it out, five times</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 8 }}>
            {writeInputs.map((val, i) => {
              const matches = val.trim() && normalizeAff(val) === affTarget;
              return (
                <div key={i} style={{ position: "relative" }}>
                  <input
                    value={val}
                    onChange={e => setWriteInputs(prev => prev.map((v, idx) => idx === i ? e.target.value : v))}
                    placeholder={`Type it again (${i + 1} of 5)`}
                    style={{ ...s.writeInput, ...(matches ? s.writeInputCorrect : {}) }}
                  />
                  {matches && (
                    <span style={s.writeCheck}>
                      <svg width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 3.6L3.7 6L9 1" stroke="#2C3B2A" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </span>
                  )}
                </div>
              );
            })}
          </div>
          <button
            onClick={onBack}
            disabled={!allWritten}
            style={{ width: "100%", background: ink, color: cream, border: "none", borderRadius: 14, padding: "16px 0", fontFamily: "'DM Mono', monospace", fontSize: 13, letterSpacing: "0.05em", cursor: allWritten ? "pointer" : "default", marginTop: 28, marginBottom: 8, opacity: allWritten ? 1 : 0.4, transition: "opacity 0.2s" }}>
            Done
          </button>
        </Shell>
      );
    }

    function MoodSparkline({ days, weights, onDayClick, onEmptyDayClick, ctaLabel, tip, onRefreshTip, hideHeader, hideTip, onActiveDay, svgHeight }) {
      const { useState: useS, useEffect: useE, useRef, useMemo: useM } = React;
      const scrollRef = useRef(null);
      const [centerIdx, setCenterIdx] = useS(null);
      const [hPad, setHPad] = useS(160);

      const DAY_W = 44;
      const SVG_H = svgHeight ?? 100;
      const PAD_Y = 8;

      const scored = useM(() => {
        const all = [...days].reverse().map(d => {
          if (!d.mood || d.mood.length === 0) return { ...d, score: null };
          const sum = d.mood.reduce((acc, m) => acc + moodWeight(m.label, d.key, weights), 0);
          return { ...d, score: sum / d.mood.length };
        });
        const firstData = all.findIndex(d => d.score !== null);
        const trimmed = firstData > 0 ? all.slice(firstData) : all;
        // Append 7 future days
        const futureDays = [];
        for (let i = 1; i <= 7; i++) {
          const fd = new Date();
          fd.setDate(fd.getDate() + i);
          const key = fd.toISOString().split('T')[0];
          const fullDate = fd.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
          futureDays.push({ key, score: null, mood: null, future: true, dayNum: fd.getDate(), fullDate });
        }
        return [...trimmed, ...futureDays];
      }, [days.length]);

      const todayIdx = scored.findIndex(d => d.key === getTodayKey());
      const totalW = scored.length * DAY_W + hPad * 2;

      useE(() => {
        if (!scrollRef.current) return;
        const el = scrollRef.current;
        const pad = Math.max(80, Math.round(el.clientWidth / 2 - DAY_W / 2));
        setHPad(pad);
        setTimeout(() => {
          const tIdx = scored.findIndex(d => d.key === getTodayKey());
          const targetIdx = tIdx >= 0 ? tIdx : scored.length - 8;
          el.scrollLeft = pad + targetIdx * DAY_W + DAY_W / 2 - el.clientWidth / 2;
        }, 60);
      }, [scored.length]);

      function handleScroll(e) {
        const el = e.target;
        const center = el.scrollLeft + el.clientWidth / 2;
        // Dots sit at hPad + i*DAY_W + DAY_W/2, so subtract 0.5 to center hit zones on dots
        const rawIdx = (center - hPad) / DAY_W - 0.5;
        setCenterIdx(Math.max(0, Math.min(scored.length - 1, Math.round(rawIdx))));
      }

      const activeDayIdx = centerIdx !== null ? centerIdx : (todayIdx >= 0 ? todayIdx : scored.length - 8);
      const activeDay = scored[activeDayIdx];

      useE(() => {
        if (onActiveDay && activeDay) onActiveDay(activeDay);
      }, [activeDayIdx]);

      const points = [];
      scored.forEach((d, i) => {
        if (d.score === null) return;
        const x = hPad + i * DAY_W + DAY_W / 2;
        const y = PAD_Y + ((2 - d.score) / 4) * (SVG_H - PAD_Y * 2);
        points.push({ x, y, i });
      });

      // Color helpers: ≤-1 = orange, -1→0 = orange→sage, 0→1 = sage→green, ≥1 = dark green
      const C_ORANGE  = [196, 120,  58];
      const C_SAGE    = [138, 158, 133];
      const C_GREEN   = [ 44,  59,  42];
      function scoreToRgb(score) {
        if (score <= -1) return C_ORANGE;
        if (score >=  1) return C_GREEN;
        const [from, to, t] = score < 0
          ? [C_ORANGE, C_SAGE,  score + 1]
          : [C_SAGE,   C_GREEN, score];
        return [0,1,2].map(k => Math.round(from[k] + (to[k] - from[k]) * t));
      }
      function lerpRgb(a, b, t) { return [0,1,2].map(k => Math.round(a[k] + (b[k] - a[k]) * t)); }
      function rgbStr([r,g,b]) { return `rgb(${r},${g},${b})`; }
      function scoreToColor(score) { return rgbStr(scoreToRgb(score)); }

      // Build bezier sub-samples for gradient segments.
      // Horizontal tangents at every dot: cp y always equals endpoint y.
      // This means: (1) curve always exits/enters each dot horizontally through its center,
      // (2) equal-score adjacent dots produce a perfectly straight line (mathematically exact).
      const GRAD_N = 48;
      const TENSION = 0.45; // kept for bezierD (future wave)
      const CR_ALPHA = 0.167; // Catmull-Rom → cubic Bézier conversion factor
      const gradSegments = points.length > 1 ? points.slice(1).flatMap((p2, idx) => {
        const i = idx + 1;
        const p1 = points[i - 1];
        const p0 = i >= 2 ? points[i - 2] : null;
        const p3 = i < points.length - 1 ? points[i + 1] : null;
        const s1 = scored[p1.i].score, s2 = scored[p2.i].score;
        const thisFlat = Math.abs(s1 - s2) < 0.001;
        const prevFlat = p0 && Math.abs(scored[p0.i].score - s1) < 0.001;
        const nextFlat = p3 && Math.abs(s2 - scored[p3.i].score) < 0.001;
        // Catmull-Rom control points for smooth natural curves
        let cp1x = p1.x + (p2.x - (p0 ? p0.x : p1.x)) * CR_ALPHA;
        let cp1y = p1.y + (p2.y - (p0 ? p0.y : p1.y)) * CR_ALPHA;
        let cp2x = p2.x - ((p3 ? p3.x : p2.x) - p1.x) * CR_ALPHA;
        let cp2y = p2.y - ((p3 ? p3.y : p2.y) - p1.y) * CR_ALPHA;
        // Force horizontal y-tangents so equal-score adjacent days produce a straight line,
        // and transitions into/out of flat sections enter/exit smoothly
        if (thisFlat) { cp1y = p1.y; cp2y = p2.y; }
        else { if (prevFlat) cp1y = p1.y; if (nextFlat) cp2y = p2.y; }
        const cA = scoreToRgb(s1);
        const cB = scoreToRgb(s2);
        const pts = Array.from({ length: GRAD_N + 1 }, (_, k) => {
          const t = k / GRAD_N, mt = 1 - t;
          return {
            x: mt*mt*mt*p1.x + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*p2.x,
            y: mt*mt*mt*p1.y + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*p2.y,
            c: t <= 0.25 ? cA : t >= 0.75 ? cB : lerpRgb(cA, cB, (t - 0.25) / 0.5),
          };
        });
        return pts.slice(1).map((pt, k) => ({ x1: pts[k].x, y1: pts[k].y, x2: pt.x, y2: pt.y, c: pt.c, key: `${i}-${k}` }));
      }) : [];

      const activePt = points.find(p => p.i === activeDayIdx);

      // Future wave: alternating scores 0→1→0→1 for 7 days + phantom extension into right padding
      const FUTURE_WAVE_SCORES = [0, 1, 0, 1, 0, 1, 0];
      const futureWavePts = [];
      if (points.length > 0) {
        futureWavePts.push(points[points.length - 1]);
        let fi = 0;
        scored.forEach((d, i) => {
          if (!d.future) return;
          const s = FUTURE_WAVE_SCORES[fi] ?? 0;
          const x = hPad + i * DAY_W + DAY_W / 2;
          const y = PAD_Y + ((2 - s) / 4) * (SVG_H - PAD_Y * 2);
          futureWavePts.push({ x, y, i });
          fi++;
        });
        // Extend wave into right padding so it flows off-screen
        const lastPt = futureWavePts[futureWavePts.length - 1];
        for (let ext = 1; ext <= 4; ext++) {
          const s = FUTURE_WAVE_SCORES[(fi + ext) % FUTURE_WAVE_SCORES.length];
          futureWavePts.push({ x: lastPt.x + ext * DAY_W, y: PAD_Y + ((2 - s) / 4) * (SVG_H - PAD_Y * 2), i: -1 });
        }
      }
      function bezierD(pts) {
        if (pts.length < 2) return '';
        const segs = pts.slice(1).map((p2, idx) => {
          const p1 = pts[idx];
          const dx = (p2.x - p1.x) * TENSION;
          return `C ${(p1.x + dx).toFixed(1)},${p1.y.toFixed(1)} ${(p2.x - dx).toFixed(1)},${p2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
        });
        return `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} ${segs.join(' ')}`;
      }
      const futureLinePath = bezierD(futureWavePts);
      const futureFillPath = futureWavePts.length > 1
        ? `${futureLinePath} L ${futureWavePts[futureWavePts.length - 1].x.toFixed(1)},${SVG_H} L ${futureWavePts[0].x.toFixed(1)},${SVG_H} Z`
        : '';

      // Today's "New +" button data (shown inside SVG so it scrolls with chart)
      const todayDay = todayIdx >= 0 ? scored[todayIdx] : null;
      const showNewBtn = todayDay && !todayDay.mood && onEmptyDayClick;
      const todayBtnX = todayIdx >= 0 ? hPad + todayIdx * DAY_W + DAY_W / 2 : null;

      return (
        <div>
          {/* ── Active day display ── */}
          {!hideHeader && (
            <div style={{ padding: "4px 20px 16px" }}>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 10 }}>How you're doing</div>
              {activeDay && (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", gap: 12 }}>
                  <span style={{ fontFamily: "'Lora', serif", fontSize: 22, fontStyle: "italic", color: ink, lineHeight: 1.3, textAlign: "left" }}>
                    {activeDay.key === getTodayKey() ? "Today" : activeDay.fullDate}
                  </span>
                  {activeDay.mood && (
                    <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                      {activeDay.mood.map(m => (
                        <span key={m.label} style={{ fontSize: 30, lineHeight: 1 }}>{m.emoji}</span>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ── Scrollable chart ── */}
          <div style={{ position: "relative", marginTop: hideHeader ? 0 : 12 }}>
            <div style={{
              position: "absolute", left: "50%", top: 0, bottom: 18,
              width: 1, background: `${moss}88`, pointerEvents: "none", zIndex: 1,
              transform: "translateX(-50%)"
            }} />
            <div
              ref={scrollRef}
              onScroll={handleScroll}
              className="no-sb"
              style={{ overflowX: "scroll", WebkitOverflowScrolling: "touch", scrollbarWidth: "none", msOverflowStyle: "none", position: "relative", zIndex: 2 }}
            >
              <svg width={totalW} height={SVG_H} style={{ display: "block" }}>
                <line x1={hPad} y1={SVG_H / 2} x2={totalW - hPad} y2={SVG_H / 2}
                  stroke="rgba(0,0,0,0.07)" strokeWidth={1} />
                {/* Gradient fill — single path tracing bezier curve, closed at bottom, vertical gradient */}
                {gradSegments.length > 0 && (() => {
                  const allPts = [
                    { x: gradSegments[0].x1, y: gradSegments[0].y1 },
                    ...gradSegments.map(s => ({ x: s.x2, y: s.y2 }))
                  ];
                  const firstX = allPts[0].x;
                  const lastX = allPts[allPts.length - 1].x;
                  const d = [
                    `M ${firstX.toFixed(1)} ${allPts[0].y.toFixed(1)}`,
                    ...allPts.slice(1).map(p => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`),
                    `L ${lastX.toFixed(1)} ${SVG_H}`,
                    `L ${firstX.toFixed(1)} ${SVG_H}`,
                    'Z'
                  ].join(' ');
                  return (
                    <>
                      <defs>
                        {(() => {
                          // Anchor stops to score→y positions: green holds until score=1, orange holds from score=-1
                          const yGreen  = PAD_Y + (SVG_H - 2 * PAD_Y) * 0.25; // score=1
                          const yOrange = PAD_Y + (SVG_H - 2 * PAD_Y) * 0.75; // score=-1
                          const yFade   = Math.max(yOrange + 1, SVG_H - 48);
                          const pct = v => `${(v / SVG_H * 100).toFixed(1)}%`;
                          return (
                            <linearGradient id={`sparkline-fill-grad-${SVG_H}`} x1="0" y1="0" x2="0" y2={SVG_H} gradientUnits="userSpaceOnUse">

    // Standalone banner that reports the result of the Oura OAuth round trip.
    // oura-auth-callback.js 302-redirects the browser back to APP_RETURN_URL
    // (the site root) with ?oura=connected or ?oura=error&reason=..., and
    // that redirect can land while any view is mounted — so this lives
    // outside <App/> entirely rather than threading state through every
    // view branch.
    function OuraConnectToast() {
      const { useState: useS, useEffect: useE } = React;
      const [msg, setMsg] = useS(null);

      useE(() => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('oura');
        if (!status) return;
        window.history.replaceState({}, '', window.location.pathname);
        if (status === 'connected') {
          setMsg({ text: 'Oura connected', kind: 'ok' });
        } else {
          const reason = params.get('reason');
          setMsg({ text: reason ? `Oura connection failed (${reason})` : 'Oura connection failed', kind: 'error' });
        }
        const t = setTimeout(() => setMsg(null), 5000);
        return () => clearTimeout(t);
      }, []);

      if (!msg) return null;
      return (
        <div
          onClick={() => setMsg(null)}
          style={{
            position: 'fixed', bottom: 32, left: '50%', transform: 'translateX(-50%)',
            background: ink, color: cream, fontFamily: "'DM Mono', monospace", fontSize: 11,
            padding: '10px 20px', borderRadius: 999, whiteSpace: 'nowrap', letterSpacing: '0.04em',
            zIndex: 9999, cursor: 'pointer', border: msg.kind === 'error' ? `1px solid ${rust}` : 'none',
          }}
        >
          {msg.text}
        </div>
      );
    }

    // ─── Daily reminder (web push) ────────────────────────────────────
    // Each device saves a push subscription to Supabase (push_subscriptions).
    // A Supabase Edge Function runs every 15 min and sends the nudge to
    // devices whose local reminder time just passed, skipping days that
    // already have a check-in. See "Web Push Notifications with Supabase".
    const VAPID_PUBLIC_KEY = 'BKrFDaB-BAq0O0B-y1RjWQaNfwL9CuVOwnUPy8zDnuTVeMB0HlESLcsqUAnYAywXzXY-tdxVAr9LQCT6vN9O1-I';
    const vapidKeyBytes = (s) => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    const isIOSDevice = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isInstalledApp = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    async function getPushSub() {
      if (!pushSupported()) return null;
      const reg = await navigator.serviceWorker.getRegistration();
      return reg ? reg.pushManager.getSubscription() : null;
    }

    function DailyReminderCard({ style, eyebrow }) {
      const { useState: useS, useEffect: useE } = React;
      const [status, setStatus] = useS('checking'); // checking | off | on | busy
      const [time, setTime] = useS('20:00');
      const [note, setNote] = useS(null);

      useE(() => {
        (async () => {
          try {
            const sub = await getPushSub();
            if (sub && Notification.permission === 'granted') {
              const { data } = await supabaseClient.from('push_subscriptions').select('notify_time').eq('endpoint', sub.endpoint).maybeSingle();
              if (data?.notify_time) setTime(data.notify_time);
              setStatus(data ? 'on' : 'off');
            } else setStatus('off');
          } catch { setStatus('off'); }
        })();
      }, []);

      async function saveSub(sub, t) {
        const json = sub.toJSON();
        const { error } = await supabaseClient.from('push_subscriptions').upsert({
          endpoint: json.endpoint, user_id: currentUserId, sub: json,
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone, notify_time: t,
        });
        if (error) throw error;
      }

      async function turnOn() {
        setNote(null);
        if (!pushSupported()) {
          setNote(isIOSDevice() && !isInstalledApp()
            ? 'Add Feel Good to your Home Screen (Share → Add to Home Screen), then turn this on from there.'
            : "This browser can't receive notifications.");
          return;
        }
        if (isIOSDevice() && !isInstalledApp()) {
          setNote('Add Feel Good to your Home Screen (Share → Add to Home Screen), then turn this on from there.');
          return;
        }
        setStatus('busy');
        try {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') {
            setNote('Notifications are blocked for Feel Good. Turn them on in your phone’s Settings → Notifications.');
            setStatus('off');
            return;
          }
          const reg = await navigator.serviceWorker.ready;
          const sub = (await reg.pushManager.getSubscription())
            || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKeyBytes(VAPID_PUBLIC_KEY) });
          await saveSub(sub, time);
          setStatus('on');
        } catch (e) {
          setNote("Couldn't turn on reminders. Try again in a moment.");
          setStatus('off');
        }
      }

      async function turnOff() {
        setNote(null);
        setStatus('busy');
        try {
          const sub = await getPushSub();
          if (sub) {
            await supabaseClient.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
            await sub.unsubscribe();
          }
        } catch { /* fall through */ }
        setStatus('off');
      }

      async function changeTime(t) {
        if (!t) return;
        setTime(t);
        if (status !== 'on') return;
        try {
          const sub = await getPushSub();
          if (sub) await supabaseClient.from('push_subscriptions').update({ notify_time: t, tz: Intl.DateTimeFormat().resolvedOptions().timeZone }).eq('endpoint', sub.endpoint);
        } catch { /* silent */ }
      }

      const on = status === 'on';
      const busy = status === 'busy' || status === 'checking';
      return (
        <div style={style}>
          {eyebrow("Daily Reminder")}
          <p style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, color: bone, lineHeight: 1.7, margin: "0 0 16px" }}>
            {on
              ? "We’ll nudge this device to check in each day. If you’ve already checked in, we’ll stay quiet."
              : "Get a gentle nudge on this device to check in each day. It’s skipped on days you’ve already checked in."}
          </p>
          <label style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid rgba(255,255,255,0.15)", borderBottom: "1px solid rgba(255,255,255,0.15)", padding: "10px 0", marginBottom: 16 }}>
            <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: shale, letterSpacing: "0.04em" }}>Remind me at</span>
            <input type="time" value={time} onChange={(e) => changeTime(e.target.value)}
              style={{ background: "none", border: "none", fontFamily: "'Lora', Georgia, serif", fontSize: 15, fontStyle: "italic", color: bone, textAlign: "right", colorScheme: "dark", padding: 0 }} />
          </label>
          {note && <p style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: shale, lineHeight: 1.6, margin: "0 0 14px" }}>{note}</p>}
          <button
            onClick={on ? turnOff : turnOn}
            disabled={busy}
            style={{ width: "100%", background: "none", border: `1px solid ${bone}`, borderRadius: 999, padding: "10px 0", fontFamily: "'DM Mono', monospace", fontSize: 10, color: bone, letterSpacing: "0.04em", cursor: busy ? "default" : "pointer", opacity: busy ? 0.5 : 1 }}
          >
            {status === 'checking' ? "Checking…" : status === 'busy' ? "One moment…" : on ? "Turn off" : "Turn on"}
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<><App /><OuraConnectToast /></>);
  </script>
</body>
</html>
