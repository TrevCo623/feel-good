    html, body { margin: 0; padding: 0; background: #ECE8E6; }
    * { -webkit-tap-highlight-color: transparent; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }
    /* Home ↔ Profile transition — blanket exit dissolve on the outgoing
       screen, then a staggered per-element dissolve+scale entrance on the
       incoming screen. See homeProfileTransition() in App() and the
       cascade() helper in ProfileView. */
    @keyframes dissolveOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(26px); }
    }
    @keyframes dissolveScaleIn {
      from { opacity: 0; transform: translateY(10px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Universal page transition — every navigate()/goBackView() call not
       handled by the Home↔Profile transition above goes through the
       browser's View Transitions API (see navigate()/goBackView() in
       App()), which snapshots the whole screen before and after the swap
       and cross-fades between them. This just tunes the browser's default
       cross-fade timing to match the app's feel; browsers without support
       (e.g. Firefox) simply ignore it and swap instantly, same as before. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 260ms;
      animation-timing-function: ease;
    }

    function getMoodTip(historyDays, weights) {
      const recentWithMood = historyDays.slice(0, 7).filter(d => d.mood && d.mood.length > 0).slice(0, 4);
      if (recentWithMood.length < 2) return null;
      const scores = recentWithMood.map(d => {
        const sum = d.mood.reduce((acc, m) => acc + moodWeight(m.label, d.key, weights), 0);
        return sum / d.mood.length;
      });
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      // scores[0] = most recent, scores[last] = oldest; positive trend = improving
      const trend = scores[0] - scores[scores.length - 1];
      const doy = getDayOfYear();
      let cat;
      if (avg >= 1.2) cat = 'strong';
      else if (trend >= 0.8 && avg > -0.2) cat = 'rising';
      else if (avg >= 0.35) cat = 'good';
      else if (avg >= -0.35) cat = 'mixed';
      else if (avg >= -1.1) cat = 'low';
      else cat = 'rough';
      const tips = MOOD_TIPS[cat];
      return tips[doy % tips.length];
    }

    // ─── Helpers ──────────────────────────────────────────────────────
    function getTodayKey() {
      const d = new Date();
      return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
    }
    const DAILY_REFRESH_HOUR = 4; // Don't auto-generate new daily content before 4am local time
    function getWeekNumber(date) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 4 - (d.getDay() || 7));
      const y = new Date(d.getFullYear(), 0, 1);
      return Math.ceil(((d - y) / 86400000 + 1) / 7);
    }
    function getWeekKey() {
      const now = new Date();
      return `${now.getFullYear()}-W${getWeekNumber(now)}`;
    }
    function getDayOfWeek() { return new Date().toLocaleDateString("en-US", { weekday: "long" }); }
    function getDateDisplay() { return new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }
    function getDayOfYear(date) {
      const now = date || new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      return Math.floor((now - start) / 86400000) - 1;
    }

    // ─── Active journal prompt (daily, with persistence) ──────────────
    async function getActiveJournalInfo() {
      // Walk back up to 4 days — find oldest consecutive unanswered prompt
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let activeDate = new Date(today);
      for (let i = 1; i <= 4; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split("T")[0];
        const entry = await storageGet(`journal:${key}`);
        if (!entry) {
          activeDate = d;
        } else {
          break;
        }
      }
      const key = activeDate.toISOString().split("T")[0];
      const isToday = key === today.toISOString().split("T")[0];
      // Check for AI-generated prompt override (from pattern detection "Yes")
      const override = isToday ? await storageGet(`settings:prompt_override_${key}`) : null;
      const prompt = override?.prompt || DAILY_PROMPTS[getDayOfYear(activeDate) % DAILY_PROMPTS.length];
      const dateLabel = isToday ? null : activeDate.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      return { key, prompt, dateLabel };
    }

    async function sbGet(table, filters = {}) {
      try {
        const params = new URLSearchParams({ select: '*', ...filters });
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: SB_HEADERS });
        if (!res.ok) return null;
        const rows = await res.json();
        return rows[0] || null;
      } catch { return null; }
    }

    async function sbList(table, select = '*', filter = '') {
      try {
        let url = `${SUPABASE_URL}/rest/v1/${table}?select=${select}`;
        if (filter) url += `&${filter}`;
        const res = await fetch(url, { headers: SB_HEADERS });
        if (!res.ok) return [];
        return await res.json();
      } catch { return []; }
    }

    async function sbUpsert(table, row) {
      try {
        const rowWithUser = currentUserId ? { ...row, user_id: currentUserId } : row;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(rowWithUser),
        });
        return res.ok;
      } catch { return false; }
    }

    async function claimExistingData(userId) {
      // Claim null-owned rows in tables that use direct Supabase RLS
      const tables = ['journal_entries', 'affirmations', 'settings'];
      for (const table of tables) {
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/${table}?user_id=is.null`, {
            method: 'PATCH',
            headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
            body: JSON.stringify({ user_id: userId }),
          });
        } catch { /* silent */ }
      }
      // Moods go through the secure proxy function
      try {
        await fetch(`${FUNCTIONS_BASE}/moods?user_id=is.null`, {
          method: 'PATCH',
          headers: { 'Authorization': SB_HEADERS['Authorization'], 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ user_id: userId }),
        });
      } catch { /* silent */ }
    }

    // ─── Storage layer ────────────────────────────────────────────────
    async function storageGet(key) {
      if (key === 'user:traits' || key === 'user:insecurities' || key === 'user:mood_counts' || key === 'user:tool_counts') {
        const row = await sbGet('settings', { key: `eq.${key.replace(':', '_')}` });

      }
      if (key === 'affirmation:ratings') {
        const row = await sbGet('settings', { key: 'eq.affirmation_ratings' });
        return row ? row.value : null;
      }
      if (key.startsWith('journal:')) {
        const dk = key.replace('journal:', '');
        const row = await sbGet('journal_entries', { date_key: `eq.${dk}` });
        if (!row) return null;
        return { text: row.body, prompt: row.prompt, savedAt: row.saved_at, dateKey: row.date_key,
          dateDisplay: new Date(dk + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) };

      if (key.startsWith('mood:')) {
        const dk = key.replace('mood:', '');
        try {
          const res = await fetch(`${FUNCTIONS_BASE}/moods?select=*&date_key=eq.${dk}`, {
            headers: { 'Authorization': SB_HEADERS['Authorization'], 'Content-Type': 'application/json' },

      if (key.startsWith('affirmation:')) {
        const dk = key.replace('affirmation:', '');
        const row = await sbGet('affirmations', { date_key: `eq.${dk}` });
        return row ? { text: row.body, idx: row.idx } : null;
      }
      if (key.startsWith('settings:')) {
        const row = await sbGet('settings', { key: `eq.${key.replace('settings:', '')}` });
        return row ? row.value : null;
      }
      return null;
    }

    async function storageSet(key, value) {
      if (key === 'user:traits' || key === 'user:insecurities' || key === 'user:mood_counts' || key === 'user:tool_counts') {
        await sbUpsert('settings', { key: key.replace(':', '_'), value }); return;

      if (key === 'affirmation:ratings') {
        await sbUpsert('settings', { key: 'affirmation_ratings', value }); return;

      if (key.startsWith('journal:')) {
        const dk = key.replace('journal:', '');
        const ok = await sbUpsert('journal_entries', { date_key: dk, body: value.text, prompt: value.prompt, saved_at: value.savedAt });
        if (value.note !== undefined && value.note !== null) {
          await sbUpsert('settings', { key: 'mood_note_' + dk, value: value.note });

        return ok;

      if (key.startsWith('mood:')) {
        const dk = key.replace('mood:', '');
        const arr = Array.isArray(value) ? value : [value];
        try {
          await fetch(`${FUNCTIONS_BASE}/moods`, {

          });
        } catch { /* silent */ }
        return;
      }
      if (key.startsWith('affirmation:')) {
        const dk = key.replace('affirmation:', '');
        const body = typeof value === 'string' ? value : (value?.text || '');
        const idx = (typeof value === 'object' && value) ? (value.idx || 0) : 0;
        await sbUpsert('affirmations', { date_key: dk, body, idx }); return;
      }
      if (key.startsWith('settings:')) {
        await sbUpsert('settings', { key: key.replace('settings:', ''), value }); return;
      }
    }

      }
      return [];

    async function callClaude(type, data) {
      try {
        const res = await fetch(FUNCTIONS_BASE + '/claude', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, data }),
        });
        if (!res.ok) {
          const errBody = await res.text().catch(() => '(unreadable)');
          console.error(`[claude fn] ${type} → ${res.status}:`, errBody);
          return null;
        }
        const json = await res.json();
        if (!json.text) console.warn(`[claude fn] ${type} returned empty text`, json);
        return json.text || null;
      } catch (e) {
        console.error(`[claude fn] ${type} fetch error:`, e);
        return null;
      }
    }

      Great:2, Energized:2, Strong:2, Loved:2, Inspired:2, Confident:2, Proud:2, Free:2,
      // +1
      Good:1, Focused:1, Grounded:1, Grateful:1, Hopeful:1, Peaceful:1,
      // 0
      Okay:0, Calm:0, Pensive:0, Numb:0, Tired:0, Scattered:0,
      // -1
      Low:-1, Restless:-1, Anxious:-1, Lonely:-1, Bummed:-1,

    // Score changes that only apply from a given date on, so past check-ins
    // keep the score they had when they were logged. Grounded moved from the
    // +1 row to the neutral row of the 5×5 grid on 2026-09-30.
    const MOOD_WEIGHT_CHANGES = [{ label: "Grounded", from: "2026-09-30", weight: 0 }];
    function moodWeight(label, dateKey, table = HOME_WEIGHTS) {
      const change = MOOD_WEIGHT_CHANGES.find(c => c.label === label);
      if (change && dateKey && dateKey >= change.from) return change.weight;
      return table[label] ?? 0;
    }

    function dayVibePhrase(score, dateKey) {
      const hash = (dateKey || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      const pick = arr => arr[hash % arr.length];
      if (score < -1)  return pick(["Feeling low", "Feeling rough", "Feeling heavy", "Feeling down", "Feeling drained"]);
      if (score <= 0)  return pick(["Feeling off", "Feeling mixed", "Feeling unsettled", "Feeling so-so", "Feeling meh"]);
      if (score <= 1)  return pick(["Feeling good", "Feeling okay", "Feeling grounded", "Feeling steady", "Feeling decent"]);
      return pick(["Feeling great", "Feeling energized", "Feeling stellar", "Feeling amazing", "Feeling on top"]);
    }

    // Pill bands for the check-in's dedicated Physical page — 3-tier
    // ink/moss/rust palette per Figma (node 182:1420), consistent across
    // the Activity, Sleep, and Readiness cards.
    // Activity: active calories OR steps, whichever is stronger.
    //   Great ≥ 600 cal or ≥ 10k steps · Good ≥ 300 cal or ≥ 6k steps · else Low
    function activityBand(calories, steps) {
      if (calories == null && steps == null) return null;
      const cal = calories ?? 0, st = steps ?? 0;
      if (cal >= 600 || st >= 10000) return { label: "Great", bg: ink, color: sage };
      if (cal >= 300 || st >= 6000) return { label: "Good", bg: moss, color: sage };
      return { label: "Low", bg: rust, color: tangerine };
    }
    // Sleep: hours first, efficiency second.
    //   < 6h Low · 6–7h Good · 7h+ Great (only if efficiency ≥ 80%, else Good).
    //   Falls back to efficiency alone if Oura gave no duration.
    function sleepBand(hours, efficiencyPct) {
      if (hours == null && efficiencyPct == null) return null;
      if (hours == null) {
        if (efficiencyPct >= 85) return { label: "Great", bg: ink, color: sage };
        if (efficiencyPct >= 65) return { label: "Good", bg: moss, color: sage };
        return { label: "Low", bg: rust, color: tangerine };
      }
      if (hours < 6) return { label: "Low", bg: rust, color: tangerine };
      if (hours < 7 || (efficiencyPct != null && efficiencyPct < 80)) return { label: "Good", bg: moss, color: sage };
      return { label: "Great", bg: ink, color: sage };
    }
    function readinessBand(score) {
      if (score == null) return null;
      if (score >= 85) return { label: "Great", bg: ink, color: sage };
      if (score >= 60) return { label: "Good", bg: moss, color: sage };
      return { label: "Low", bg: rust, color: tangerine };
    }


    // ── Oura data shaping — shared by the check-in's Physical step and Home ──
    // Readiness + sleep come from the day itself (Oura files last night's
    // sleep under the morning you woke up); activity from the most recent
    // *completed* day before it. Each falls back to the newest earlier value.
    function composeHealth(days, dayKey) {
      const sorted = [...(days || [])].sort((a, b) => a.date < b.date ? 1 : -1);
      const onOrBefore = (f) => sorted.find(d => d[f] != null && d.date <= dayKey);
      const before = (f) => sorted.find(d => d[f] != null && d.date < dayKey);
      const r = onOrBefore('readiness_score');
      const sl = onOrBefore('sleep_hours');
      const act = before('active_calories') || onOrBefore('active_calories');
      if (!r && !sl && !act) return null;
      return {
        date: dayKey,
        readiness_score: r?.readiness_score ?? null,
        sleep_hours: sl?.sleep_hours ?? null,
        sleep_efficiency: sl?.sleep_efficiency ?? null,
        active_calories: act?.active_calories ?? null,
        steps: act?.steps ?? null,
      };
    }

    function physicalMetricsFor(health) {
      if (!health) return null;
      const sleepTotalMin = health.sleep_hours != null ? Math.round(health.sleep_hours * 60) : null;
      const sleepH = sleepTotalMin != null ? Math.floor(sleepTotalMin / 60) : null;
      const sleepM = sleepTotalMin != null ? sleepTotalMin % 60 : null;
      return [
        { label: "Activity", value: health.active_calories != null ? `${Math.round(health.active_calories)}` : "—", sub: "Calories", band: activityBand(health.active_calories, health.steps) },
        { label: "Sleep", value: sleepH != null ? `${sleepH} hrs` : "—", sub: sleepM != null ? `${sleepM} minutes` : "", band: sleepBand(health.sleep_hours, health.sleep_efficiency) },
        { label: "Readiness", value: health.readiness_score != null ? `${Math.round(health.readiness_score)}%` : "—", sub: "Score", band: health.readiness_score != null ? readinessBand(health.readiness_score) : null },
      ];
    }

    async function saveExerciseEntry(dateKey, entry) {
      const logKey = `settings:exercise_log_${dateKey}`;
      const log = await storageGet(logKey);
      await storageSet(logKey, [...(Array.isArray(log) ? log : []), entry]);
      if (entry.commitment) {
        await storageSet(`settings:commitment_${dateKey}`, { text: entry.commitment, from: entry.title, exerciseId: entry.id, at: entry.at });
      }

    function withEmphasis(text) {
      if (!text) return text;
      return String(text).split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g).map((part, i) =>
        /^\*{1,2}[^*]/.test(part) && /\*$/.test(part) ? <em key={i}>{part.replace(/^\*+|\*+$/g, '')}</em> : part);

    function PersonalizationQuiz({ initialTraits = [], initialInsecurities = [], onCancel, onComplete }) {
      const { useState: useS, useEffect: useE } = React;
      const [step, setStep] = useS(0); // 0 = intro, 1..N = questions, N+1 = done
      const [answers, setAnswers] = useS({ traits: initialTraits, insecurities: initialInsecurities, feelGood: [], feelBad: [], supportStyle: [], primaryGoal: [] });
      const [draft, setDraft] = useS("");
      const [finishing, setFinishing] = useS(false);
      useE(() => {
        (async () => {
          const [fg, fb, ss, pg] = await Promise.all([
            storageGet("settings:feel_good_things"), storageGet("settings:feel_bad_things"),
            storageGet("settings:support_style"), storageGet("settings:primary_goal"),
          ]);
          const arr = (v) => Array.isArray(v) ? v : (v ? [v] : []);
          setAnswers(a => ({ ...a, feelGood: arr(fg), feelBad: arr(fb), supportStyle: arr(ss), primaryGoal: arr(pg) }));
        })();
      }, []);

      const total = QUIZ_QUESTIONS.length;
      const qIndex = step - 1;
      const q = qIndex >= 0 && qIndex < total ? QUIZ_QUESTIONS[qIndex] : null;

      function addEntry() {
        if (!q || q.type !== "multi" || !draft.trim()) return;
        setAnswers(a => ({ ...a, [q.key]: [...a[q.key], draft.trim()] }));
        setDraft("");
      }
      const removeEntry = (i) => setAnswers(a => ({ ...a, [q.key]: a[q.key].filter((_, idx) => idx !== i) }));
      const toggleOption = (opt) => setAnswers(a => ({ ...a, [q.key]: a[q.key].includes(opt) ? a[q.key].filter(o => o !== opt) : [...a[q.key], opt] }));
      // Typing something and hitting Next without tapping Add still counts.
      function next() {
        if (q && q.type === "multi" && draft.trim()) {
          setAnswers(a => ({ ...a, [q.key]: [...a[q.key], draft.trim()] }));
          setDraft("");
        }
        setStep(st => st + 1);
      }
      const canAdvance = !q || answers[q.key].length > 0 || (q.type === "multi" && draft.trim().length > 0);
      async function finish() {
        setFinishing(true);
        await onComplete(answers);
        setFinishing(false);
      }

      const titleStyle = { fontFamily: "'Lora', Georgia, serif", fontSize: 26, fontStyle: "italic", fontWeight: 400, color: ink, lineHeight: 1.3, margin: "0 0 10px" };
      const subStyle = { fontFamily: "'Lora', Georgia, serif", fontSize: 16, color: moss, lineHeight: 1.5, margin: "0 0 28px" };
      const primary = { ...s.primaryBtn, width: "100%" };
      const optionBase = { display: "block", width: "100%", textAlign: "left", background: bone, border: "2px solid transparent", borderRadius: 12, padding: "16px 18px", marginBottom: 10, fontFamily: "'Lora', Georgia, serif", fontSize: 16, color: ink, cursor: "pointer" };

      return (
        <Shell key={`quiz-${step}`}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32, minHeight: 20 }}>
            <button style={{ ...s.backBtn, padding: 0, cursor: "pointer" }} onClick={step === 0 ? onCancel : () => setStep(st => st - 1)}>{step === 0 ? "← cancel" : "← back"}</button>
            {q && (
              <div style={{ display: "flex", gap: 6 }}>
                {QUIZ_QUESTIONS.map((_, i) => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i === qIndex ? ink : "rgba(44,59,42,0.2)" }} />)}
              </div>
            )}
          </div>

          {step === 0 && (
            <div style={{ textAlign: "center", paddingTop: 32 }}>
              <img src="assets/logo.svg" alt="Feel Good" style={{ width: 56, height: "auto", marginBottom: 24 }} />
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 10, color: moss, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 20 }}>Update your profile</div>
              <h1 style={{ ...titleStyle, fontSize: 30, marginBottom: 16 }}>Let's check in on what we know about you.</h1>
              <p style={{ ...subStyle, fontStyle: "italic", marginBottom: 32 }}>Six quick questions. Your current answers are already filled in — change as much or as little as you like.</p>
              <button style={primary} onClick={() => setStep(1)}>Let's begin</button>
            </div>
          )}

          {q && (
            <div>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 14 }}>{step} of {total}</div>
              <h2 style={titleStyle}>{q.title}</h2>
              <p style={subStyle}>{q.sub}</p>
              {q.type === "multi" ? (
                <>
                  <div style={{ marginBottom: 12 }}>
                    {answers[q.key].map((entry, i) => (
                      <div key={i} style={s.editRow}>
                        <span style={s.editRowText}>{entry}</span>
                        <button style={s.removeBtn} onClick={() => removeEntry(i)}>×</button>
                      </div>
                    ))}
                  </div>
                  <div style={{ ...s.addRow, marginTop: 16 }}>
                    <input style={s.addInput} value={draft} onChange={e => setDraft(e.target.value)} placeholder={q.placeholder}
                      onKeyDown={e => e.key === "Enter" && addEntry()} />
                    <button style={s.addBtn} onClick={addEntry}>Add</button>
                  </div>
                </>
              ) : (
                <div>
                  {q.options.map(opt => {
                    const on = answers[q.key].includes(opt);
                    return (
                      <button key={opt} onClick={() => toggleOption(opt)}
                        style={{ ...optionBase, ...(on ? { background: ink, color: cream, borderColor: ink } : {}) }}>
                        {on ? "✓  " : ""}{opt}

                    );
                  })}

              )}
              <button style={{ ...primary, marginTop: 28, opacity: canAdvance ? 1 : 0.4 }} disabled={!canAdvance} onClick={next}>
                {step === total ? "Save" : "Next"}

            <div style={{ textAlign: "center", paddingTop: 40 }}>

              <h1 style={{ ...titleStyle, fontSize: 30, marginBottom: 16 }}>We'll use this to shape<br />what you see, starting now.</h1>
              <p style={{ ...subStyle, fontStyle: "italic", marginBottom: 40 }}>You can update this any time from your profile.</p>
              <button style={primary} disabled={finishing} onClick={finish}>{finishing ? "Saving…" : "Back to my profile"}</button>
            </div>
          )}
        </Shell>
      );
    }

    function WrittenExerciseView({ exerciseId, dateKey, onBack, onFinish, completionLabel }) {
      const { useState: useS } = React;
      const ex = WRITTEN_EXERCISES[exerciseId];
      const isPattern = !!ex.patterns;
      const [answers, setAnswers] = useS(() => (ex.questions || []).map(() => ""));
      const [picked, setPicked] = useS([]);
      const [note, setNote] = useS("");
      const [saving, setSaving] = useS(false);
      const [done, setDone] = useS(null);

      const cIdx = (ex.questions || []).findIndex(q => q.commitment);
      const wIdx = (ex.questions || []).findIndex(q => q.commitmentWhen);
      const tIdx = (ex.questions || []).findIndex(q => q.takeaway);
      const canFinish = isPattern
        ? (picked.length > 0 || note.trim().length > 0)
        : cIdx >= 0 ? answers[cIdx].trim().length > 0 : answers.some(a => a.trim().length > 0);

      async function finish() {
        if (!canFinish || saving) return;

        let commitment = null;
        if (cIdx >= 0) {

                      <div style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 15, lineHeight: 1.5, color: on ? "rgba(255,255,255,0.75)" : moss }}>{pt.prompt}</div>

        </Shell>

    }

    // ─── App ──────────────────────────────────────────────────────────
    function App() {

      const [dailyPrompt, setDailyPrompt] = useState("");
      const [activePromptKey, setActivePromptKey] = useState(null);

      const [historyDays, setHistoryDays] = useState([]);
      // Every mood check-in ever logged ([{ key, mood }], oldest first). The
      // calendar/home only load the last 90 days, but all-time stats on the

      const [allMoodDays, setAllMoodDays] = useState(null);
      const [historyLoaded, setHistoryLoaded] = useState(false);
      const [selectedDay, setSelectedDay] = useState(null);
      const [todayMoods, setTodayMoods] = useState([]);
      const [moodSaved, setMoodSaved] = useState(false);
      const [moodMoreOpen, setMoodMoreOpen] = useState(false);
      const [moodCounts, setMoodCounts] = useState({});
      const [moodOrder, setMoodOrder] = useState({ top: MOODS, extra: EXTRA_MOODS });
      const [toolCounts, setToolCounts] = useState({});
      const [streak, setStreak] = useState(0);
      const [saving, setSaving] = useState(false);
      const [savedFlash, setSavedFlash] = useState(false);
      const [saveError, setSaveError] = useState(false);
      const [mounted, setMounted] = useState(false);
      const [dbStatus, setDbStatus] = useState("checking"); // "checking" | "ok" | "error"
      const [editingTraits, setEditingTraits] = useState(false);
      const [editingInsecurities, setEditingInsecurities] = useState(false);
      const [traitDraft, setTraitDraft] = useState("");
      const [insecDraft, setInsecDraft] = useState("");
      const [entryDay, setEntryDay] = useState(null);
      const [exerciseMoods, setExerciseMoods] = useState([]);
      const [exerciseDateKey, setExerciseDateKey] = useState(null);
      const [exerciseDotOffset, setExerciseDotOffset] = useState(0); // +1 when the check-in included the Physical step
      const [resumeStep, setResumeStep] = useState(1);
      const [activeEntryDay, setActiveEntryDay] = useState(null);
      const [showAllEntries, setShowAllEntries] = useState(false);
      const [insight, setInsight] = useState(null);
      const [insightType, setInsightType] = useState(null);
      const [insightJournalPrompt, setInsightJournalPrompt] = useState(null);
      const [insightLoading, setInsightLoading] = useState(false);
      const [insightDismissing, setInsightDismissing] = useState(false);
      const [insightJournalQueued, setInsightJournalQueued] = useState(false);
      const [customPrompts, setCustomPrompts] = useState([]);
      const [totalMoodEntries, setTotalMoodEntries] = useState(0);
      const [activeChartDay, setActiveChartDay] = useState(null);
      const [chartScrolling, setChartScrolling] = useState(false);
      const chartScrollTimer = React.useRef(null);
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const traitsRef = React.useRef(DEFAULT_TRAITS);
      // Intro-quiz answers beyond traits/insecurities — fed to the AI prompts.
      const [aboutYou, setAboutYou] = useState({ feelGood: [], feelBad: [], supportStyle: [], primaryGoal: [] });
      const aboutYouRef = React.useRef(aboutYou);
      const insecuritiesRef = React.useRef([]);
      const aboutYouPayload = () => ({
        traits: (traitsRef.current || []).map(t => t.full || t.label),
        insecurities: insecuritiesRef.current || [],
        ...aboutYouRef.current,
      });
      const historyDaysRef = React.useRef([]);
      const navStackRef = React.useRef([]);
      const goingBackRef = React.useRef(false);

      // Shared Oura pull — lifted here so it can be kicked off once, in the
      // background, from the "Make today count" tap (rather than each view
      // that wants Oura data independently firing its own oura-sync call on
      // mount). DailyEntryView and ProfileView both read this instead of
      // fetching for themselves whenever it's already populated; either
      // still falls back to its own fetch if entered without this having
      // run yet (e.g. editing a past day, or opening Profile directly).
      // Consolidating to one in-flight call also avoids two near-simultaneous
      // calls racing to refresh the same single-use Oura refresh token.
      const [ouraSync, setOuraSync] = useState(null); // null = not pulled yet this session
      const ouraSyncInFlightRef = React.useRef(false);
      useEffect(() => { if (authUser && view === "home" && !ouraSync) pullOura(); }, [authUser, view, ouraSync]);
      function pullOura() {
        if (ouraSyncInFlightRef.current) return;
        ouraSyncInFlightRef.current = true;
        fetch(FUNCTIONS_BASE + '/oura-sync', { headers: { Authorization: SB_HEADERS['Authorization'] } })
          .then(r => r.ok ? r.json() : { connected: false, sync_error: r.ok ? null : `oura-sync returned ${r.status}` })
          .then(data => {
            if (data.sync_error) console.error('Oura sync failed:', data.sync_error);
            setOuraSync({ connected: !!data.connected, days: Array.isArray(data.days) ? data.days : [], syncError: data.sync_error || null });
          })
          .catch((err) => setOuraSync({ connected: false, days: [], syncError: `Couldn't reach the sync service (${err.message})` }))
          .finally(() => { ouraSyncInFlightRef.current = false; });
      }

      // Home ↔ Profile transition — confirmed sandbox behavior, wired up for
      // just this one pair of screens: the outgoing screen dissolves out as a
      // single block, then swaps, then the incoming screen's own top-level
      // pieces cascade in (Home already replays its existing slideUp `anim()`
      // on every fresh mount; ProfileView gets an equivalent stagger below).
      const [homeProfileTransitionPhase, setHomeProfileTransitionPhase] = useState('idle'); // 'idle' | 'exiting' | 'entering'
      const homeProfileTransitionTimers = React.useRef([]);
      useEffect(() => () => homeProfileTransitionTimers.current.forEach(clearTimeout), []);

      const todayKey = getTodayKey();

      useEffect(() => {
        setMounted(true);
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session) {
            currentUserId = session.user.id;
            SB_HEADERS['Authorization'] = `Bearer ${session.access_token}`;
            setAuthUser(session.user);
            if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
              claimExistingData(session.user.id).then(() => { checkDb(); initApp(); loadHistoryCalendar(); });
            }
          } else {
            currentUserId = null;
            SB_HEADERS['Authorization'] = `Bearer ${SUPABASE_KEY}`;
            setAuthUser(null);
          }
          if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') setAuthLoading(false);
        });
        return () => subscription.unsubscribe();
      }, []);

      async function checkDb(retryCount = 0) {
        try {
          const res = await fetch(`${FUNCTIONS_BASE}/moods?select=date_key&limit=1`, {
            headers: { 'Authorization': SB_HEADERS['Authorization'], 'Content-Type': 'application/json' },
          });
          if (res.status === 401 && retryCount < 2) {
            // Token may still be refreshing — wait and retry
            await new Promise(r => setTimeout(r, 2000 * (retryCount + 1)));
            return checkDb(retryCount + 1);
          }
          setDbStatus(res.ok ? "ok" : `error:${res.status}`);
        } catch (e) {
          setDbStatus(`error:${e.message}`);
        }
      }

      async function initApp() {
        const storedTraits = await storageGet("user:traits");
        const storedInsec = await storageGet("user:insecurities");
        const resolvedTraits = storedTraits || DEFAULT_TRAITS;
        traitsRef.current = resolvedTraits;
        insecuritiesRef.current = storedInsec || DEFAULT_INSECURITIES;
        {
          const arr = (v) => Array.isArray(v) ? v : (v ? [v] : []);
          const [fg, fb, ss, pg] = await Promise.all([
            storageGet("settings:feel_good_things"), storageGet("settings:feel_bad_things"),
            storageGet("settings:support_style"), storageGet("settings:primary_goal"),
          ]);
          const loaded = { feelGood: arr(fg), feelBad: arr(fb), supportStyle: arr(ss), primaryGoal: arr(pg) };
          aboutYouRef.current = loaded;
          setAboutYou(loaded);
        }
        setTraits(resolvedTraits);
        setInsecurities(storedInsec || DEFAULT_INSECURITIES);

        const storedRatings = await storageGet('affirmation:ratings');
        const resolvedRatings = storedRatings || { liked: [], disliked: [] };
        setRatings(resolvedRatings);

        // Today's mantra is whatever you picked in today's check-in — no more
        // auto-generated daily mantra (it would overwrite your pick).
        const cachedAff = await storageGet(`affirmation:${todayKey}`);
        if (cachedAff) {
          if (typeof cachedAff === 'string') setAffirmation({ text: cachedAff, idx: -1 });
          else setAffirmation(cachedAff);
        }
        // Personal mantra set (seeded once from hearted + built-in mantras).
        Promise.all([storageGet('settings:mantra_set'), sbList('affirmations', 'date_key,body,idx')]).then(async ([storedSet, aRowsAll]) => {
          const rowsAll = Array.isArray(aRowsAll) ? aRowsAll : [];
          setMantraRows(rowsAll);
          if (Array.isArray(storedSet) && storedSet.length) { setMantraSet(storedSet); return; }
          const seeded = seedMantraSet(resolvedRatings, rowsAll);
          setMantraSet(seeded);
          if (seeded.length) await storageSet('settings:mantra_set', seeded);
        }).catch(() => setMantraSet(seedMantraSet(resolvedRatings, [])));

        const { key: pKey, prompt: pText, dateLabel: pDateLabel } = await getActiveJournalInfo();
        setDailyPrompt(pText);
        setActivePromptKey(pKey);
        setActivePromptDateLabel(pDateLabel);

        // Check if a journal prompt was queued from an insight (for tomorrow)
        const tomorrowD = new Date(); tomorrowD.setDate(tomorrowD.getDate() + 1);
        const tomorrowK = tomorrowD.toISOString().split('T')[0];
        const queued = await storageGet('settings:insight_journal_queued');
        if (queued?.forDate === tomorrowK) setInsightJournalQueued(true);

        const cachedEntry = await storageGet(`journal:${pKey}`);
        if (cachedEntry) { setSavedEntry(cachedEntry); setJournalEntry(cachedEntry.text || ""); }

        const cachedMood = await storageGet(`mood:${todayKey}`);
        if (cachedMood) { setTodayMoods(Array.isArray(cachedMood) ? cachedMood : [cachedMood]); setMoodSaved(true); }

        const counts = await storageGet('user:mood_counts');
        if (counts) {
          setMoodCounts(counts);
        }
        const tc = await storageGet('user:tool_counts');
        if (tc) setToolCounts(tc);

        const savedCustomPrompts = await storageGet('settings:custom_prompts');
        if (Array.isArray(savedCustomPrompts) && savedCustomPrompts.length > 0) setCustomPrompts(savedCustomPrompts);

        computeStreak();
      }

      async function computeStreak() {
        const keys = await storageList("mood:");
        const dates = keys.map(k => k.replace("mood:", "")).sort().reverse();
        setTotalMoodEntries(dates.length);
        if (!dates.length) { setStreak(0); return; }
        let count = 0;
        let cur = new Date();
        cur.setHours(0,0,0,0);
        for (let i = 0; i < 365; i++) {
          const key = cur.toISOString().split("T")[0];
          if (dates.includes(key)) { count++; cur.setDate(cur.getDate() - 1); }
          else if (i === 0) { cur.setDate(cur.getDate() - 1); continue; }
          else break;
        }
        setStreak(count);
      }

      function getWeightedPool(r, excludeIdx = -1) {
        const liked = r.liked || [];
        const disliked = r.disliked || [];
        const pool = [];
        AFFIRMATIONS.forEach((_, i) => {
          if (i === excludeIdx) return;
          if (disliked.includes(i)) return;
          const weight = liked.includes(i) ? 3 : 1;
          for (let w = 0; w < weight; w++) pool.push(i);
        });
        return pool.length ? pool : AFFIRMATIONS.map((_, i) => i);
      }

      function generateAffirmationWithRatings(r, excludeIdx = -1) {
        const pool = getWeightedPool(r, excludeIdx);
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        const aff = { text: AFFIRMATIONS[chosen], idx: chosen };
        setAffirmation(aff);
        storageSet(`affirmation:${todayKey}`, aff);
        return aff;
      }

      function generateAffirmation() {
        generateAffirmationWithRatings(ratings);
      }

      async function rateAffirmation(isLike) {
        if (!affirmation) return;
        const alreadyLiked = (ratings.liked || []).includes(affirmation.idx);
        const newLiked = alreadyLiked
          ? (ratings.liked || []).filter(i => i !== affirmation.idx)
          : [...new Set([...(ratings.liked || []), affirmation.idx])];
        const newRatings = { ...ratings, liked: newLiked };
        setRatings(newRatings);
        await storageSet('affirmation:ratings', newRatings);
      }

      async function toggleLikedIdx(idx) {
        // Like/unlike an arbitrary affirmation by pool index — used by the
        // saved-affirmations swipe view, where the card in view isn't
        // necessarily today's affirmation.
        const alreadyLiked = (ratings.liked || []).includes(idx);
        const newLiked = alreadyLiked
          ? (ratings.liked || []).filter(i => i !== idx)
          : [...new Set([...(ratings.liked || []), idx])];
        const newRatings = { ...ratings, liked: newLiked };
        setRatings(newRatings);
        await storageSet('affirmation:ratings', newRatings);
      }

      async function dislikeAffirmation() {
        if (!affirmation) return;
        const alreadyDisliked = (ratings.disliked || []).includes(affirmation.idx);
        const newDisliked = alreadyDisliked
          ? (ratings.disliked || []).filter(i => i !== affirmation.idx)
          : [...new Set([...(ratings.disliked || []), affirmation.idx])];
        const newRatings = { ...ratings, disliked: newDisliked };
        setRatings(newRatings);
        await storageSet('affirmation:ratings', newRatings);
      }

      async function refreshAffirmation() {
        // Get a new affirmation without marking anything as disliked
        setAffirmation(null);
        await storageSet(`affirmation:${todayKey}`, null);
        generateAIAffirmation(traitsRef.current, historyDays, true);
      }

      async function chooseAffirmation(idx) {
        // Explicit pick from the full pool (via ChooseAffirmationView) —
        // no AI call, no dislike/like bookkeeping, just set + persist.
        const aff = { text: AFFIRMATIONS[idx], idx };
        setAffirmation(aff);
        await storageSet(`affirmation:${todayKey}`, aff);
      }

      async function handleSettingsQuizComplete(answers) {
        const before = JSON.stringify({ t: traits.map(t => t.full), i: insecurities, ...aboutYouRef.current });
        const traitsChanged = before !== JSON.stringify({ t: answers.traits, i: answers.insecurities, feelGood: answers.feelGood, feelBad: answers.feelBad, supportStyle: answers.supportStyle, primaryGoal: answers.primaryGoal });
        const newTraits = answers.traits.map((t, i) => traits.find(x => x.full === t) || { id: `trait_${Date.now()}_${i}`, label: t.split(" ").slice(0, 3).join(" "), full: t });
        traitsRef.current = newTraits;
        setTraits(newTraits);
        setInsecurities(answers.insecurities);
        insecuritiesRef.current = answers.insecurities;
        const nextAbout = { feelGood: answers.feelGood, feelBad: answers.feelBad, supportStyle: answers.supportStyle, primaryGoal: answers.primaryGoal };
        aboutYouRef.current = nextAbout;
        setAboutYou(nextAbout);
        await Promise.all([
          storageSet("user:traits", newTraits),
          storageSet("user:insecurities", answers.insecurities),
          storageSet("settings:feel_good_things", answers.feelGood),
          storageSet("settings:feel_bad_things", answers.feelBad),
          storageSet("settings:support_style", answers.supportStyle),
          storageSet("settings:primary_goal", answers.primaryGoal),
          storageSet("settings:onboarding_complete", true),
        ]);
        goBackView();
      }

      // ─── Mantra set helpers ──────────────────────────────────────────
      const mantraCounts = {};
      mantraRows.forEach(r => { const k = normMantra(r.body); if (k) mantraCounts[k] = (mantraCounts[k] || 0) + 1; });
      const mantraPracticedFor = (t) => mantraCounts[normMantra(t)] || 0;
      async function saveMantraSet(next) {
        setMantraSet(next);
        await storageSet('settings:mantra_set', next);
      }
      async function pickMantra(dayKey, m) {
        const aff = { text: m.text, idx: m.idx ?? 0 };
        await storageSet(`affirmation:${dayKey}`, aff);
        if (dayKey === todayKey) setAffirmation(aff);
        setMantraRows(rows => [...rows.filter(r => r.date_key !== dayKey), { date_key: dayKey, body: aff.text, idx: aff.idx }]);
      }
      // "Suggest from my journals" on Edit my mantras — same prompt the old
      // daily mantra used, but nothing is saved until you tap + add.
      async function suggestMantra() {

        const journalThemes = days.filter(d => d.journal?.text).slice(0, 5).map(d => d.journal.text.slice(0, 80));

      async function generateAIAffirmation(resolvedTraits, days = [], force = false) {
        const cacheKey = `affirmation:${todayKey}`;
        if (!force) {
          const cached = await storageGet(cacheKey);
          if (cached) {
            setAffirmation(typeof cached === 'string' ? { text: cached, idx: -1 } : cached);
            return;
          }
          if (new Date().getHours() < DAILY_REFRESH_HOUR) return;
        }
        const recentMoods = (days || []).slice(0, 7).filter(d => d.mood).flatMap(d => d.mood.map(m => m.label));
        const moodTrend = recentMoods.length > 0
          ? `Recent moods: ${[...new Set(recentMoods)].slice(0, 6).join(', ')}`
          : 'No recent mood data yet';
        const journalThemes = (days || []).filter(d => d.journal?.text).slice(0, 5).map(d => d.journal.text.slice(0, 80));
        const text = await callClaude('affirmation', {

      // Headline labels for each insight type
      const INSIGHT_LABELS = {
        insight_3day: 'Trend',
        insight_trend: 'Trend', insight_theme: 'Theme', insight_data: 'Insight',
        weekly_summary: 'This week', pattern: 'Pattern', mood_note: 'Today', mood_improvement: 'Looking up',
      };
      const INSIGHT_HEADLINES = {
        insight_3day: 'The past few days',
        insight_trend: 'Your 4-day trend', insight_theme: 'A theme', insight_data: 'An insight',
        weekly_summary: 'This week', pattern: 'A pattern', mood_note: 'Right now', mood_improvement: 'Looking up',
      };

      // ── Home Insights: rolling 3-day trend ─────────────────────────────
      // Regenerated fresh every time the app opens (including coming back to
      // it after a few minutes away) and after every completed check-in —
      // no once-a-day cache, no 4am gate. Within one open, bouncing between
      // screens keeps the same insight rather than re-calling the AI.
      //
      // Always built from the last three calendar days (today + the two
      // before). If none of those have a check-in it falls back to the three
      // most recent check-ins, so there's always real data behind it. If the
      // moods request itself failed, it doesn't generate at all (keeps what's
      // showing and retries on the next Home visit) — generating from an
      // empty dataset is what used to produce "you haven't entered any data".
      const insightReqRef = React.useRef(0);      // latest request wins
      // One insight per day: it's generated once after the daily reset
      // (DAILY_REFRESH_HOUR, same as the mantra), cached, and shown unchanged
      // for the rest of the day — check-ins don't regenerate it. Only the
      // Refresh button (force) asks for a new one.
      const insightDayRef = React.useRef(null); // day key of the insight on screen
      const moodsLoadOkRef = React.useRef(true);

      async function generateInsight(days, force = false, avoidText = null) {
        const dayKey = getTodayKey();
        if (!force && insightDayRef.current === dayKey) return;
        const cacheKey = `settings:insight4_${dayKey}`;
        if (!force) {
          const reqAtStart = insightReqRef.current;
          const cached = await storageGet(cacheKey);
          if (reqAtStart !== insightReqRef.current) return;
          if (cached?.text) {
            insightDayRef.current = dayKey;
            setInsight(cached.text); setInsightType(cached.type || 'insight_3day'); setInsightJournalPrompt(cached.journalPrompt || null);
            return;
          }
          if (new Date().getHours() < DAILY_REFRESH_HOUR) {
            // Before the reset — keep showing yesterday's insight until it rolls over.
            const y = new Date(); y.setDate(y.getDate() - 1);
            const yKey = [y.getFullYear(), String(y.getMonth()+1).padStart(2,'0'), String(y.getDate()).padStart(2,'0')].join('-');
            const prev = await storageGet(`settings:insight4_${yKey}`);
            if (reqAtStart === insightReqRef.current && prev?.text) {
              setInsight(prev.text); setInsightType(prev.type || 'insight_3day'); setInsightJournalPrompt(prev.journalPrompt || null);
            }
            return;
          }
        }
        if (!moodsLoadOkRef.current) return;

        const allDays = days || [];
        const checkins = allDays.filter(d => d.mood?.length); // newest first
        if (!checkins.length) return; // nothing ever logged — tile stays hidden

        const scoreOf = (moods, key) => moods.reduce((a, m) => a + moodWeight(m.label, key), 0) / moods.length;
        const lastThree = allDays.slice(0, 3); // today, yesterday, day before
        const usingFallback = !lastThree.some(d => d.mood?.length);
        const windowDays = usingFallback ? checkins.slice(0, 3) : lastThree;
        const windowKeys = new Set(windowDays.map(d => d.key));

        const dayLabel = (d) => {
          const idx = allDays.findIndex(x => x.key === d.key);
          const dateStr = new Date(d.key + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
          if (idx === 0) return `Today (${dateStr})`;
          if (idx === 1) return `Yesterday (${dateStr})`;
          if (idx === 2) return dateStr;
          return `${dateStr} (${idx} days ago)`;
        };

        const windowData = windowDays.slice().reverse().map(d => ({ // oldest → newest
          label: dayLabel(d),
          checkedIn: !!d.mood?.length,
          moods: d.mood ? d.mood.map(m => m.label) : [],
          score: d.mood?.length ? Number(scoreOf(d.mood, d.key).toFixed(1)) : null,
          note: (d.journal?.note || '').slice(0, 200),
          journal: (d.journal?.text || '').slice(0, 300),
          happyHour: (d.happyHour || '').slice(0, 150),
          exercises: (d.exercises || []).map(e => typeof e === 'string' ? e : (e?.id || e?.name || '')).filter(Boolean),
        }));

        // Baseline: the ~2 weeks of check-ins before the window, for "vs. usual"
        const prior = checkins.filter(d => !windowKeys.has(d.key)).slice(0, 14);
        let baseline = null;
        if (prior.length >= 3) {
          const freq = {};
          prior.flatMap(d => d.mood.map(m => m.label)).forEach(l => { freq[l] = (freq[l] || 0) + 1; });
          baseline = {
            count: prior.length,
            avgScore: Number((prior.reduce((a, d) => a + scoreOf(d.mood, d.key), 0) / prior.length).toFixed(1)),
            topMoods: Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([l]) => l),
          };
        }

        const reqId = ++insightReqRef.current;
        insightDayRef.current = dayKey;
        setInsightLoading(true);
        try {
          const raw = await callClaude('insight_3day', { days: windowData, usingFallback, baseline, avoid: avoidText, about: aboutYouPayload() });
          if (reqId !== insightReqRef.current) return; // a newer request superseded this one
          if (raw) {
            const sepIdx = raw.indexOf('|||');
            const text = sepIdx > -1 ? raw.slice(0, sepIdx).trim() : raw.trim();
            const journalPrompt = sepIdx > -1 ? raw.slice(sepIdx + 3).trim() : null;
            setInsight(text); setInsightType('insight_3day'); setInsightJournalPrompt(journalPrompt);
            await storageSet(cacheKey, { text, journalPrompt, type: 'insight_3day', generatedAt: new Date().toISOString() });
          } else {
            // AI call failed — allow a retry on the next Home visit, and show
            // today's last good insight in the meantime if there is one.
            insightDayRef.current = null;
            const cached = await storageGet(cacheKey);
            if (reqId === insightReqRef.current && cached?.text) {
              setInsight(prev => prev || cached.text);
              setInsightType(prev => prev || cached.type || 'insight_3day');
              setInsightJournalPrompt(prev => prev || cached.journalPrompt || null);
            }
          }
        } finally {
          if (reqId === insightReqRef.current) setInsightLoading(false);
        }
      }

      async function dismissInsight() {
        const prevText = insight;
        setInsight(null); setInsightJournalPrompt(null); setInsightType(null);
        setInsightLoading(true); // show loading immediately, don't wait for generateInsight prologue
        try {
          await generateInsight(historyDaysRef.current, true, prevText);
        } finally {
          setInsightLoading(false);
        }
      }

      // Coming back to the app after a few minutes away counts as opening it.
      useEffect(() => {
        if (!authUser) return;
        let hiddenAt = null;
        const onVis = () => {
          if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
          if (hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) {
            loadHistoryCalendar(); // insight only changes if the day has reset
          }
          hiddenAt = null;
        };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, [authUser]);

      // Scroll reset handled inside Shell on mount

      // ─── Swipe back gesture ───────────────────────────────────────
      useEffect(() => {
        function goBack() {
          if (view === 'home') return;
          goBackView();
        }

        let startX = null, startY = null, startT = null;
        let isHorizontal = null;
        let el = null;

        function getEl() { return document.querySelector('[data-shell-container]'); }

        function startsInHorizScroll(target) {
          // Anything that handles its own horizontal swipes (the mantra card
          // decks) opts out of swipe-back with data-no-swipe-back.
          if (target && target.closest && target.closest('[data-no-swipe-back]')) return true;
          let node = target;
          while (node && node !== document.body) {
            const st = getComputedStyle(node);
            if (node.scrollWidth > node.clientWidth && (st.overflowX === 'scroll' || st.overflowX === 'auto')) return true;
            node = node.parentElement;
          }
          return false;
        }

        function onTouchStart(e) {
          if (startsInHorizScroll(e.target)) { startX = null; return; }
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startT = Date.now();
          isHorizontal = null;
          el = getEl();
          if (el) {
            el.style.transition = 'none';
            // Cancel any running CSS animations on child elements — each one
            // gets its own GPU compositor layer while animating, which causes
            // them to move independently when the parent is translated.
            // Snapping them to their final state (opacity:1, no transform)
            // is visually invisible since fill-mode:both already holds that state.
            el.querySelectorAll('*').forEach(child => {
              if (child.style && child.style.animationName && child.style.animationName !== 'none') {
                child.style.animation = 'none';
                child.style.opacity = '1';
                child.style.transform = '';
              }
            });
          }
        }

        function onTouchMove(e) {
          if (startX === null || !el) return;
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;

          // Block iOS native back animation immediately — before direction is confirmed.
          // Without this, iOS starts its zoom-shrink preview in the first few frames.
          if (isHorizontal !== false && dx > 0) e.preventDefault();

          if (isHorizontal === null) {
            if (Math.abs(dx) > Math.abs(dy) + 4) isHorizontal = true;
            else if (Math.abs(dy) > Math.abs(dx) + 4) isHorizontal = false;
            else return;
          }

          if (!isHorizontal || dx <= 0) return;
          const clampedDx = Math.max(0, dx);
          el.style.transform = `translateX(${clampedDx}px)`;
        }

        function onTouchEnd(e) {
          if (startX === null) return;
          const dx = e.changedTouches[0].clientX - startX;
          const dt = Date.now() - startT;
          const velocity = dx / dt;

          const shouldComplete = el && isHorizontal && dx > 0 &&
            (dx > window.innerWidth * 0.45 || (velocity > 0.7 && dx > 80));

          const elRef = el;
          startX = null; startY = null; isHorizontal = null; el = null;
          if (!elRef) return;

          if (shouldComplete) {
            elRef.style.transition = 'transform 0.25s ease-out';
            elRef.style.transform = `translateX(${window.innerWidth}px)`;
            setTimeout(() => { elRef.style.transition = ''; elRef.style.transform = ''; goBack(); }, 260);
          } else {
            elRef.style.transition = 'transform 0.3s ease-out';
            elRef.style.transform = 'translateX(0)';
            setTimeout(() => { elRef.style.transition = ''; elRef.style.transform = ''; }, 320);
          }
        }

        document.addEventListener('touchstart', onTouchStart, { passive: true });
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd, { passive: true });
        return () => {
          document.removeEventListener('touchstart', onTouchStart);
          document.removeEventListener('touchmove', onTouchMove);
          document.removeEventListener('touchend', onTouchEnd);
        };
      }, [view]);
      useEffect(() => { if (authUser && (view === "mood-breakdown" || view === "home" || view === "profile")) loadHistoryCalendar(); }, [view]);

      // rawNavigate()/rawGoBack() do the actual view swap with no animation
      // of their own — the Home↔Profile transition below calls these
      // directly (it manages its own dissolve/cascade timing and would
      // double up with the generic crossfade if it went through the public
      // navigate()/goBackView() wrappers further down).
      function rawNavigate(v) {
        navStackRef.current.push(view);
        setView(v);
      }
      function rawGoBack() {
        const prev = navStackRef.current.length > 0 ? navStackRef.current.pop() : 'home';
        setView(prev);
      }

      // navigate()/goBackView() — the public nav functions used by every
      // screen in the app except Home/Profile (see below). Wraps the swap in
      // the browser's View Transitions API when available, which
      // automatically cross-fades the outgoing screen out and the incoming
      // screen in (no per-view styling needed) instead of the previous
      // instant cut. Falls back to an instant swap on browsers that don't
      // support it (e.g. Firefox) — same as today's behavior there.
      function navigate(v) {
        if (document.startViewTransition) document.startViewTransition(() => rawNavigate(v));
        else rawNavigate(v);
      }
      function goBackView() {
        if (document.startViewTransition) document.startViewTransition(() => rawGoBack());
        else rawGoBack();
      }
      // A couple of flows (finishing a daily exercise, regenerating today's
      // affirmation from Traits) jump straight to "home" without pushing
      // onto the nav stack — same crossfade, just without navigate()'s
      // back-history bookkeeping.
      function jumpHome() {
        if (document.startViewTransition) document.startViewTransition(() => setView("home"));
        else setView("home");
      }

      // Home ↔ Profile transition — delays the actual view swap by
      // HP_EXIT_MS so the outgoing screen can play its dissolve-out first,
      // then performs the swap (via rawNavigate/rawGoBack, bypassing the
      // generic crossfade above) and flips to 'entering' so the incoming
      // screen's cascade plays.
      // Scoped to only these two nav actions; every other navigate()/
      // goBackView() call elsewhere in the app goes through the generic
      // crossfade above instead.
      const HP_EXIT_MS = 320;
      const HP_REENABLE_MS = 900;
      function homeProfileTransition(swap) {
        if (homeProfileTransitionPhase !== 'idle') return;
        setHomeProfileTransitionPhase('exiting');
        const t1 = setTimeout(() => {
          swap();
          setHomeProfileTransitionPhase('entering');
          const t2 = setTimeout(() => setHomeProfileTransitionPhase('idle'), HP_REENABLE_MS);
          homeProfileTransitionTimers.current.push(t2);
        }, HP_EXIT_MS);
        homeProfileTransitionTimers.current.push(t1);
      }
      const goToProfile = () => homeProfileTransition(() => rawNavigate("profile"));
      const backFromProfile = () => homeProfileTransition(() => rawGoBack());

      // Prevent browser native back gesture from reaching auth/outside the app
      useEffect(() => {
        window.history.pushState({ fg: true }, '');
        const onPop = () => { window.history.pushState({ fg: true }, ''); };
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);

      async function loadHistoryCalendar({ skipInsight = false } = {}) {
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 89);
        const startKey = startDate.toISOString().split("T")[0];

        const [jRows, mRows, aRows, iRows, eRows, nRows, hRows, rRows, cRows] = await Promise.all([
          sbList('journal_entries', 'date_key,body,prompt,saved_at', `date_key=gte.${startKey}`),
          fetch(`${FUNCTIONS_BASE}/moods?select=date_key,emoji,label&date_key=gte.${startKey}`, { headers: { 'Authorization': SB_HEADERS['Authorization'], 'Content-Type': 'application/json' } })
            .then(r => { moodsLoadOkRef.current = r.ok; return r.ok ? r.json() : []; })
            .catch(() => { moodsLoadOkRef.current = false; return []; }),
          sbList('affirmations', 'date_key,body', `date_key=gte.${startKey}`),
          sbList('settings', 'key,value', `key=gte.insight4_&key=lt.insight5_`),
          sbList('settings', 'key,value', `key=gte.exercises_&key=lt.exercises_z`),
          sbList('settings', 'key,value', `key=gte.mood_note_&key=lt.mood_note_z`),
          sbList('settings', 'key,value', `key=gte.happy_hour_&key=lt.happy_hour_z`),
          sbList('settings', 'key,value', `key=gte.mantra_reflection_&key=lt.mantra_reflection_z`),
          sbList('settings', 'key,value', `key=gte.commitment_&key=lt.commitment_z`),
        ]);

        // All-time moods (no date filter) for Profile / "Your moods" stats.
        // Runs after the main load so it never slows down the home screen.
        fetch(`${FUNCTIONS_BASE}/moods?select=date_key,emoji,label&order=date_key.asc`, { headers: { 'Authorization': SB_HEADERS['Authorization'], 'Content-Type': 'application/json' } })
          .then(r => r.ok ? r.json() : null)
          .then(rows => {
            if (!Array.isArray(rows)) return;
            const todayKey = new Date().toISOString().split("T")[0];
            const all = [];
            rows.forEach(r => {
              if (!r.date_key || r.date_key > todayKey) return;
              let mood;
              try { const p = JSON.parse(r.label); mood = Array.isArray(p) ? p : [{ emoji: r.emoji, label: r.label }]; }
              catch { mood = [{ emoji: r.emoji, label: r.label }]; }
              if (mood && mood.length > 0) all.push({ key: r.date_key, mood });
            });
            setAllMoodDays(all);
          })
          .catch(() => {});

        const jMap = Object.fromEntries(jRows.map(r => [r.date_key, r]));
        const mMap = Object.fromEntries(mRows.map(r => [r.date_key, r]));
        const aMap = Object.fromEntries(aRows.map(r => [r.date_key, r]));
        const iMap = Object.fromEntries(iRows.map(r => [r.key.replace('insight4_', ''), r.value?.short || r.value?.text || null]));
        const eMap = Object.fromEntries(eRows.map(r => [r.key.replace('exercises_', ''), r.value || []]));
        const hMap = Object.fromEntries(hRows.map(r => [r.key.replace('happy_hour_', ''), r.value || '']));
        const nMap = Object.fromEntries(nRows.map(r => [r.key.replace('mood_note_', ''), r.value || '']));
        const rMap = Object.fromEntries(rRows.map(r => [r.key.replace('mantra_reflection_', ''), r.value || '']));
        const cMap = Object.fromEntries(cRows.map(r => [r.key.replace('commitment_', ''), r.value?.text ? r.value : null]));

        const days = [];
        for (let i = 0; i < 90; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          d.setHours(0, 0, 0, 0);
          const key = d.toISOString().split("T")[0];
          const jRow = jMap[key];
          const mRow = mMap[key];
          const aRow = aMap[key];
          const journal = jRow ? { text: jRow.body, note: nMap[key] || '', prompt: jRow.prompt, savedAt: jRow.saved_at,
            dateDisplay: d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) } : null;
          let mood = null;
          if (mRow) {
            try { const p = JSON.parse(mRow.label); mood = Array.isArray(p) ? p : [{ emoji: mRow.emoji, label: mRow.label }]; }
            catch { mood = [{ emoji: mRow.emoji, label: mRow.label }]; }
          }
          const affirmation = aRow ? aRow.body : null;
          days.push({
            key, date: new Date(d),
            dayNum: d.getDate(),
            dayName: d.toLocaleDateString("en-US", { weekday: "short" }),
            monthName: d.toLocaleDateString("en-US", { month: "short" }),
            fullDate: d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }),
            mood, journal, affirmation,
            insight: iMap[key] || null,
            exercises: eMap[key] || [],
            happyHour: hMap[key] || '',
            mantraReflection: typeof rMap[key] === 'string' ? rMap[key] : '',
            commitment: cMap[key] || null,
            hasData: !!(mood || journal || affirmation),
          });
        }
        setHistoryDays(days); historyDaysRef.current = days;
        setHistoryLoaded(true);
        if (!skipInsight) generateInsight(days);
        return days;
      }

      async function addInsecurity() {
