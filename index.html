    // ─── Happy Hour options ─────────────────────────────────────────────
    // Happy Hour is a multi-select built from what the user has written
    // before. Each saved entry is split on commas/periods into phrases and
    // tallied. From ~7 distinct phrases on, ONE AI pass looks at the whole
    // history at once (each phrase with the full entry it came from) and
    // returns the option set: near-synonyms merged under one label ("Rest" /
    // "Take it easy"), fragments that aren't activities on their own dropped
    // ("Do it anyway"). Cached in settings:happy_hour_groups as
    // { fp, map: phraseKey → label | null (skip) } and only re-run when the
    // set of phrases changes. Never more than 10 options, most-used first.
    // Selections + the write-in are saved as one comma-joined string in the
    // same settings:happy_hour_{date} row as before.
    const HH_CONSOLIDATE_AT = 7, HH_MAX_OPTIONS = 10, HH_MAX_CHARS = 40, HH_GROUP_MAX = 80;
    function splitHappyHour(text) {
      return String(text || '').split(/[,.;\n]+/).map(p => p.replace(/\s+/g, ' ').trim()).filter(p => p.length > 1);
    }
    const hhKey = (p) => String(p).toLowerCase().replace(/[^a-z0-9\s']/g, '').replace(/\s+/g, ' ').trim();
    function tallyHappyHour(texts) {
      const tally = {}; // key → { count, labels: { originalText: count }, entry: a full entry it came from }
      texts.forEach(t => splitHappyHour(t).forEach(p => {
        const k = hhKey(p); if (!k) return;
        const e = tally[k] || (tally[k] = { count: 0, labels: {}, entry: String(t).replace(/\s+/g, ' ').trim().slice(0, 140) });
        e.count++; e.labels[p] = (e.labels[p] || 0) + 1;
      }));
      return tally;
    }
    const hhDisplay = (labels) => {
      const best = Object.entries(labels).sort((a, b) => b[1] - a[1])[0][0];
      return best.charAt(0).toUpperCase() + best.slice(1);
    };
    function buildHappyHourOptions(tally, map = {}) {
      const groups = {};
      Object.entries(tally).forEach(([k, e]) => {
        const label = k in map ? map[k] : hhDisplay(e.labels);
        if (!label) return;                      // AI marked it as a fragment / not an activity
        if (label.length > HH_MAX_CHARS) return; // long old sentences never become chips
        const gk = hhKey(label);
        const g = groups[gk] || (groups[gk] = { label, count: 0 });
        g.count += e.count;
      });
      return Object.values(groups).sort((a, b) => b.count - a.count).slice(0, HH_MAX_OPTIONS).map(g => g.label);
    }
    const hhHash = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
    async function loadHappyHourOptions() {
      const [rows, cache] = await Promise.all([
        sbList('settings', 'key,value', `key=gte.happy_hour_&key=lt.happy_hour_z`),
        storageGet('settings:happy_hour_groups'),
      ]);
      const texts = rows.map(r => r.value).filter(v => typeof v === 'string');
      const tally = tallyHappyHour(texts);
      const keys = Object.keys(tally).sort((a, b) => tally[b].count - tally[a].count);
      const consolidate = keys.length >= HH_CONSOLIDATE_AT;
      const topKeys = keys.slice(0, HH_GROUP_MAX);
      const fp = hhHash([...topKeys].sort().join('|'));
      const map = consolidate && cache && cache.map ? cache.map : {};
      const options = buildHappyHourOptions(tally, map);
      // Regroup the whole history (in the background) whenever the set of
      // phrases has changed since the last grouping.
      const refresh = async () => {
        if (!consolidate || (cache && cache.fp === fp)) return null;
        const previous = [...new Set(Object.values(map).filter(Boolean))].slice(0, 20);
        const raw = await callClaude('happy_hour_groups', {
          items: topKeys.map(k => ({ text: hhDisplay(tally[k].labels), count: tally[k].count, entry: tally[k].entry })),
          previous,
        });
        if (!raw) return null;
        const nextMap = {};
        let parsed = 0;
        raw.split('\n').forEach(line => {
          const m = line.match(/^\s*(.+?)\s*:\s*([\d,\s]*)$/);
          if (!m) return;
          const label = m[1].replace(/^[-*•\s"']+|["']+$/g, '').trim().slice(0, 30);
          const idxs = (m[2].match(/\d+/g) || []).map(Number).filter(i => topKeys[i]);
          if (!label || !idxs.length) return;
          const skip = /^skip$/i.test(label);
          idxs.forEach(i => { nextMap[topKeys[i]] = skip ? null : label; parsed++; });
        });
        if (!parsed) return null;
        await storageSet('settings:happy_hour_groups', { fp, map: nextMap });
        return buildHappyHourOptions(tally, nextMap);
      };
      return { options, map, refresh };
    }

    // ─── Mantras: personal set + daily run-through ───────────────────────
    // The last check-in step. You pick one of your own ~10 mantras from a
    // swipeable card deck (same deck as "Your favorite mantras"); the card
    // grows to fill the screen, the mantra scrolls past 5× like lyrics with
    // the words lighting up at a steady pace, then the screen shrinks back
    // into a mantra card with a one-line echo of today's "What's behind it"
    // + Journal. Figma: "Mantras" page. Playground: mantras-playground.html.
    const MANTRA_SET_MAX = 12;
    const MANTRA_GROW_MS = 650;
    const MANTRA_EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
    const MANTRA_WORD_MS = 480; // "Calm" pace
    const MANTRA_REPS = 5;
    const MANTRA_DEEP = "#485942"; // second card in the stack (Figma)
    const normMantra = (t) => String(t || '').trim().toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ');

    // Seed the personal set the first time: hearted mantras first, then
    // recent ones, then the built-in pool (skipping disliked). Capped at 10.
    function seedMantraSet(ratings, rows) {
      const out = [], seen = new Set();
      const add = (text, idx) => {
        const k = normMantra(text);
        if (!text || !k || seen.has(k) || out.length >= 10) return;
        seen.add(k); out.push({ idx, text: String(text).trim() });
      };
      const byIdx = {};
      [...(rows || [])].sort((a, b) => String(b.date_key).localeCompare(String(a.date_key)))
        .forEach(r => { if (r.idx != null && r.body && !byIdx[r.idx]) byIdx[r.idx] = r.body; });
      (ratings?.liked || []).forEach(i => add(i < 10000 ? AFFIRMATIONS[i] : byIdx[i], i));
      const disliked = new Set(ratings?.disliked || []);
      AFFIRMATIONS.forEach((t, i) => { if (!disliked.has(i)) add(t, i); });
      return out;
    }

    // Each character gets a light-up time. Words get equal-ish time (a touch
    // more for longer words) plus a short beat after punctuation.
    function mantraTimeline(text, wordMs) {
      const chars = [...text], times = new Array(chars.length).fill(0), wordStarts = [];
      let t = 0, i = 0;
      while (i < chars.length) {
        if (chars[i] === " ") { times[i] = t; i++; continue; }
        let j = i; while (j < chars.length && chars[j] !== " ") j++;
        const word = chars.slice(i, j).join("");
        const dur = wordMs * (0.75 + 0.05 * (word.replace(/[^\w']/g, "").length || 1));
        wordStarts.push(t);
        for (let k = i; k < j; k++) times[k] = t + dur * ((k - i) / (j - i));
        t += dur;
        if (/[,.;:!?—]$/.test(word)) t += wordMs * 0.6;
        i = j;
      }
      return { times, wordStarts, total: t };
    }
    const MANTRA_NUM = ["", "one", "two", "three", "four", "five", "six"];
    const mantraRepLabel = (r, reps) => r === 0 ? "Today’s mantra" : (reps - r === 1 ? "One more time" : `${MANTRA_NUM[reps - r]} more times`);

    function useRafClock(running) {
      const { useState: useS, useEffect: useE, useRef: useR } = React;
      const [now, setNow] = useS(0);
      const acc = useR(0), last = useR(null);
      useE(() => {
        if (!running) { last.current = null; return; }
        let raf;
        const tick = (t) => { if (last.current != null) acc.current += t - last.current; last.current = t; setNow(acc.current); raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [running]);
      return now;
    }

    const mantraLabelStyle = (color) => ({ fontFamily: "'DM Mono', monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color });
    function MantraText({ text, size = 30, color = "#fff", style }) {
      return (
        <p style={{ fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontWeight: 400, fontSize: size, lineHeight: (size <= 20 ? 32 : 42) + "px",
          color, width: size <= 20 ? 290 : 300, maxWidth: "calc(100vw - 72px)", textAlign: "center", textWrap: "balance", margin: 0, ...style }}>{text}</p>
      );
    }
    function MantraPill({ children, onClick, style }) {
      return (
        <button onClick={onClick} style={{ background: "none", border: `1px solid ${sage}`, borderRadius: 14, height: 28, padding: "0 24px",
          fontFamily: "'DM Mono', monospace", fontSize: 11, letterSpacing: "0.04em", color: cream, cursor: "pointer", ...style }}>{children}</button>
      );
    }
    // Label / practiced count — shared by the deck card and the growing
    // card so they fade out in exactly the same spots.
    function MantraCardChrome({ label, labelColor, practiced, height }) {
      return (
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height, pointerEvents: "none" }}>
          <div style={{ position: "absolute", top: 36, left: 0, right: 0, textAlign: "center", ...mantraLabelStyle(labelColor) }}>{label}</div>
          <div style={{ position: "absolute", bottom: 50, left: 0, right: 0, textAlign: "center", fontFamily: "'DM Mono', monospace", fontSize: 10, color: shale }}>
            Practiced {practiced} time{practiced === 1 ? "" : "s"}
          </div>
        </div>
      );
    }
    const mantraTextCenter = (h) => (60 + (h - 120)) / 2; // centre of the text area inside a deck card

    // Swipeable stack — same geometry/easing as the favorites deck, with the
    // back cards peeking out below (Figma: Mantras – 1 Pick).
    function MantraDeck({ items, index, setIndex, height, frontRef, cardInfo, goRef, onTouched, locked }) {
      const { useState: useS, useEffect: useE, useRef: useR } = React;
      const n = items.length;
      const at = (i) => items[((i % n) + n) % n];
      const [dx, setDx] = useS(0);
      const [phase, setPhase] = useS("idle"); // idle | dragging | exiting
      const [dir, setDir] = useS(0);           // -1 = next, +1 = previous
      const startX = useR(0);
      const EXIT = 420, MS = 420;
      const exit = (d) => { if (phase === "exiting" || n < 2) return; onTouched && onTouched(); setDir(d); setPhase("exiting"); };
      useE(() => {
        if (phase !== "exiting") return;
        const t = setTimeout(() => { setIndex(i => i - dir); setDx(0); setDir(0); setPhase("idle"); }, MS);
        return () => clearTimeout(t);
      }, [phase]);
      if (goRef) goRef.current = (d) => { if (phase === "idle" && !locked) exit(d); };

      const down = (e) => { if (phase !== "idle" || locked || n < 2) return; startX.current = e.clientX; setPhase("dragging"); e.currentTarget.setPointerCapture?.(e.pointerId); };
      const move = (e) => { if (phase === "dragging") setDx(e.clientX - startX.current); };
      const up = () => { if (phase !== "dragging") return; if (dx < -70) exit(-1); else if (dx > 70) exit(1); else { setDx(0); setPhase("idle"); } };

      const roleOf = (k) => phase === "exiting" ? (dir === -1 ? k - 1 : k + 1) : k;
      const look = (r, isFront) => {
        if (r < 0)   return { t: `translateX(${-EXIT}px) rotate(-14deg)`, o: 0, bg: ink, dim: 1 };
        if (r === 0) return { t: isFront && phase === "dragging" ? `translateX(${dx}px) rotate(${dx / 26}deg)` : "none", o: 1, bg: ink, dim: 1 };
        if (r === 1) return { t: "translateY(9px) scale(0.94)", o: 1, bg: MANTRA_DEEP, dim: 0.55 };
        if (r === 2) return { t: "translateY(18px) scale(0.87)", o: 1, bg: sage, dim: 0.28 };
        return { t: "translateY(18px) scale(0.87)", o: 0, bg: sage, dim: 0 };
      };
      const ks = n >= 5 ? [-1, 0, 1, 2, 3] : n >= 3 ? [0, 1, 2] : n === 2 ? [0, 1] : [0];

      return (
        <div data-no-swipe-back style={{ position: "relative", height, marginBottom: 18 }}>
          {ks.map(k => {
            const m = at(index + k);
            const r = roleOf(k);
            const front = k === 0 && phase !== "exiting";
            const L = look(r, k === 0);
            const info = cardInfo(m);
            return (
              <div key={m.idx + ":" + m.text} ref={k === 0 ? frontRef : undefined}
                onPointerDown={front ? down : undefined} onPointerMove={front ? move : undefined}
                onPointerUp={front ? up : undefined} onPointerCancel={front ? up : undefined}
                style={{ position: "absolute", inset: 0, borderRadius: 16, background: L.bg, opacity: L.o, transform: L.t,
                  transformOrigin: "50% 100%", zIndex: r < 0 ? 5 : 4 - r, overflow: "hidden", touchAction: "pan-y", userSelect: "none", WebkitUserSelect: "none",
                  cursor: front ? "grab" : "default", pointerEvents: front ? "auto" : "none",
                  transition: k === 0 && phase === "dragging" ? "none" : `transform .42s ${MANTRA_EASE}, opacity .42s ${MANTRA_EASE}, background .42s ${MANTRA_EASE}` }}>
                <div style={{ opacity: L.dim, transition: `opacity .42s ${MANTRA_EASE}` }}>
                  <MantraCardChrome label={info.label} labelColor={info.labelColor} practiced={info.practiced} height={height} />
                  <div data-mantra-text style={{ position: "absolute", top: 76, left: 26, right: 26, bottom: 80, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <MantraText text={m.text} size={20} style={{ width: "100%", maxWidth: "none" }} />
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // Height of an element, kept up to date (wraps, font load, resizes).
    function useElementHeight(fallback) {
      const [el, setEl] = React.useState(null);
      const [h, setH] = React.useState(fallback);
      React.useEffect(() => {
        if (!el) return;
        const upd = () => { if (el.offsetHeight) setH(el.offsetHeight); };
        upd();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(upd);
        if (!window.ResizeObserver) return;
        const ro = new ResizeObserver(upd); ro.observe(el);
        return () => ro.disconnect();
      }, [el]);
      return [setEl, h];
    }
    const MANTRA_LINE_GAP = 28;   // space between the repeated mantras in the run-through
    const MANTRA_LABEL_GAP = 43;  // label top → top of the mantra text

    // The scrolling "lyrics" — 5 passes, the active one lights up letter by
    // letter. Tap to pause.
    function MantraRun({ text, reps, wordMs, centerY, textH = 84, vpH = 844, onFinish }) {
      const { useState: useS, useEffect: useE, useMemo: useM } = React;
      const tl = useM(() => mantraTimeline(text, wordMs), [text, wordMs]);
      const LEAD = 450, GAP = 550, repDur = tl.total + GAP;
      const [paused, setPaused] = useS(false);
      const [finishing, setFinishing] = useS(false);
      const e = useRafClock(!paused && !finishing);
      const end = LEAD + reps * repDur - GAP + 250;
      useE(() => { if (!finishing && e >= end) { setFinishing(true); setTimeout(onFinish, 650); } }, [e]);

      const cur = Math.max(0, Math.min(reps - 1, Math.floor((e - LEAD) / repDur)));
      const local = e - LEAD - cur * repDur;
      const wordIdx = tl.wordStarts.filter(s0 => s0 <= local).length;
      const chars = [...text];
      const OP = { "-2": 0.1, "-1": 0.1, "0": 1, "1": 0.5, "2": 0.25 };
      return (
        <div style={{ position: "absolute", inset: 0 }} onClick={() => !finishing && setPaused(p => !p)}>
          <div key={cur} style={{ position: "absolute", top: `calc(${centerY} - ${Math.round(textH / 2 + MANTRA_LABEL_GAP)}px)`, left: 0, right: 0, textAlign: "center", ...mantraLabelStyle(tangerine),
            animation: "fadeIn .4s ease", opacity: finishing ? 0 : 1, transition: "opacity .4s" }}>{mantraRepLabel(cur, reps)}</div>
          {Array.from({ length: reps }).map((_, i) => {
            const d = i - cur;
            // Lines above the active one also clear the label; lines below
            // only show if they'd stay clear of the circle at the bottom.
            const step = textH + MANTRA_LINE_GAP;
            const offset = d * step - (d < 0 ? MANTRA_LABEL_GAP : 0);
            const bottomPx = vpH * 0.423 + offset + textH / 2;
            const fits = d <= 0 || bottomPx < vpH - 125 - 20;
            const op = finishing ? (d === 0 ? 1 : 0) : (fits ? (OP[d] ?? 0) : 0);
            return (
              <div key={i} style={{ position: "absolute", top: centerY, left: 0, right: 0, display: "flex", justifyContent: "center",
                transform: `translateY(calc(-50% + ${offset}px))`, opacity: op, transition: `transform .6s ${MANTRA_EASE}, opacity .6s ${MANTRA_EASE}` }}>
                <MantraText color={sage} text={d !== 0 ? text : chars.map((c, ci) => (
                  <span key={ci} style={{ color: finishing ? "#fff" : (tl.times[ci] <= local ? cream : sage), transition: "color .14s linear" }}>{c}</span>
                ))} />
              </div>
            );
          })}
          <div style={{ position: "absolute", bottom: "calc(55px + env(safe-area-inset-bottom))", left: "50%", marginLeft: -35, width: 70, height: 70, opacity: finishing ? 0 : 1, transition: "opacity .4s" }}>
            <div key={cur + "-" + wordIdx} style={{ width: 70, height: 70, borderRadius: 35, background: rust, boxShadow: "0 0 40px rgba(196,120,58,0.35)", animation: "mantraTick .32s ease" }} />
          </div>
          {paused && (
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(44,59,42,0.65)", animation: "fadeIn .2s" }}>
              <div style={mantraLabelStyle(sage)}>Paused · tap to resume</div>
            </div>
          )}
        </div>
      );
    }

    // The whole Mantra step. pick → growing → intro → run → reveal →
    // shrinking → done → (Continue = save the check-in). "Practice again"
    // on the done card grows it again; ← back on the intro shrinks back.
    function MantraStepView({ items, practicedFor, initial, suggestion, isToday, topBar, dotsEl, stepLabel, saving, onComplete, onEditSet, requestLine }) {
      const { useState: useS, useEffect: useE, useRef: useR, useMemo: useM } = React;
      const [phase, setPhase] = useS("pick");
      const [index, setIndex] = useS(0);
      const [chosen, setChosen] = useS(null);
      const [origin, setOrigin] = useS("pick");
      const [ov, setOv] = useS(null);          // { rect, anim, chrome }
      const [fl, setFl] = useS(null);          // floating mantra: { y, size, anim }
      const [runKey, setRunKey] = useS(0);
      const [measureRef, textH] = useElementHeight(84); // height of the chosen mantra at 30px
      const [line, setLine] = useS("");
      const lineReqRef = useR(0);
      const [vp, setVp] = useS({ w: window.innerWidth, h: window.innerHeight });
      const frontRef = useR(null), doneCardRef = useR(null), goRef = useR(null), touchedRef = useR(false);
      const timers = useR([]);
      const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
      useE(() => () => timers.current.forEach(clearTimeout), []);
      useE(() => {
        // Close the keyboard if it's still up from the previous step.
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        const r = () => setVp({ w: window.innerWidth, h: window.innerHeight });
        window.addEventListener("resize", r);
        window.visualViewport && window.visualViewport.addEventListener("resize", r);
        const t = setTimeout(r, 400);
        return () => { clearTimeout(t); window.removeEventListener("resize", r); window.visualViewport && window.visualViewport.removeEventListener("resize", r); };
      }, []);
      const fullScreen = ["growing", "intro", "run", "reveal", "shrinking", "closing"].includes(phase);
      useE(() => {
        if (!fullScreen) return;
        const prev = document.body.style.overflow; document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = prev; };
      }, [fullScreen]);

      // Deck order: the day's existing mantra (when editing) or today's
      // suggestion goes first. Frozen once the user starts swiping so a
      // late-arriving suggestion never reshuffles under their finger.
      const [frozen, setFrozen] = useS(null);
      const deck = useM(() => {
        if (frozen) return frozen;
        const list = [...items];
        let firstKind = null;
        if (initial && initial.text) {
          const i = list.findIndex(m => normMantra(m.text) === normMantra(initial.text));
          const m = i >= 0 ? list.splice(i, 1)[0] : { idx: initial.idx ?? 0, text: initial.text };
          list.unshift(m); firstKind = "initial";
        } else if (suggestion && suggestion.pick != null && list[suggestion.pick]) {
          const m = list.splice(suggestion.pick, 1)[0];
          list.unshift(m); firstKind = "suggested";
        }
        return { list, firstKind, first: list[0] };
      }, [items, initial && initial.text, suggestion && suggestion.pick, frozen]);
      const freeze = () => { if (!touchedRef.current) { touchedRef.current = true; setFrozen(deck); } };
      const cardInfo = (m) => {
        const isFirst = deck.first && m === deck.first;
        if (isFirst && deck.firstKind === "suggested") return { label: "Suggested for today", labelColor: cream, practiced: practicedFor(m.text) };
        if (isFirst && deck.firstKind === "initial") return { label: isToday ? "Today’s mantra" : "Your mantra", labelColor: cream, practiced: practicedFor(m.text) };
        return { label: "Mantra", labelColor: sage, practiced: practicedFor(m.text) };
      };
      const current = deck.list.length ? deck.list[((index % deck.list.length) + deck.list.length) % deck.list.length] : null;

      const deckH = Math.max(300, Math.min(436, vp.h - 408));
      // Full screen = the fixed layer itself (100%), never a measured size —
      // on iPhone the measured height can come back short (e.g. keyboard
      // still up from the Happy Hour write-in).
      const centerY = "42.3%";
      const FULL = { top: 0, left: 0, width: "100%", height: "100%", r: 0 };
      const rectOf = (el, r = 16) => { const b = el.getBoundingClientRect(); return { top: b.top, left: b.left, width: b.width, height: b.height, r }; };
      const nextFrame = (fn) => requestAnimationFrame(() => requestAnimationFrame(fn));
      // Vertical centre of the front deck card's mantra text (it's top-anchored now).
      const deckTextY = (rect) => {
        const p = frontRef.current && frontRef.current.querySelector("[data-mantra-text] p");
        if (!p) return rect.top + 76 + 32;
        const b = p.getBoundingClientRect();
        return b.top + b.height / 2;
      };

      function morph(fromRect, toRect, from, to, chrome, after) {
        setOv({ rect: fromRect, anim: false, chrome }); setFl({ ...from, anim: false });
        nextFrame(() => { setOv(o => o && ({ ...o, rect: toRect, anim: true })); setFl({ ...to, anim: true }); });
        later(after, MANTRA_GROW_MS + 30);
      }
      function growFromPick() {
        if (!current || !frontRef.current) return;
        freeze();
        const rect = rectOf(frontRef.current);
        setChosen(current); setOrigin("pick"); setPhase("growing");
        setLine("");
        const req = ++lineReqRef.current;
        requestLine && requestLine(current.text).then(l => { if (lineReqRef.current === req) setLine(l || ""); }).catch(() => {});
        morph(rect, FULL, { y: deckTextY(rect), size: 20 }, { y: centerY, size: 30 },
          { from: "pick", fade: "out", info: cardInfo(current), h: rect.height }, () => setPhase("intro"));
      }
      function growFromDone() {
        if (!doneCardRef.current) return;
        const rect = rectOf(doneCardRef.current);
        setOrigin("done"); setPhase("growing");
        morph(rect, FULL, { y: rect.top + 82, size: 20 }, { y: centerY, size: 30 }, { from: "done", fade: "out" }, () => setPhase("intro"));
      }
      function closeIntro() {
        const back = origin === "done" ? "done" : "pick";
        setPhase(back === "done" ? "shrinking" : "closing");
        nextFrame(() => {
          const el = back === "done" ? doneCardRef.current : frontRef.current;
          if (!el) { setOv(null); setFl(null); setPhase(back); return; }
          const rect = rectOf(el);
          morph(FULL, rect, { y: centerY, size: 30 },
            back === "done" ? { y: rect.top + 82, size: 20 } : { y: deckTextY(rect), size: 20 },
            back === "pick" ? { from: "pick", fade: "in", info: cardInfo(chosen), h: rect.height } : null,
            () => { setOv(null); setFl(null); setPhase(back); });
        });
      }
      function begin() { setFl(null); setRunKey(k => k + 1); setPhase("run"); }
      function finishRun() { setFl({ y: centerY, size: 30, anim: false }); setPhase("reveal"); }
      function complete() {
        setPhase("shrinking");
        nextFrame(() => {
          if (!doneCardRef.current) { setOv(null); setFl(null); setPhase("done"); return; }
          const rect = rectOf(doneCardRef.current);
          morph(FULL, rect, { y: centerY, size: 30 }, { y: rect.top + 82, size: 20 }, null, () => { setOv(null); setFl(null); setPhase("done"); });
        });
      }

      const btnStyle = (light) => ({ position: "absolute", left: "50%", transform: "translateX(-50%)", width: "min(312px, calc(100vw - 78px))", height: 52,
        bottom: "calc(70px + env(safe-area-inset-bottom))", borderRadius: 14, border: "none", background: light ? cream : ink, color: light ? ink : cream,
        fontFamily: "'DM Mono', monospace", fontSize: 13, letterSpacing: "0.05em", cursor: "pointer" });
      const showPick = phase === "pick" || phase === "closing" || (phase === "growing" && origin === "pick");
      const showDone = phase === "shrinking" || phase === "done" || (phase === "growing" && origin === "done");

      const overlay = (ov || fl || ["intro", "run", "reveal"].includes(phase)) && ReactDOM.createPortal(
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, width: "100%", height: "100%", zIndex: 1000, pointerEvents: ["intro", "run", "reveal"].includes(phase) ? "auto" : "none" }}>
          <style>{`@keyframes mantraTick { 0% { transform: scale(1); } 35% { transform: scale(1.09); } 100% { transform: scale(1); } }
            @keyframes mantraFadeOut { from { opacity: 1; } to { opacity: 0; } }
            @keyframes mantraFadeIn { from { opacity: 0; } to { opacity: 1; } }`}</style>
          {(ov || ["intro", "run", "reveal"].includes(phase)) && (() => {
            const r = ov ? ov.rect : FULL;
            return (
              <div style={{ position: "absolute", top: r.top, left: r.left, width: r.width, height: r.height, borderRadius: r.r, background: ink, overflow: "hidden",
                transition: ov && ov.anim ? ["top", "left", "width", "height", "border-radius"].map(p => `${p} ${MANTRA_GROW_MS}ms ${MANTRA_EASE}`).join(", ") : "none" }}>
                {ov && ov.chrome && ov.chrome.from === "pick" && (
                  <div style={{ position: "absolute", top: 0, left: 0, width: r.width, animation: ov.chrome.fade === "out" ? "mantraFadeOut .22s ease forwards" : `mantraFadeIn .25s ease ${MANTRA_GROW_MS - 220}ms both` }}>
                    <MantraCardChrome label={ov.chrome.info.label} labelColor={ov.chrome.info.labelColor} practiced={ov.chrome.info.practiced} height={ov.chrome.h} />
                  </div>
                )}
                {ov && ov.chrome && ov.chrome.from === "done" && (
                  <div style={{ position: "absolute", top: 160, left: 0, width: doneCardRef.current ? doneCardRef.current.offsetWidth : r.width, display: "flex", justifyContent: "center", animation: "mantraFadeOut .22s ease forwards" }}>
                    <MantraPill>PRACTICE AGAIN</MantraPill>
                  </div>
                )}
              </div>
            );
          })()}
          {chosen && (
            <div aria-hidden="true" style={{ position: "absolute", top: 0, left: 0, right: 0, display: "flex", justifyContent: "center", visibility: "hidden", pointerEvents: "none" }}>
              <div ref={measureRef}><MantraText text={chosen.text} size={30} /></div>
            </div>
          )}
          {fl && (
            <div style={{ position: "absolute", top: fl.y, left: 0, right: 0, display: "flex", justifyContent: "center", transform: "translateY(-50%)", pointerEvents: "none",
              transition: fl.anim ? `top ${MANTRA_GROW_MS}ms ${MANTRA_EASE}` : "none" }}>
              <MantraText text={chosen ? chosen.text : ""} size={fl.size}
                style={{ transition: fl.anim ? `font-size ${MANTRA_GROW_MS}ms ${MANTRA_EASE}, line-height ${MANTRA_GROW_MS}ms ${MANTRA_EASE}` : "none" }} />
            </div>
          )}
          {phase === "intro" && (
            <div style={{ position: "absolute", inset: 0, animation: "mantraFadeIn .45s ease both" }}>
              <button onClick={closeIntro} style={{ position: "absolute", top: "calc(env(safe-area-inset-top) + 20px)", left: 24, background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11, color: sage, letterSpacing: "0.05em", cursor: "pointer", padding: 0 }}>← back</button>
              <div style={{ position: "absolute", top: `calc(${centerY} - ${Math.round(textH / 2 + MANTRA_LABEL_GAP)}px)`, left: 0, right: 0, textAlign: "center", ...mantraLabelStyle(tangerine) }}>Today’s mantra</div>
              <p style={{ position: "absolute", left: "50%", transform: "translateX(-50%)", width: 280, bottom: "calc(160px + env(safe-area-inset-bottom))", fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontSize: 16, lineHeight: "22px", color: "#fff", textAlign: "center", margin: 0 }}>
                Read along as the words light up — out loud if you can. Five times through.
              </p>
              <button onClick={begin} style={btnStyle(true)}>Begin</button>
            </div>
          )}
          {phase === "run" && chosen && <MantraRun key={runKey} text={chosen.text} reps={MANTRA_REPS} wordMs={MANTRA_WORD_MS} centerY={centerY} textH={textH} vpH={vp.h} onFinish={finishRun} />}
          {phase === "reveal" && (
            <div style={{ position: "absolute", inset: 0, animation: "mantraFadeIn .5s ease both" }}>
              <div style={{ position: "absolute", top: `calc(${centerY} - ${Math.round(textH / 2 + MANTRA_LABEL_GAP)}px)`, left: 0, right: 0, textAlign: "center", ...mantraLabelStyle(tangerine) }}>Great job ✓</div>
              <button onClick={complete} style={btnStyle(true)}>Complete</button>
            </div>
          )}
          {phase === "shrinking" && (
            <div style={{ position: "absolute", top: `calc(${centerY} - ${Math.round(textH / 2 + MANTRA_LABEL_GAP)}px)`, left: 0, right: 0, textAlign: "center", ...mantraLabelStyle(tangerine), animation: "mantraFadeOut .2s ease forwards" }}>Great job ✓</div>
          )}
        </div>,
        document.body
      );

      // ── Pick ──
      if (showPick) return (
        <>
          <div style={{ display: "flex", flexDirection: "column", boxSizing: "border-box", minHeight: "calc(100dvh - env(safe-area-inset-top) - 20px)", paddingBottom: 28, marginBottom: "calc(-60px - env(safe-area-inset-bottom))",
            opacity: phase === "growing" ? 0 : 1, transition: "opacity .28s ease" }}>
            {topBar}
            {stepLabel("Choose a mantra")}
            {deck.list.length > 0 ? (
              <MantraDeck items={deck.list} index={index} setIndex={setIndex} height={deckH} frontRef={frontRef} cardInfo={cardInfo}
                goRef={goRef} onTouched={freeze} locked={phase !== "pick"} />
            ) : (
              <p style={{ fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontSize: 16, color: moss, textAlign: "center", margin: "60px 0" }}>Add a few mantras to get started.</p>
            )}
            {deck.list.length > 1 && (
              <div style={{ display: "flex", justifyContent: "center", gap: 24, marginTop: 18 }}>
                {[["‹", 1], ["›", -1]].map(([g, d]) => (
                  <button key={g} onClick={() => goRef.current && goRef.current(d)} aria-label={d === 1 ? "Previous mantra" : "Next mantra"}
                    style={{ width: 48, height: 48, borderRadius: 24, border: `1px solid ${sand}`, background: cream, color: moss, fontFamily: "'DM Mono', monospace", fontSize: 16, cursor: "pointer" }}>{g}</button>
                ))}
              </div>
            )}
            <div style={{ flex: 1, minHeight: 28 }} />
            <button onClick={growFromPick} disabled={!current || phase !== "pick"}
              style={{ width: "100%", background: ink, color: cream, border: "none", borderRadius: 14, padding: "16px 0", fontFamily: "'DM Mono', monospace", fontSize: 13, letterSpacing: "0.05em", cursor: "pointer", opacity: current ? 1 : 0.4 }}>Begin</button>
            <div style={{ textAlign: "center", marginTop: 20 }}>
              <button onClick={onEditSet} style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 12, color: rust, cursor: "pointer" }}>Edit my mantras</button>
            </div>
          </div>
          {overlay}
        </>
      );

      // ── Done (back in the check-in) ──
      if (showDone) return (
        <>
          <div style={{ display: "flex", flexDirection: "column", boxSizing: "border-box", minHeight: "calc(100dvh - env(safe-area-inset-top) - 20px)", paddingBottom: 28, marginBottom: "calc(-60px - env(safe-area-inset-bottom))" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32, animation: "mantraFadeIn .5s ease .25s both" }}>
              <button style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: "0.05em", padding: 0, cursor: "pointer" }}
                onClick={() => { setPhase("pick"); }}>← back</button>
              {dotsEl}
            </div>
            <div style={{ animation: "mantraFadeIn .5s ease .25s both" }}>{stepLabel("Your mantra for today")}</div>
            <div ref={doneCardRef} style={{ position: "relative", height: 222, borderRadius: 16, background: phase === "done" ? ink : "transparent" }}>
              {phase === "done" && chosen && (
                <>
                  <div style={{ position: "absolute", top: 82, left: 0, right: 0, display: "flex", justifyContent: "center", transform: "translateY(-50%)" }}>
                    <MantraText text={chosen.text} size={20} />
                  </div>
                  <div style={{ position: "absolute", top: 160, left: 0, right: 0, display: "flex", justifyContent: "center", animation: "mantraFadeIn .35s ease both" }}>
                    <MantraPill onClick={growFromDone}>PRACTICE AGAIN</MantraPill>
                  </div>
                </>
              )}
            </div>
            {line && (
              <p style={{ fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontSize: 16, lineHeight: "22px", color: ink, textAlign: "center", textWrap: "balance", maxWidth: 280, margin: "54px auto 0", animation: "mantraFadeIn .5s ease .25s both" }}>{line}</p>
            )}
            <div style={{ flex: 1, minHeight: 28 }} />
            <button onClick={() => chosen && onComplete(chosen)} disabled={saving}
              style={{ width: "100%", background: ink, color: cream, border: "none", borderRadius: 14, padding: "16px 0", fontFamily: "'DM Mono', monospace", fontSize: 13, letterSpacing: "0.05em", cursor: saving ? "default" : "pointer", opacity: saving ? 0.4 : 1, animation: "mantraFadeIn .5s ease .25s both" }}>
              {saving ? "Saving..." : "Continue"}
            </button>
          </div>
          {overlay}
        </>
      );

      // ── Full-screen phases: only the overlay is visible ──
      return <div style={{ minHeight: "100dvh" }}>{overlay}</div>;
    }

    // ─── Edit the personal set ───────────────────────────────────────────
    function EditMantrasView({ items, practicedFor, onBack, onSave, onSuggest }) {
      const { useState: useS } = React;
      const [editing, setEditing] = useS(null);
      const [draft, setDraft] = useS("");
      const [adding, setAdding] = useS("");
      const [suggested, setSuggested] = useS(null); // null | "loading" | text | ""
      const newIdx = () => 20000 + (Date.now() % 100000000);
      const add = (text) => {
        const t = String(text || "").trim();
        if (!t || items.length >= MANTRA_SET_MAX || items.some(m => normMantra(m.text) === normMantra(t))) return false;
        onSave([...items, { idx: newIdx(), text: t }]); return true;
      };
      const saveEdit = () => {
        const t = draft.trim();
        if (t) onSave(items.map(m => m.idx === editing ? { ...m, text: t } : m));
        setEditing(null);
      };
      async function suggest() {
        setSuggested("loading");
        const t = await onSuggest();
        setSuggested(t || "");
      }
      const mono = "'DM Mono', monospace", serif = "'Lora', Georgia, serif";
      return (
        <Shell key="edit-mantras">
          <button style={s.backBtn} onClick={onBack}>← back</button>
          <h2 style={{ fontFamily: serif, fontStyle: "italic", fontWeight: 400, fontSize: 28, color: ink, margin: "0 0 8px" }}>Your mantras</h2>
          <p style={{ fontFamily: serif, fontStyle: "italic", fontSize: 13, color: moss, lineHeight: 1.5, margin: "0 0 24px" }}>Keep it to about ten — the ones that actually land. Short is easier to carry.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {items.map(m => (
              <div key={m.idx + ":" + m.text} style={{ background: bone, borderRadius: 14, padding: "14px 16px" }}>
                {editing === m.idx ? (
                  <div>
                    <input autoFocus value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === "Enter" && saveEdit()}
                      style={{ width: "100%", background: "transparent", border: "none", outline: "none", fontFamily: serif, fontStyle: "italic", fontSize: 16, color: ink, padding: 0 }} />
                    <div style={{ display: "flex", justifyContent: "flex-end", gap: 16, marginTop: 10 }}>
                      <button onClick={() => setEditing(null)} style={{ background: "none", border: "none", fontFamily: mono, fontSize: 11, color: moss, cursor: "pointer" }}>cancel</button>
                      <button onClick={saveEdit} style={{ background: "none", border: "none", fontFamily: mono, fontSize: 11, color: rust, cursor: "pointer" }}>save</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ flex: 1, fontFamily: serif, fontStyle: "italic", fontSize: 16, lineHeight: 1.5, color: ink }}>{m.text}</span>
                    <span style={{ fontFamily: mono, fontSize: 9, color: moss, whiteSpace: "nowrap" }}>{practicedFor(m.text)}×</span>
                    <button onClick={() => { setEditing(m.idx); setDraft(m.text); }} style={{ background: "none", border: "none", fontFamily: mono, fontSize: 11, color: moss, cursor: "pointer", padding: 0 }}>edit</button>
                    <button onClick={() => onSave(items.filter(x => x !== m))} aria-label="Remove" style={{ background: "none", border: "none", fontFamily: mono, fontSize: 13, color: sage, cursor: "pointer", padding: 0 }}>✕</button>
                  </div>
                )}
              </div>
            ))}
          </div>
          {items.length < MANTRA_SET_MAX && (
            <div style={{ border: `1px dashed ${sage}`, borderRadius: 14, padding: "14px 16px", marginTop: 8, display: "flex", gap: 10, alignItems: "center" }}>
              <input value={adding} onChange={e => setAdding(e.target.value)} placeholder="Add a mantra…"
                onKeyDown={e => { if (e.key === "Enter" && add(adding)) setAdding(""); }}
                style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", fontFamily: serif, fontStyle: "italic", fontSize: 16, color: ink, padding: 0 }} />
              <button onClick={() => { if (add(adding)) setAdding(""); }} aria-label="Add" style={{ background: "none", border: "none", fontFamily: mono, fontSize: 18, color: moss, cursor: "pointer", padding: 0 }}>+</button>
            </div>
          )}
          <div style={{ fontFamily: mono, fontSize: 10, color: moss, textAlign: "right", marginTop: 10 }}>{items.length} / {MANTRA_SET_MAX}</div>
          <div style={{ marginTop: 28 }}>
            {suggested === null && (
              <button onClick={suggest} style={{ background: "none", border: "none", padding: 0, fontFamily: serif, fontStyle: "italic", fontSize: 13, color: rust, cursor: "pointer" }}>Not sure what to add? Suggest from my journals →</button>
            )}
            {suggested === "loading" && <p style={{ ...s.dimMono }}>Thinking…</p>}
            {typeof suggested === "string" && suggested !== "loading" && (
              suggested ? (
                <div style={{ background: ink, borderRadius: 14, padding: "18px 18px 14px" }}>
                  <p style={{ fontFamily: serif, fontStyle: "italic", fontSize: 17, lineHeight: 1.5, color: "#fff", margin: "0 0 12px" }}>{suggested}</p>
                  <div style={{ display: "flex", justifyContent: "flex-end", gap: 18 }}>
                    <button onClick={suggest} style={{ background: "none", border: "none", fontFamily: mono, fontSize: 11, color: sage, cursor: "pointer" }}>try another</button>
                    {items.length < MANTRA_SET_MAX && <button onClick={() => { if (add(suggested)) setSuggested(null); }} style={{ background: "none", border: "none", fontFamily: mono, fontSize: 11, color: tangerine, cursor: "pointer" }}>+ add</button>}
                  </div>
                </div>
              ) : <button onClick={suggest} style={{ background: "none", border: "none", padding: 0, fontFamily: mono, fontSize: 11, color: moss, cursor: "pointer" }}>Couldn't get a suggestion — try again</button>
            )}
          </div>
        </Shell>
      );
    }

    // A textarea that grows with its text (never scrolls inside itself);
    // `minHeight` in style is still the smallest it gets.
    function AutoGrowTextarea({ value, style, ...rest }) {
      const ref = React.useRef(null);
      const fit = () => {
        const el = ref.current; if (!el) return;
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      };
      React.useLayoutEffect(fit, [value]);
      React.useEffect(() => {
        window.addEventListener("resize", fit);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        return () => window.removeEventListener("resize", fit);
      }, []);
      return <textarea ref={ref} value={value} rows={1} {...rest} style={{ ...style, overflow: "hidden" }} />;
    }

    function DailyEntryView({ day, prompt, moodOrder, initialMoods, initialNote, initialJournal, initialHappyHour, onBack, onSaved, customPrompts = [], onSaveCustomPrompts, initialStep = 1, affirmation, ratings = {}, onRateAff, onDislikeAff, onRefreshAff, onChooseAff, ouraSync, onPullOura, mantraSet, mantraPracticedFor = () => 0, onSaveMantraSet, onSuggestMantra, onPickMantra }) {
      const { useState: useS, useEffect: useE } = React;
      const [step, setStep] = useS(initialStep);
      const [showAddMood, setShowAddMood] = useS(false);
      const [customMoods, setCustomMoods] = useS([]);
      const [showPromptPicker, setShowPromptPicker] = useS(false);
      const [showAddPrompt, setShowAddPrompt] = useS(false);
      const [showChooseAff, setShowChooseAff] = useS(false);
      const [showEditSet, setShowEditSet] = useS(false);
      const [storedDayAff, setStoredDayAff] = useS(null); // the mantra already saved for THIS day, if any
      // The affirmation actually associated with `day` — seeded from the
      // (today-only) `affirmation` prop, then overridden once we've fetched
      // the specific row stored for `day.key`. For today's own entry these
      // are the same value; for editing a past day this resolves to what
      // was really shown/written that day instead of today's affirmation.
      const [resolvedAff, setResolvedAff] = useS(affirmation);
      const [entryMoods, setEntryMoods] = useS(initialMoods || []);
      const [note, setNote] = useS(initialNote || "");
      const [journalText, setJournalText] = useS(initialJournal || "");
      const [happyHour, setHappyHour] = useS(initialHappyHour || ""); // legacy free-text (pre-fill only)
      const [hhOptions, setHhOptions] = useS(null);   // null while loading
      const [hhSelected, setHhSelected] = useS([]);   // chosen option labels
      const [hhCustom, setHhCustom] = useS("");       // 40-char write-in
      const hhTouchedRef = React.useRef(false);
      useE(() => {
        let cancelled = false;
        (async () => {
          const { options, map, refresh } = await loadHappyHourOptions();
          if (cancelled) return;
          // Pre-fill when editing a past day: items that match an option get
          // selected, anything else goes into the write-in.
          const applyInitial = (opts, m) => {
            const byKey = Object.fromEntries(opts.map(o => [hhKey(o), o]));
            const sel = [], rest = [];
            splitHappyHour(initialHappyHour).forEach(p => {
              const hit = byKey[hhKey(p)] || byKey[hhKey(m[hhKey(p)] || '')];
              if (hit) { if (!sel.includes(hit)) sel.push(hit); } else rest.push(p);
            });
            setHhSelected(sel); setHhCustom(rest.join(', '));
          };
          setHhOptions(options); applyInitial(options, map);
          const next = await refresh();
          if (cancelled || !next || hhTouchedRef.current) return;
          setHhOptions(next); applyInitial(next, {});
        })();
        return () => { cancelled = true; };
      }, [day.key]);
      const happyHourValue = [...hhSelected, hhCustom.trim()].filter(Boolean).join(', ');
      const [saving, setSaving] = useS(false);
      const [journalPrompt, setJournalPrompt] = useS(prompt || DAILY_PROMPTS[0]);
      const [happyPrompt] = useS("What's one nice thing you can do for yourself today?");

      // Oura health tile (Step 1) — ouraConnected: null while loading,
      // then true/false once we know. health: the most recent synced day's
      // row once we have one, or null if connected but nothing's synced
      // yet (e.g. ring was dead, hasn't uploaded to Oura's cloud yet).
      //
      // The actual pull is owned by App (see pullOura/ouraSync) so it can be
      // kicked off the moment "Make today count" is tapped, in the
      // background, rather than waiting for this view to mount. This just
      // reads whatever App has (or is about to have). If we got here without
      // a pull already in flight (e.g. editing a past day directly), ask App
      // to start one — onPullOura no-ops if one's already running.
      const [ouraConnected, setOuraConnected] = useS(null);
      const [health, setHealth] = useS(null);
      useE(() => {
        if (!ouraSync) { onPullOura && onPullOura(); return; }
        setOuraConnected(ouraSync.connected);
        setHealth(composeHealth(ouraSync.days, day.key));
      }, [ouraSync, day.key]);

      // Physical step exists in the flow whenever Oura is connected — with
      // or without a synced data row for today. When connected but no data
      // has synced yet, the step still shows, with a "not available today"
      // message instead of cards (see Step 2 render below). While still
      // loading (ouraConnected === null) we don't insert the step, so the
      // dot count/step order never flickers once it resolves.
      const hasPhysical = ouraConnected === true;
      // "What's behind these feelings?" now lives on Step 1 with the moods,
      // so the Physical step's AI read can use it.
      const TOTAL = hasPhysical ? 7 : 6;
      const journalStep = hasPhysical ? 3 : 2;
      const happyStep = hasPhysical ? 4 : 3;
      const affirmationStep = happyStep + 1;

      // Keep resolvedAff in sync with live prop changes (refresh / rate /
      // choose all flow back through the `affirmation` prop).
      useE(() => {
        setResolvedAff(affirmation);
      }, [affirmation?.idx, affirmation?.text]);

      // Resolve the affirmation actually stored for THIS day, and restore
      // any previously-written mantra reflection for this day — so
      // reopening "Edit entry" on a completed day doesn't reset either.
      // Falls back to blank/the live prop when nothing is stored yet
      // (brand-new entries, e.g. today before anything's been saved).
      useE(() => {
        let cancelled = false;
        setStoredDayAff(null);
        (async () => {
          const storedAff = await storageGet(`affirmation:${day.key}`);
          if (cancelled) return;
          if (storedAff && storedAff.text) { setResolvedAff(storedAff); setStoredDayAff(storedAff); }
        })();
        return () => { cancelled = true; };
      }, [day.key]);

      // Card metrics for the dedicated Physical step — same fields the old
      // inline tile read, re-banded with the 3-tier ink/moss/rust pill
      // palette from Figma (node 182:1420).
      const physicalMetrics = physicalMetricsFor(health);

      // AI-generated headline ("Go for it today" / "Take it easy" / etc.)
      // + narrative paragraph (explains the scores → translates to how the
      // user might feel → suggests what to do about it) for the Physical
      // step. Cached per health-data-day (settings:physical_{date}) so it's
      // generated once and reused for the rest of that day.
      const [physicalContent, setPhysicalContent] = useS(null);
      // Generated once the user moves past Step 1, so it can read their
      // moods + "what's behind it" note and (when it's obvious) separate
      // what's coming from their head vs. their body.
      const physicalReady = step >= 2;
      const moodLabelsForAI = entryMoods.map(m => m.label);
      const noteForAI = note.trim();
      const ctxHash = (() => { const str = moodLabelsForAI.join(',') + '|' + noteForAI; let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); })();
      useE(() => {
        if (!health || !physicalReady) return;
        let cancelled = false;
        setPhysicalContent(null);
        (async () => {
          const have = ['readiness_score', 'sleep_hours', 'active_calories'].map(k => health[k] != null ? 1 : 0).join('');
          const pills = {
            activity: activityBand(health.active_calories, health.steps)?.label || null,
            sleep: sleepBand(health.sleep_hours, health.sleep_efficiency)?.label || null,
            readiness: health.readiness_score != null ? readinessBand(health.readiness_score).label : null,
          };
          const cacheKey = `settings:physical_v4_${health.date}_${have}_${pills.activity}${pills.sleep}${pills.readiness}_${ctxHash}`;
          const cached = await storageGet(cacheKey);
          if (cached?.headline && cached?.summary) {
            if (!cancelled) setPhysicalContent(cached);
            return;
          }
          const raw = await callClaude('physical_state', {
            date: health.date,
            activeCalories: health.active_calories ?? null,
            steps: health.steps ?? null,
            sleepHours: health.sleep_hours ?? null,
            sleepEfficiency: health.sleep_efficiency ?? null,
            readinessScore: health.readiness_score ?? null,
            pills,
            moods: moodLabelsForAI,
            note: noteForAI,
          });
          if (!raw) return;
          const [headline, summary] = raw.split('|||').map(part => part.trim());
          if (!headline || !summary) return;
          const result = { headline, summary, generatedAt: new Date().toISOString() };
          if (!cancelled) setPhysicalContent(result);
          await storageSet(cacheKey, result);
        })();
        return () => { cancelled = true; };
      }, [health && health.date, physicalReady, ctxHash]);

      // Mantra step AI — once the Journal is behind them, one short call picks
      // which of their mantras fits today (goes first in the deck) and writes
      // the one-sentence echo of "What's behind it" + Journal shown under the
      // mantra card at the end. Nothing written → no line.
      const [mantraSuggestion, setMantraSuggestion] = useS(null);
      const mantraReady = step >= happyStep;
      const mantraCtx = (() => { const str = [(mantraSet || []).map(m => m.text).join('|'), entryMoods.map(m => m.label).join(','), note.trim(), journalText.trim()].join('§'); let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); })();
      useE(() => {
        if (!mantraReady || !mantraSet || !mantraSet.length) return;
        let cancelled = false;
        (async () => {
          const n = note.trim(), j = journalText.trim();
          const raw = await callClaude('mantra_today', { mantras: mantraSet.map(m => m.text), moods: entryMoods.map(m => m.label), note: n, journal: j });
          if (cancelled) return;
          const pm = /PICK:\s*(\d+)/i.exec(raw || '');
          const lm = /LINE:[ \t]*(.*)/i.exec(raw || '');
          let line = lm ? lm[1].trim().replace(/^["“']+|["”']+$/g, '').trim() : '';
          if (!n && !j) line = '';
          if (/^(blank|none|empty|n\/a|-|\(blank\)|<blank>)?$/i.test(line)) line = '';
          const pick = pm ? Number(pm[1]) : null;
          setMantraSuggestion({ pick: pick != null && pick >= 0 && pick < mantraSet.length ? pick : null, line });
        })();
        return () => { cancelled = true; };
      }, [mantraReady, mantraCtx]);

      // The line under the mantra card at the end — requested once they've
      // chosen a mantra (on Begin), so it can be framed through it. Cached
      // per mantra + what they wrote.
      const mantraLineCache = React.useRef({});
      async function requestMantraLine(mantraText) {
        const n = note.trim(), j = journalText.trim();
        if (!n && !j) return '';
        const key = [mantraText, n, j].join('§');
        if (key in mantraLineCache.current) return mantraLineCache.current[key];
        const raw = await callClaude('mantra_line', { mantra: mantraText, moods: entryMoods.map(m => m.label), note: n, journal: j });
        let line = String(raw || '').trim().split('\n')[0].replace(/^["“']+|["”']+$/g, '').trim();
        if (/^(none|blank|n\/a|-)?\.?$/i.test(line)) line = '';
        if (raw) mantraLineCache.current[key] = line;
        return line;
      }

      function toggleMood(mood) {
        setEntryMoods(prev => {
          if (prev.some(m => m.label === mood.label)) return prev.filter(m => m.label !== mood.label);
          if (prev.length >= 5) return prev;
          return [...prev, mood];
        });
      }

      async function handleSave(chosenMantra) {
        setSaving(true);
        if (chosenMantra && chosenMantra.text && onPickMantra) await onPickMantra(day.key, chosenMantra);
        await onSaved(entryMoods, journalText, note, happyHourValue, journalPrompt, hasPhysical);
        setSaving(false);
      }

      function handleRefreshAff() {
        onRefreshAff();
      }

      const moodBtn = (mood) => {
        const active = entryMoods.some(m => m.label === mood.label);
        return (
          <button key={mood.label} style={{ ...s.moodBtn, ...(active ? s.moodBtnActive : {}), position: "relative" }} onClick={() => toggleMood(mood)}>
            {active && <span style={{ position: "absolute", top: 5, right: 6, fontFamily: "'DM Mono', monospace", fontSize: 8, color: "#fff", lineHeight: 1 }}>✓</span>}
            <span style={{ fontSize: 22 }}>{mood.emoji}</span>
            <span style={{ ...s.moodBtnLabel, ...(active ? { color: "#fff" } : {}) }}>{mood.label}</span>
          </button>
        );
      };

      const dotsEl = (
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          {Array.from({ length: TOTAL }, (_, i) => (
            <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i === step - 1 ? ink : "rgba(44,59,42,0.2)", flexShrink: 0 }} />
          ))}
        </div>
      );

      const topBar = (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32 }}>
          <button style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: "0.05em", padding: 0, cursor: "pointer" }}
            onClick={step === 1 ? onBack : () => setStep(prev => prev - 1)}>← back</button>
          {dotsEl}
        </div>
      );

      const stepLabel = (text) => (
        <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.14em", textTransform: "uppercase", textAlign: "center", marginBottom: 14 }}>{text}</div>
      );

      const nextBtn = (opts = {}) => (
        <button
          onClick={opts.onPress || (step < affirmationStep ? () => setStep(prev => prev + 1) : handleSave)}
          disabled={opts.disabled || saving}
          style={{ width: "100%", background: opts.ghost ? "transparent" : ink, color: opts.ghost ? ink : cream, border: opts.ghost ? `1px solid ${ink}` : "none", boxSizing: "border-box", borderRadius: 14, padding: opts.ghost ? "15px 0" : "16px 0", fontFamily: "'DM Mono', monospace", fontSize: 13, letterSpacing: "0.05em", cursor: (opts.disabled || saving) ? "default" : "pointer", marginTop: opts.marginTop ?? 28, marginBottom: 8, opacity: (opts.disabled || saving) ? 0.4 : 1, transition: "opacity 0.2s" }}>
          {opts.label || (saving ? "Saving..." : "Next")}
        </button>
      );

      // ── Sub-view: Add mood ────────────────────────────────────────────
      if (showAddMood) return (
        <AddMoodView
          onBack={() => setShowAddMood(false)}
          onAdd={(newMood) => {
            setCustomMoods(prev => [...prev, newMood]);
            setShowAddMood(false);
          }}
        />
      );

      // ── Sub-view: Prompt picker ───────────────────────────────────────
      if (showPromptPicker) {
        if (showAddPrompt) return (
          <AddPromptView
            onBack={() => setShowAddPrompt(false)}
            onAdd={(p, mode) => {
              const next = [p, ...customPrompts];
              if (onSaveCustomPrompts) onSaveCustomPrompts(next);
              setShowAddPrompt(false);
              if (mode === "today") {
                setJournalPrompt(p);
                setShowPromptPicker(false);
              }
              // "later" — stay on prompt picker
            }}
          />
        );
        const allPrompts = [...customPrompts, ...DAILY_PROMPTS].slice(0, 10);
        return (
          <ChoosePromptView
            prompts={allPrompts}
            current={journalPrompt}
            onBack={() => setShowPromptPicker(false)}
            onSelect={(p) => { setJournalPrompt(p); setShowPromptPicker(false); }}
            onAddNew={() => setShowAddPrompt(true)}
          />
        );
      }

      // ── Sub-view: Choose a new affirmation ─────────────────────────────
      if (showChooseAff) return (
        <ChooseAffirmationView
          current={resolvedAff}
          onBack={() => setShowChooseAff(false)}
          onSelect={(idx) => { onChooseAff(idx); setShowChooseAff(false); }}
        />
      );

      // ── Step 1: Mood picker ───────────────────────────────────────────
      // Layout: a flex column that fills the screen so the Next button sits
      // 36px above the bottom edge on any phone height (it cancels Shell's
      // own bottom padding). On short screens it just scrolls.
      if (step === 1) return (
        <Shell key="checkin-1">
          <div style={{ display: "flex", flexDirection: "column", boxSizing: "border-box", minHeight: "calc(100dvh - env(safe-area-inset-top) - 20px)", paddingBottom: 28 /* + nextBtn's own 8px = 36px */, marginBottom: "calc(-60px - env(safe-area-inset-bottom))" }}>
          {topBar}
          {stepLabel("Your Mood")}
          <h2 style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 26, fontWeight: 400, fontStyle: "italic", color: ink, lineHeight: 1.3, margin: "0 0 56px", textAlign: "center" }}>How are you feeling?</h2>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 9, color: moss, letterSpacing: "0.08em", textTransform: "uppercase" }}>Select up to 5</span>
            {entryMoods.length > 0 && <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss }}>{entryMoods.length} selected</span>}
          </div>
          {/* 5×5 spectrum: rows = score band, columns = Feeling · Energy · Confidence · Connection · Optimism */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, minmax(0, 1fr))", gap: 7, marginBottom: 8 }}>{[...moodOrder.top, ...moodOrder.extra, ...customMoods].map(moodBtn)}</div>
          <div style={{ textAlign: "center", marginTop: 16, marginBottom: 28 }}>
            <button onClick={() => setShowAddMood(true)} style={{ background: "none", border: "none", fontFamily: "'DM Mono', monospace", fontSize: 11, color: moss, letterSpacing: "0.04em", cursor: "pointer" }}>+ Add a new mood</button>
          </div>
          {/* "What's behind it" — moved here from its own step so the
              Physical step's AI read can take it into account. */}
          <p style={{ fontFamily: "'Lora', Georgia, serif", fontStyle: "italic", fontWeight: 400, fontSize: 20, lineHeight: 1.4, color: ink, margin: "0 0 12px" }}>What's behind these feelings?</p>
          <AutoGrowTextarea
            value={note}
            onChange={e => setNote(e.target.value)}
            placeholder="Enter text..."
            style={{ width: "100%", background: "transparent", border: "none", resize: "none", fontFamily: "'Lora', Georgia, serif", fontSize: 16, color: ink, lineHeight: 1.7, minHeight: 110, outline: "none", display: "block", padding: 0, marginBottom: 20 }}
          />
          <div style={{ flex: 1 }} />
          {nextBtn({ disabled: entryMoods.length === 0, marginTop: 0 })}
          </div>
        </Shell>
      );

      // ── Step 2 (only when hasPhysical): Physical state ─────────────────
      // Card-based layout per Figma node 182:1420 — Activity/Sleep/Readiness
      // cards with 3-tier ink/moss/rust pills, plus an AI-generated headline
      // (overarching mindset for the day) and narrative paragraph (explains
      // the scores, translates them into how the user might feel, then
      // suggests what to do about it) — see physicalContent effect above.
      if (hasPhysical && step === 2) return (
        <Shell key="checkin-physical">
          {topBar}
          {stepLabel("Your Physical State")}
          {health ? (
            <>
              <h2 style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 26, fontWeight: 400, fontStyle: "italic", color: ink, lineHeight: 1.3, margin: "0 0 20px", textAlign: "center" }}>
                {physicalContent?.headline || "Reading your data…"}
              </h2>
              {physicalMetrics && (
                <div style={s.physicalCardRow}>
                  {physicalMetrics.map(m => (
                    <div key={m.label} style={s.physicalCard}>
                      <div style={s.physicalCardLabel}>{m.label}</div>
                      <div style={s.physicalCardValue}>{m.value}</div>
                      <div style={s.physicalCardSub}>{m.sub}</div>
                      {m.band && <span style={{ ...s.physicalPill, background: m.band.bg, color: m.band.color }}>{m.band.label}</span>}
                    </div>
                  ))}
                </div>
              )}
              <p style={s.physicalNarrative}>
                {physicalContent?.summary || "Pulling in your activity, sleep, and readiness from yesterday…"}
              </p>
            </>
          ) : (
            // Connected, but nothing's synced for today yet. Two different
            // situations look the same to a naive check (health === null),
            // so tell them apart: ouraSync.syncError means the pull itself
            // blew up (bad/expired token, Oura API error, Supabase error —
            // oura-sync still reports connected:true in this case so a
            // transient hiccup never flips the connection off, but that
            // means this is the only place the real reason surfaces). No
            // syncError just means Oura's cloud genuinely has nothing yet
            // (ring dead, out of Bluetooth range, hasn't uploaded).
            <div style={{ textAlign: "center", padding: "24px 0 8px" }}>
              <div style={{ marginBottom: 16, display: "flex", justifyContent: "center" }}>
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" style={{ color: moss }}>
                  <circle cx="12" cy="12" r="8" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" />

              </p>
            </div>

          {nextBtn()}
        </Shell>
      );

      // ── Step: Journal ────────────────────────────────────────────────
      // Prompt sits in a Bone card (same shape as the Mantra card), with
      // "Choose a new prompt" under it. The button reads "Skip" (outlined)
      // while the entry is empty and becomes "Next" once they start typing.
      if (step === journalStep) {

        return (
